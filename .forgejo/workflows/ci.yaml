# CI: validate every manifest renders & passes schema + secret checks.
# Runs on Forgejo Actions runners. Mirror to GitHub Actions if GitHub becomes leading.
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install tooling
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.53.6
        run: |
          set -euo pipefail
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kustomize kubeconform /usr/local/bin/
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o yq
          sudo install -m 0755 yq /usr/local/bin/yq
          pip install yamllint
          command -v helm >/dev/null || curl -sSfL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          # KSOPS-Stub: CI hat keinen age-Key, Secrets werden nicht gerendert.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ksops >/dev/null
          sudo chmod +x /usr/local/bin/ksops

      - name: yamllint
        run: yamllint -s .

      - name: secrets-check (no plaintext *.sops.yaml)
        run: |
          bash -n scripts/ci/check-sops.sh
          bash -n scripts/ci/test-check-sops.sh
          bash scripts/ci/test-check-sops.sh
          scripts/ci/check-sops.sh

      - name: kustomize build + kubeconform
        run: |
          set -euo pipefail
          for dir in apps/overlays/main/*/ infrastructure/base/*/; do
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "== $dir"
            kustomize build --enable-helm --enable-alpha-plugins --enable-exec "$dir" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: LiteLLM manifest contract
        run: bash -n scripts/ci/check-litellm.sh && scripts/ci/check-litellm.sh

      - name: LiteLLM policy and network probe tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=apps/base/litellm python3 -m unittest apps/base/litellm/test_request_policy.py
          python3 -m unittest apps/base/litellm/test_network_probe.py
