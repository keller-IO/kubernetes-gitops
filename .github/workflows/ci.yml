# CI: lint + validate every manifest renders & passes schema, plus a security scan.
# GitHub Actions is the leading CI path.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Exercise real dependency extraction, including CNPG and nonstandard filenames.
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate Renovate configuration and extraction
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -e HOME=/tmp -e GITHUB_COM_TOKEN \
            -v "$PWD:/repo:ro" -w /repo --entrypoint bash \
            renovate/renovate:43.280.4 scripts/ci/check-renovate.sh

  # YAML syntax / formatting.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yamllint
        run: pipx install yamllint
      - name: yamllint
        run: yamllint -s .

  # Repository safety invariants for AI-assisted GitOps changes.
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: guardrails
        run: bash -n scripts/ci/guardrails.sh && scripts/ci/guardrails.sh

  # Render every overlay (helm inflation enabled) and validate against K8s/CRD schemas.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kustomize + kubeconform + yq
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          KUSTOMIZE_VERSION: 5.8.3
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.54.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz kustomize
          curl -sSfL https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kustomize kubeconform /usr/local/bin/
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o yq
          sudo install -m 0755 yq /usr/local/bin/yq
          # KSOPS-Stub: CI hat keinen age-Key, Secrets werden nicht gerendert.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ksops >/dev/null
          sudo chmod +x /usr/local/bin/ksops

      - name: Render manifests + kubeconform
        run: |
          set -euo pipefail
          for dir in apps/overlays/main/*/ infrastructure/base/*/; do
            [ -f "$dir/kustomization.yaml" ] || continue
            echo "== $dir"
            bash scripts/render.sh "$dir" \
              | kubeconform -strict -ignore-missing-schemas -summary
          done

      - name: LiteLLM manifest contract
        run: bash -n scripts/ci/check-litellm.sh && scripts/ci/check-litellm.sh

      - name: Talos upgrade safety and preflight
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash scripts/ci/check-talos-upgrade.sh
          python3 -m unittest discover -s scripts/ci -p 'test_talos_*.py'

      - name: LiteLLM policy and network probe tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          PYTHONPATH=apps/base/litellm python3 -m unittest apps/base/litellm/test_request_policy.py
          python3 -m unittest apps/base/litellm/test_network_probe.py

  # Render every overlay/base and fail on an HPA a chart brought unasked, or
  # one that autoscales on memory. See docs/learnings/collabora-hpa-runaway.md
  # and scripts/ci/check-hpa.sh.
  hpa-safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kustomize + yq
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          KUSTOMIZE_VERSION: 5.8.3
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.54.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o yq
          sudo install -m 0755 yq /usr/local/bin/yq
          # KSOPS-Stub: CI hat keinen age-Key, Secrets werden nicht gerendert.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ksops >/dev/null
          sudo chmod +x /usr/local/bin/ksops

      - name: check-hpa
        run: bash -n scripts/ci/check-hpa.sh && scripts/ci/check-hpa.sh

  # Reject decrypted real secrets while allowing explicit blueprint placeholders.
  secrets-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        env:
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.54.1
        run: |
          set -euo pipefail
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o yq
          sudo install -m 0755 yq /usr/local/bin/yq
      - name: Reject unencrypted real *.sops.yaml
        run: |
          bash -n scripts/ci/check-sops.sh
          bash -n scripts/ci/test-check-sops.sh
          bash scripts/ci/test-check-sops.sh
          scripts/ci/check-sops.sh

  # Static security scan of the rendered manifests (misconfig) + repo (secrets).
  # Reports findings; does NOT fail the build yet — add `--exit-code 1` to enforce.
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: azure/setup-helm@v5

      - name: Install kustomize + Trivy + yq
        env:
          # renovate: datasource=github-releases depName=kubernetes-sigs/kustomize
          KUSTOMIZE_VERSION: 5.8.3
          # renovate: datasource=github-releases depName=aquasecurity/trivy
          TRIVY_VERSION: 0.75.0
          # renovate: datasource=github-releases depName=mikefarah/yq
          YQ_VERSION: 4.54.1
        run: |
          set -euo pipefail
          # Gepinnter Direkt-Download statt install_kustomize.sh: das Script fragt
          # die GitHub-API nach "latest" und läuft auf Shared-Runnern ins Rate-Limit.
          curl -sSfL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize/v${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | tar xz kustomize
          sudo mv kustomize /usr/local/bin/
          # Gepinnter Direkt-Download statt install.sh: das godownloader-Script
          # fragt die GitHub-API nach "latest" und läuft auf Shared-Runnern
          # regelmäßig ins anonyme Rate-Limit.
          curl -sSfL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar xz trivy
          sudo mv trivy /usr/local/bin/
          curl -sSfL "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" -o yq
          sudo install -m 0755 yq /usr/local/bin/yq
          # KSOPS-Stub: CI hat keinen age-Key, Secrets werden nicht gerendert.
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/ksops >/dev/null
          sudo chmod +x /usr/local/bin/ksops

      - name: Render manifests
        run: |
          set -euo pipefail
          mkdir -p rendered
          for dir in apps/overlays/main/*/ infrastructure/base/*/; do
            [ -f "$dir/kustomization.yaml" ] || continue
            name=$(echo "$dir" | tr '/' '_')
            bash scripts/render.sh "$dir" > "rendered/${name}.yaml"
          done

      - name: Trivy misconfiguration scan
        run: trivy config --severity HIGH,CRITICAL rendered

      - name: Trivy secret scan
        run: trivy fs --scanners secret --severity HIGH,CRITICAL .
