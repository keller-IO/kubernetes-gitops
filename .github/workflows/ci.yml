# GitHub is the leading CI. Both required jobs use the locked local dev shell.
name: ci

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Generate local agent configuration
        run: nix develop --command just agents-setup
      - name: Static validation, security and regression tests
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: nix develop --command just validate

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        mode: [install, upgrade]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
      - name: Install and upgrade pilot apps through ArgoCD
        env:
          CI_BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          CI_CANDIDATE_REVISION: ${{ github.sha }}
          CI_INTEGRATION_MODE: ${{ matrix.mode }}
          CI_INTEGRATION_ARTIFACTS: ${{ runner.temp }}/ci-integration
        run: nix develop --command just "integration-$CI_INTEGRATION_MODE"
      - name: Keep sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-integration-${{ matrix.mode }}-${{ github.run_id }}
          path: ${{ runner.temp }}/ci-integration
          if-no-files-found: error
          retention-days: 7

  # This stable check is the only status required by the main ruleset. A failed,
  # cancelled, skipped or missing dependency never turns into a successful gate.
  ci-required:
    if: always()
    needs: [validate, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require every safety gate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 scripts/ci/check-required.py "$NEEDS_JSON"
