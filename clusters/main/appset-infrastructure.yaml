# One Application per infrastructure/base/<component> directory.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: infrastructure
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/keller-IO/kubernetes-gitops.git
        revision: main
        directories:
          - path: infrastructure/base/*
          - path: infrastructure/base/authentik
            exclude: true
  template:
    metadata:
      name: "infra-{{.path.basename}}"
      annotations:
        # Infra syncs before apps. Intra-infra ordering = production TODO.
        argocd.argoproj.io/sync-wave: "-5"
    spec:
      project: infrastructure
      source:
        repoURL: https://github.com/keller-IO/kubernetes-gitops.git
        targetRevision: main
        path: "{{.path.path}}"
        # Native kustomize (repo-server runs it with --enable-helm --enable-alpha-plugins
        # --enable-exec + ksops in PATH; see infrastructure/base/argocd + Terraform argocd.tf).
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      # Defaulting-Rauschen unterdruecken. Ohne das stehen Apps dauerhaft auf
      # OutOfSync, obwohl nichts driftet — und echte Drift geht darin unter.
      # Siehe docs/learnings/argocd-dauerhaft-outofsync.md.
      ignoreDifferences:
        # nodePort vergibt der API-Server bei type NodePort/LoadBalancer selbst.
        - group: ""
          kind: Service
          jqPathExpressions: [".spec.ports[]?.nodePort"]
        # Der API-Server materialisiert in JEDEM eingebetteten PVC-Template eines
        # StatefulSets apiVersion, kind und status — unabhaengig von volumeMode,
        # das seit #48 explizit in Git steht. Betrifft hier authentik-valkey.
        # Bewusst NICHT /spec/volumeClaimTemplates als Ganzes: das wuerde echte
        # Drift an Groesse und StorageClass mitverstecken.
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[]?.apiVersion"
            - ".spec.volumeClaimTemplates[]?.kind"
            - ".spec.volumeClaimTemplates[]?.status"
      # Auto-sync TEMPORARILY disabled fleet-wide (#111): the repo-server can't
      # render helmCharts-apps right now, so once it's fixed every one of these
      # would auto-sync+prune simultaneously instead of app-by-app. This template
      # has no per-app override. Re-enable (restore `automated: {prune: true,
      # selfHeal: true}`) once the repo-server fix lands AND each app's drift has
      # been reviewed — see docs/learnings/argocd-helm-rendering-kaputt.md.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
