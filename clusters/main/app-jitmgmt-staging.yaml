# jitmgmt (Staging). Quellcode, Image und Manifeste liegen auf
# gitlab.jit-creatives.de; gleiches Muster wie app-tonu.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-jitmgmt-staging
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: apps
  source:
    repoURL: https://gitlab.jit-creatives.de/jit/jitmgmt.git
    targetRevision: port/newdesign-prod
    path: k8s/staging
  destination:
    server: https://kubernetes.default.svc
    namespace: jitmgmt-staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
