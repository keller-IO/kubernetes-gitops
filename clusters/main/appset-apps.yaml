# One Application per apps/overlays/main/<app> directory.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: apps
  namespace: argocd
spec:
  goTemplate: true
  generators:
    - git:
        repoURL: https://github.com/keller-IO/kubernetes-gitops.git
        revision: main
        directories:
          - path: apps/overlays/main/*
  template:
    metadata:
      name: "app-{{.path.basename}}"
      annotations:
        argocd.argoproj.io/sync-wave: "5"
    spec:
      project: apps
      source:
        repoURL: https://github.com/keller-IO/kubernetes-gitops.git
        targetRevision: main
        path: "{{.path.path}}"
        # Native kustomize (repo-server runs it with --enable-helm --enable-alpha-plugins
        # --enable-exec + ksops in PATH; see infrastructure/base/argocd + Terraform argocd.tf).
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{.path.basename}}"
      # Defaulting-Rauschen unterdruecken. Ohne das stehen Apps dauerhaft auf
      # OutOfSync, obwohl nichts driftet — und echte Drift geht darin unter.
      # Siehe docs/learnings/argocd-dauerhaft-outofsync.md.
      ignoreDifferences:
        # nodePort vergibt der API-Server bei type NodePort/LoadBalancer selbst.
        - group: ""
          kind: Service
          jqPathExpressions: [".spec.ports[]?.nodePort"]
        # Der API-Server materialisiert in JEDEM eingebetteten PVC-Template eines
        # StatefulSets apiVersion, kind und status. Das ist unabhaengig von
        # volumeMode (das steht seit #48 explizit in Git und stimmt auch) — die
        # Learnings-Tabelle hat beide Effekte auf denselben Pfad vermischt.
        # Bewusst NICHT /spec/volumeClaimTemplates als Ganzes ignorieren: das
        # wuerde echte Drift an Groesse und StorageClass mitverstecken und damit
        # genau den Signalwert zerstoeren, um den es hier geht.
        - group: apps
          kind: StatefulSet
          jqPathExpressions:
            - ".spec.volumeClaimTemplates[]?.apiVersion"
            - ".spec.volumeClaimTemplates[]?.kind"
            - ".spec.volumeClaimTemplates[]?.status"
        # Felder, die der mariadb-operator in die CR zurueckschreibt, plus einige
        # reine CRD-Schema-Defaults, die der API-Server setzt.
        #
        # /spec/image steht bewusst NICHT hier — das pinnen wir in Git (siehe
        # database.yaml), damit ein ungefragter Versionswechsel sichtbar bleibt.
        # Aus demselben Grund NICHT managedFieldsManagers: [mariadb-operator]:
        # der Operator beansprucht in managedFields auch f:image, ein Ignore per
        # Manager wuerde das Feld also wieder mitverstecken. Explizite Pointer
        # sind laenger, aber sie treffen nur, was sie treffen sollen.
        - group: k8s.mariadb.com
          kind: MariaDB
          jsonPointers:
            - /spec/port
            - /spec/serviceAccountName
            - /spec/suspend
            - /spec/tls
            - /spec/updateStrategy
            - /spec/rootEmptyPassword
            - /spec/replicasAllowEvenNumber
            - /spec/myCnfConfigMapKeyRef
            - /spec/metrics/exporter/image
            - /spec/metrics/exporter/port
            - /spec/metrics/passwordSecretKeyRef
            - /spec/metrics/username
            - /spec/metrics/serviceMonitor
            - /spec/storage/ephemeral
            - /spec/storage/resizeInUseVolumes
            - /spec/storage/volumeClaimTemplate
            - /spec/storage/waitForVolumeResize
            - /spec/passwordSecretKeyRef/generate
            - /spec/rootPasswordSecretKeyRef/generate
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
