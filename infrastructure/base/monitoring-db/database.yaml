apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: monitoring-pg
  namespace: monitoring-db
spec:
  instances: 2
  # Wie alle CNPG-Cluster: Primary + Standby auf verschiedenen Nodes, Primary-
  # Updates per Switchover (siehe paperless-ngx/database.yaml fuer die Herleitung).
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Noch nicht gemessen (neuer Cluster). Startwerte wie die anderen kleinen
  # Cluster (paperless-pg ~108Mi gemessen); nach einer Woche Betrieb an
  # `kubectl top` anpassen.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  # initdb legt nur die erste DB an. gatus_public und kite kommen ueber
  # managed.roles + Database-CRs unten, damit weitere Tools ohne Neuaufbau
  # dazukommen koennen.
  bootstrap:
    initdb:
      database: gatus
      owner: gatus
      secret:
        name: monitoring-pg-gatus
  managed:
    roles:
      - name: gatus_public
        ensure: present
        login: true
        passwordSecret:
          name: monitoring-pg-gatus-public
      - name: kite
        ensure: present
        login: true
        passwordSecret:
          name: monitoring-pg-kite
  # KEIN Backup nach Garage-S3 (bewusste, befristete Luecke, siehe ADR 0008):
  # Das S3-Secret laesst sich ohne SOPS-Empfaengerschluessel nicht aus einem
  # bestehenden Namespace uebernehmen. Ein Platzhalter-Archive-Target wuerde
  # WALs stauen, bis die Disk voll ist. Nachziehen: barmanObjectStore nach
  # s3://backups/cnpg-monitoring/ + ScheduledBackup (wie paperless-ngx).
  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: monitoring-pg-gatus-public
  namespace: monitoring-db
spec:
  cluster:
    name: monitoring-pg
  name: gatus_public
  owner: gatus_public
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: monitoring-pg-kite
  namespace: monitoring-db
spec:
  cluster:
    name: monitoring-pg
  name: kite
  owner: kite
