crds:
  enabled: true
global:
  leaderElection:
    namespace: cert-manager
replicaCount: 1
prometheus:
  enabled: true
# Requests/limits per component, sized from measured usage on keller-main
# (kubectl top pods -n cert-manager, several samples, 2026-07-28): controller
# ~36Mi, cainjector ~77Mi, webhook ~48Mi. cainjector gets extra headroom — it
# watches every CRD's CA bundle and can spike during cert-manager upgrades.
resources:
  requests: { cpu: 20m, memory: 64Mi }
  limits: { memory: 128Mi }
cainjector:
  resources:
    requests: { cpu: 20m, memory: 100Mi }
    limits: { memory: 256Mi }
webhook:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }
startupapicheck:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
# DNS-01-Self-Check direkt gegen öffentliche Resolver: die lokale Kette
# (CoreDNS → FritzBox) cacht NXDOMAIN bis zu 3600 s (SOA-Minimum der Zone)
# und blockierte so frische _acme-challenge-TXT-Records (eurooffice, 23.07.).
extraArgs:
  - --dns01-recursive-nameservers=1.1.1.1:53,8.8.8.8:53
  - --dns01-recursive-nameservers-only
