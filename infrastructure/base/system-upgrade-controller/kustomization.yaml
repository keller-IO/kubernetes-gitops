apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: system-upgrade-controller
resources:
  # Keep this published release and the controller image tag identical.
  - https://github.com/rancher/system-upgrade-controller?ref=v0.20.2
  # Declarative CRD makes Argo ordering independent of controller startup.
  - https://raw.githubusercontent.com/rancher/system-upgrade-controller/v0.20.2/pkg/crds/yaml/generated/upgrade.cattle.io_plans.yaml
  - namespace.yaml
  - job-defaults.yaml
  - talos-plan.yaml
patches:
  - path: patch-controller.yaml
  - path: patch-rbac.yaml
  - target:
      kind: Namespace
      name: system-upgrade
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: system-upgrade
images:
  - name: rancher/system-upgrade-controller
    newTag: v0.20.2
