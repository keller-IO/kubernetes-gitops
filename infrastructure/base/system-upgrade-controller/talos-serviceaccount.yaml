# Talos-mTLS-Credential fuer die Upgrade-Jobs, ohne Zertifikat in Git.
#
# Talos (machine.features.kubernetesTalosAPIAccess auf den Control Planes,
# keller-IO/infrastructure, Env kellerIO) sieht diese CR und legt im selben
# Namespace das Secret `talosconfig` mit dem Key `config` an: Client-Zertifikat
# der OS-CA, 6 h gueltig, 1 h vor Ablauf automatisch erneuert. Rotation ist
# damit Sache von Talos, nicht von Tofu oder Menschen.
#
# Rolle `os:admin`, weil MachineService/Upgrade in Talos 1.13+ genau diese
# Rolle verlangt (os:operator reicht nicht). Begrenzung: Talos erlaubt die
# Rolle nur fuer CRs im Namespace system-upgrade-controller, und nur die Jobs
# des Plans `talos` mounten das Secret.
#
# Die CRD `serviceaccounts.talos.dev` legt Talos erst an, wenn das Feature
# aktiv ist. Deshalb SkipDryRunOnMissingResource und Wave 1 (nach Namespace,
# gemeinsam mit dem Plan). Vor dem Merge muss das Feature ausgerollt sein,
# sonst scheitert der Sync dieser Ressource.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: talosconfig
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  roles:
    - os:admin
