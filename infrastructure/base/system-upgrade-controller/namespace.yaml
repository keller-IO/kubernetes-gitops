apiVersion: v1
kind: Namespace
metadata:
  name: system-upgrade-controller
  labels:
    # SUC hardcodes hostNetwork/hostPID/hostIPC and /host in generated Jobs.
    # Talos only needs TCP mTLS, but v0.20.2 has no switch to remove these mounts.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
