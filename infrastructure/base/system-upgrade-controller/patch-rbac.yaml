apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: system-upgrade-drainer
subjects:
  - kind: ServiceAccount
    name: talos-upgrade
    namespace: system-upgrade-controller
---
# Drain uses the eviction API and respects PDBs. No direct pod deletion.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: system-upgrade-controller-drainer
rules:
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, patch]
  - apiGroups: [apps]
    resources: [statefulsets, daemonsets, replicasets]
    verbs: [get, list]
