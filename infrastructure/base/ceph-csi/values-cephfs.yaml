# Externes PVE-Ceph (squid 19.2.5), dasselbe Cluster wie beim RBD-Treiber.
# Werte aus `ceph mon dump` / `ceph fs ls` auf cloud64 (06.09.2026).
csiConfig:
  - clusterID: "74747628-63a3-440d-a3f6-f4681660b858"
    monitors:
      - "192.168.2.7:6789" # mon.cloud64
      - "192.168.2.5:6789" # mon.cloud67
      - "192.168.2.4:6789" # mon.cloud65

provisioner:
  replicaCount: 1 # Homelab; auf 2 erhöhen, wenn HA gewünscht (Chart-Default ist 3)
  # Sizing vorlaeufig vom RBD-Treiber uebernommen (values-rbd.yaml), weil sich
  # ein noch nicht deployter Treiber nicht messen laesst. Nach zwei Wochen
  # Betrieb mit `kubectl top pods -n ceph-csi --containers` nachziehen --
  # der CephFS-Provisioner haelt typischerweise weniger als der RBD-.
  provisioner:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  attacher:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 96Mi }
  resizer:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 96Mi }
  snapshotter:
    resources:
      requests: { cpu: 10m, memory: 48Mi }
      limits: { memory: 96Mi }

# Wie beim RBD-Chart wird nodeplugin.plugin.resources fuer mehrere Container
# wiederverwendet; die Groesse muss den schwersten davon abdecken.
nodeplugin:
  plugin:
    resources:
      requests: { cpu: 20m, memory: 96Mi }
      limits: { memory: 256Mi }
  registrar:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 64Mi }

# Beide ceph-csi-Charts erzeugen ConfigMaps unter IDENTISCHEN Namen
# (ceph-config, ceph-csi-config, ceph-csi-encryption-kms-config). Kustomize
# bricht dann ab: "id ConfigMap/ceph-config exists; behavior must be merge or
# replace". Die CephFS-Instanz bekommt deshalb eigene Namen.
#
# Wiederverwenden waere falsch: die ceph.conf der beiden Charts ist NICHT
# gleich -- die CephFS-Variante setzt zusaetzlich `fuse_big_writes = true`
# (ceph-csi#1928, Schreibpuffer von libfuse2 sonst 2 KiB). Wuerde die
# RBD-ConfigMap mitbenutzt, ginge dieser Default still verloren.
configMapName: ceph-csi-config-cephfs
cephConfConfigMapName: ceph-config-cephfs
kmsConfigMapName: ceph-csi-encryption-kms-config-cephfs

# VORAUSSETZUNG auf der Ceph-Seite, einmalig und NICHT vom Chart erledigt:
# die Subvolume-Gruppe muss existieren, sonst scheitert jedes PVC mit
#   "rados: ret=-2 ... subvolume group 'csi' does not exist"
# und bleibt Pending. Angelegt am 06.09.2026 mit:
#   ceph fs subvolumegroup create cephfs csi
# client.kubernetes-cephfs darf das selbst (mgr 'allow rw' genuegt).
# Bei einem Neuaufbau des Ceph-Clusters daran denken.

# StorageClass + Secret verwalten wir selbst:
# SC 'ceph-fs' liegt in infrastructure/base/storage/storageclasses.yaml und
# existiert dort bereits (sie zeigte bisher ins Leere), Secret via SOPS.
storageClass:
  create: false
secret:
  create: false

# Bewusst KEINE VolumeSnapshotClass fuer CephFS: laut
# docs/PRODUCTION-READINESS.md werden produktive Snapshots erst nach einem
# erfolgreichen Restore-Test angelegt. Fuer RBD ist das verdrahtet, fuer
# CephFS steht der Test noch aus.
