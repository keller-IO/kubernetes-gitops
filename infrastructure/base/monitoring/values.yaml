victoria-metrics-operator:
  enabled: true
  # Measured ~62-83Mi RSS on keller-main (kubectl top, 2026-07-28).
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
# monitoring.coreos.com-CRDs (PodMonitor/ServiceMonitor) — cnpg und mariadb-operator
# rendern solche Ressourcen; ohne diese CRDs schlagen deren Syncs komplett fehl.
prometheus-operator-crds:
  enabled: true
vmsingle:
  spec:
    retentionPeriod: "30d"
    storage:
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
      storageClassName: ceph-rbd # CHANGE ME
    # Single-writer, 30d retention — grows over time and is already the
    # heaviest pod in this namespace (789-925Mi RSS measured on keller-main,
    # kubectl top, several samples, 2026-07-28; still climbing). No comparable
    # component on homelab (it runs VMCluster: vmstorage/vminsert/vmselect,
    # not VMSingle) so this is anchored to our own measurement with headroom
    # for growth, not the homelab vmstorage numbers.
    resources:
      requests: { cpu: 100m, memory: 1Gi }
      limits: { memory: 2Gi }
alertmanager:
  enabled: true
  # Default fullname (releaseName-chartName, since "vm-k8s-stack" doesn't contain
  # "victoria-metrics-k8s-stack") is 39 chars. The operator prefixes the
  # StatefulSet with "vmalertmanager-" (54 chars) and Kubernetes appends
  # "-<controller-revision-hash>" to that for the pod-template label, pushing it
  # past the 63-byte label-value limit — the StatefulSet then can't create pods
  # and stays 0/1. Override just this CR's name (top-level, NOT under spec: the
  # operator's VMAlertmanagerSpec has no "name" field) to keep it well under the
  # limit even with the hash suffix.
  name: vm-k8s-stack-alertmanager
  # TODO: wire a notification receiver (see AGENTS.md "Alertmanager → Notification needs to be done!")
  config:
    route:
      receiver: "null"
    receivers:
      - name: "null"
  # Homelab's vmalertmanager-vm-am-0 runs cpu:10m/mem:32Mi request, mem:128Mi
  # limit; our own measured usage is lower still (~17Mi RSS) but reused the
  # homelab anchor as-is since it has survived real operation there.
  spec:
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
# vmagent/vmalert: no comparable per-component config exists on homelab either
# (also victoria-metrics-k8s-stack there, but that cluster's values weren't
# read — only live pod resources were, and those match what's set here anyway
# for vmalert). Sized from measured usage on keller-main (kubectl top -n
# monitoring --containers, several samples, 2026-07-28): vmagent 87-117Mi,
# vmalert ~43Mi.
vmagent:
  spec:
    resources:
      requests: { cpu: 25m, memory: 128Mi }
      limits: { memory: 256Mi }
vmalert:
  spec:
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
# kube-state-metrics + prometheus-node-exporter are separate subcharts bundled
# by victoria-metrics-k8s-stack; their `resources:` keys live at these nested
# paths (verified via the subchart's own values.yaml, not just the parent
# chart's rendered --show-values doc). node-exporter is a DaemonSet on every
# node (control-plane + workers) — measured 9-22Mi per node here.
kube-state-metrics:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 128Mi }
prometheus-node-exporter:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
# Kein internes Grafana: das Haupt-Grafana (192.168.23.9) zieht VictoriaMetrics
# als Prometheus-Datasource über https://metrics.jit.services (vmsingle-ingress.yaml).
grafana:
  enabled: false
defaultDashboards:
  enabled: false # ohne internes Grafana nutzlos — Dashboards im Haupt-Grafana importieren
