controller:
  # DaemonSet statt Deployment (Phase 3, 12.09.2026). Grund: Cilium-L2-Announcements
  # sind NICHT endpoint-aware — der Announcer kann eine Node OHNE nginx-Pod sein, die
  # den Traffic dann verwirft. Genau das war der Ausfall am 22.07. nach dem
  # wrk3-Rebuild. Ein DaemonSet auf ALLEN Nodes stellt sicher, dass jede moegliche
  # Announcer-Node einen lokalen Pod hat — die Voraussetzung dafuer,
  # externalTrafficPolicy spaeter auf Local zu ziehen und die echte Client-IP zu
  # erhalten. replicaCount entfaellt, es ist bei kind: daemonset wirkungslos.
  kind: daemonset
  # cp1-3 tragen node-role.kubernetes.io/control-plane:NoSchedule. Ohne diese
  # Toleration laeuft dort kein Pod, waehrend die L2-Policy `default-l2` (ohne
  # nodeSelector) sie trotzdem zum Announcer waehlen kann ⇒ exakt die Luecke von oben.
  # Die Alternative waere ein nodeSelector in der CiliumL2AnnouncementPolicy — die
  # liegt aber in infrastructure/base/cilium/ und damit in der App `infra-cilium`,
  # deren Sync alle Cilium-Agenten neu startet und deshalb ein Wartungsfenster braucht.
  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule
  # Chart default already sets requests: {cpu:100m, memory:128Mi} — but only as
  # an unversioned default, with no memory limit. Made explicit here (matches
  # measured 65-116Mi RSS on keller-main, kubectl top, 2026-07-28; homelab's
  # ingress-nginx-nginx-ingress-controller runs leaner at cpu:10m/mem:64Mi
  # request, mem:256Mi limit — kept our request at the existing 128Mi since
  # that's what's already relied upon and it costs no extra capacity delta).
  resources:
    requests: { cpu: 100m, memory: 128Mi }
    limits: { memory: 256Mi }
  service:
    type: LoadBalancer # requires Cilium LB-IPAM or MetalLB pool — see PRODUCTION-READINESS.md
    annotations:
      # .246 fest pinnen. Ohne das vergibt Cilium LB-IPAM irgendeine freie Adresse aus
      # dem Pool .246-.249 (infrastructure/base/cilium/lb-ipam.yaml), waehrend die
      # UDM-DNAT-Regel fest auf .246 zeigt. mailman-lmtp .247 ist laengst so gepinnt.
      lbipam.cilium.io/ips: "192.168.2.246"
    # NOCH Cluster, bewusst. Der Ausfall am 22.07. entstand mit Local, WEIL nur auf
    # einer Node ein nginx-Pod lief; mit dem DaemonSet oben ist diese Bedingung weg.
    # Umgestellt wird trotzdem erst, wenn der Kanarienvogel auf .249 (eigener
    # LoadBalancer mit Local auf dieselben Pods) bewiesen hat, dass die Quell-IP von
    # aussen wirklich ankommt. Solange hier Cluster steht, wird sie weiter SNAT'ed —
    # und set-real-ip-from unten bleibt noetig.
    externalTrafficPolicy: Cluster
  config:
    # ACHTUNG: nginx-inc-Chart erwartet die Werte unter config.entries — flache
    # Keys hier werden ignoriert (ConfigMap bleibt leer, nginx nutzt Defaults).
    entries:
      proxy-protocol: "False"
      # Kein resolver-* mehr: seit NIC 5.x sind resolver-addresses/resolver-valid
      # NGINX-Plus-only — die OSS-Version verwarf sie beim Start mit
      # "requires NGINX Plus" (InvalidValue), die Keys waren also wirkungslos.
      # Wird auch nicht mehr gebraucht: binaergewitter nutzt keinen ExternalName-
      # Service, sondern einen selector-losen Service + manuelle EndpointSlice mit
      # fester IP (apps/base/binaergewitter/external-backend.yaml) — dafür ist zur
      # Laufzeit keine DNS-Auflösung nötig.
      # Defense-in-depth default so an Ingress that forgets client-max-body-size
      # doesn't silently fall back to NGINX' built-in 1m cap. Heavier apps
      # (forgejo, collabora, mastodon, ...) still override per-Ingress.
      client-max-body-size: "10m"
      # Echte Client-IP wiederherstellen. Ohne das loggt nginx für JEDEN Request
      # eine Proxy-/Node-Adresse, weil (a) der .15-Traefik davor terminiert und
      # (b) externalTrafficPolicy: Cluster die Source-IP SNAT'ed (s. o.).
      # Folge bisher: Access-Logs, Rate-Limits und CrowdSec sehen praktisch nur
      # eine einzige IP.
      # set-real-ip-from = die Peers, denen wir den XFF-Header glauben. Wegen des
      # SNAT ist der TCP-Peer NICHT .15, sondern die announcende Node — daher das
      # ganze LAN-/24 (Traefik .15, Nodes und LB-Pool .246-.249 liegen alle darin,
      # siehe infrastructure/base/cilium/lb-ipam.yaml). Bewusst kein Pod-CIDR:
      # erst verifizieren, ob nginx überhaupt Pod-Adressen als Peer sieht.
      set-real-ip-from: "192.168.2.0/24"
      real-ip-header: "X-Forwarded-For"
      real-ip-recursive: "True"
  enableSnippets: true
  ingressClass:
    name: nginx
    setAsDefaultIngress: true
prometheus:
  create: true
