# Cilium CNI for Talos. Talos manages kube-proxy replacement.
# See https://docs.cilium.io/en/stable/installation/k8s-install-helm/
ipam:
  mode: kubernetes
kubeProxyReplacement: true
# Talos: cgroup + bpf mounts handled by securityContext below.
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# k8sServiceHost/Port MUST be set on Talos (no kube-proxy).
k8sServiceHost: 127.0.0.1 # KubePrism — in der Talos machineconfig verifiziert (features.kubePrism, Port 7445)
k8sServicePort: 7445
# LB-IPAM/L2: LoadBalancer-IPs aus lb-ipam.yaml per ARP announcen (statt MetalLB).
l2announcements:
  enabled: true
# L2-Leases erzeugen deutlich mehr API-Traffic — Limits anheben (Cilium-Doku-Empfehlung).
k8sClientRateLimit:
  qps: 20
  burst: 40
# Agenten bei ConfigMap-Änderungen rollend neu starten, sonst greift neue Config nie.
rollOutCiliumPods: true
# Requests/limits, sized from measured usage (kubectl top pods -n kube-system,
# several samples, 2026-07-28): cilium-agent 199-288Mi, cilium-envoy 15-73Mi,
# cilium-operator ~62Mi, hubble-relay ~24Mi, hubble-ui backend/frontend
# ~17Mi/~4Mi. agent+envoy are DaemonSets on ALL 6 nodes (3 control-plane + 3
# workers) — factor both replica counts into node capacity math, not just the
# workers. No comparable component exists on the homelab cluster (it runs
# flannel + kube-proxy, not Cilium), so these are anchored to our own
# measurements, not a cross-cluster reference.
resources:
  requests: { cpu: 100m, memory: 256Mi }
  limits: { memory: 512Mi }
envoy:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { memory: 192Mi }
hubble:
  relay:
    enabled: true
    resources:
      requests: { cpu: 20m, memory: 64Mi }
      limits: { memory: 128Mi }
  ui:
    enabled: true
    backend:
      resources:
        requests: { cpu: 10m, memory: 48Mi }
        limits: { memory: 96Mi }
    frontend:
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 64Mi }
operator:
  replicas: 1 # bump to 2 for HA once >1 control-plane node exists
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
