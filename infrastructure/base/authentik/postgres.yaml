apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-pg
  namespace: authentik
spec:
  instances: 1 # bump to 3 for HA in production
  # Explizit gepinnt: ohne imageName waehlt der CNPG-Operator seine eigene
  # Default-Postgres-Version. Die steht dann nicht in Git, Renovate sieht sie
  # nicht, und ein Operator-Bump wechselt die DB-Version ungefragt. Dass das
  # real passiert, zeigt der Ist-Zustand: mailman-pg ist auf 16.6 gepinnt,
  # alle ungepinnten liefen auf 17.2 — Major-Divergenz als reiner Nebeneffekt.
  # Noch nicht deployt; 17.2 ist der Wert, den der Operator heute ohnehin
  # setzen wuerde — hier nur explizit gemacht.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt; der Scheduler bilanziert Nodes ausserdem nur nach Requests.
  # Genau das traf am 28.07.2026 die MariaDB-Pods (Exit 137).
  # Noch nicht live — Wert aus den baugleichen CNPG-Instanzen abgeleitet.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CHANGE ME if your RBD StorageClass differs
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-secret # uses AUTHENTIK_POSTGRESQL__PASSWORD? No — see note
  # NOTE: CNPG expects a basic-auth secret (username/password keys) for owner.
  # Create a dedicated db-secret or let CNPG generate one; align with app env. See PRODUCTION-READINESS.md.
  # Continuous backup to Ceph S3 (base backup + WAL → PITR). Schedule in backup.yaml.
  # TODO prod: in-tree barmanObjectStore deprecated in CNPG ≥1.26 → migrate to barman-cloud plugin.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://cnpg-authentik/ # CHANGE ME (bucket must exist)
      endpointURL: https://s3.jit.services # CHANGE ME (Ceph RGW)
      s3Credentials:
        accessKeyId: { name: authentik-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: authentik-backup-s3, key: SECRET_ACCESS_KEY }
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
