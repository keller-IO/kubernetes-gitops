apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd
# ArgoCD manages itself (after the one-time bootstrap install). The repo-server is
# patched to support kustomize --enable-helm AND KSOPS (SOPS/age) decryption.
helmCharts:
  - name: argo-cd
    repo: https://argoproj.github.io/argo-helm
    version: 10.9.1 # renovate: helm — keller-IO/infrastructure argocd.tf bei Minor-Sprüngen mitziehen, damit ein Neuaufbau infra-argocd rendern kann
    releaseName: argocd
    namespace: argocd
    valuesFile: values.yaml
resources:
  - ingress.yaml
generators:
  - ./secret-generator.yaml
