configs:
  cm:
    # Native kustomize handles BOTH helm inflation and the KSOPS exec plugin (SOPS
    # decryption). This MUST stay in sync with the Terraform bootstrap (argocd.tf),
    # otherwise ArgoCD self-management drifts from the initial install.
    kustomize.buildOptions: "--enable-helm --enable-alpha-plugins --enable-exec"
    resource.customizations.health.netbird.io_ClusterProxy: |
      hs = {}
      if obj.status == nil or obj.status.observedGeneration == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for ClusterProxy status"
        return hs
      end
      if obj.status.observedGeneration == -1 then
        hs.status = "Degraded"
        hs.message = "ClusterProxy reconcile failed; check netbird-operator logs"
        return hs
      end
      if obj.metadata ~= nil and obj.metadata.generation ~= nil
          and obj.status.observedGeneration < obj.metadata.generation then
        hs.status = "Progressing"
        hs.message = "Waiting for ClusterProxy generation " .. obj.metadata.generation
        return hs
      end
      hs.status = "Healthy"
      hs.message = "ClusterProxy reconciled"
      return hs
    timeout.reconciliation: 180s
    users.anonymous.enabled: "true"
  rbac:
    policy.default: role:readonly
  params:
    server.insecure: true # TLS terminated at NGINX Ingress
# Requests/limits per component. Sized from measured usage on keller-main
# (kubectl top pods -n argocd, several samples, 2026-07-28) plus headroom —
# application-controller and repo-server are the components that grow with
# app/cluster count and do real work (reconcile loop / git+helm+kustomize
# render per sync), so they get the most headroom of the bunch.
controller:
  resources:
    requests: { cpu: 200m, memory: 512Mi }
    limits: { memory: 1Gi }
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 128Mi }
redis:
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 64Mi }
repoServer:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }
  # KSOPS + a matching kustomize installed into a shared volume, plus the age key
  # for SOPS decryption. Mirrors Terraform argocd.tf (secret name: argocd-sops-age).
  env:
    - name: SOPS_AGE_KEY_FILE
      value: /home/argocd/.config/sops/age/keys.txt
  # Only ksops comes from this image now — NOT its bundled kustomize (#111: that
  # kustomize was v5.3.0, which probes helm with the removed `helm version -c`
  # flag and breaks every helmCharts-app against Argo CD's Helm 4). Argo CD's
  # own kustomize (currently v5.8.1) already runs the KSOPS exec plugin fine, so
  # nothing else needs to change. Keep this in sync with argocd.tf.
  initContainers:
    - name: install-ksops
      image: viaductoss/ksops:v4.5.1 # renovate: image=viaductoss/ksops
      command: ["/usr/local/bin/ksops", "install", "/custom-tools"]
      volumeMounts:
        - mountPath: /custom-tools
          name: custom-tools
  volumes:
    - name: custom-tools
      emptyDir: {}
    - name: sops-age
      secret:
        secretName: argocd-sops-age # created by Terraform (infrastructure/tofu .../argocd.tf)
  volumeMounts:
    - mountPath: /usr/local/bin/ksops
      name: custom-tools
      subPath: ksops
    - mountPath: /home/argocd/.config/sops/age/keys.txt
      name: sops-age
      subPath: keys.txt
dex:
  enabled: false
applicationSet:
  enabled: true
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
notifications:
  enabled: false
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 128Mi }
