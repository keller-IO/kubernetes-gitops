# KSOPS generator: decrypts the SOPS-encrypted secret at build time.
# The Argo CD repo-server runs kustomize with --enable-alpha-plugins --enable-exec
# and ksops in PATH (see infrastructure/base/argocd + Terraform argocd.tf).
#
# lapi-secret.sops.yaml liefert die LAPI-Secrets (csLapiSecret, registrationToken)
# statisch aus. Grund: der Chart generiert diese Werte selbst per
# `{{ lookup "v1" "Secret" ... }}` + `randAscii`/`randAlphaNum`-Fallback
# (_helpers.tpl). `lookup` liefert unter kustomize's Helm-Inflator (und beim
# Rendern im ArgoCD-repo-server, der ohne Cluster-Zugriff rendert) IMMER leer,
# also griff jedes Mal der Random-Fallback → neues Secret bei jedem Sync →
# Pod-Annotation `checksum/lapi-secret` ändert sich → Deployment rollt →
# Multi-Attach-Fehler auf ceph-rbd (RWO). Mit `secrets.externalSecret.name`
# gesetzt (values.yaml) rendert der Chart sein eigenes Secret gar nicht mehr,
# die lookup/rand-Helper werden nie aufgerufen — das Secret hier ist die
# einzige Quelle und bleibt über Syncs hinweg stabil.
apiVersion: viaduct.ai/v1
kind: ksops
metadata:
  name: secret-generator
  annotations:
    config.kubernetes.io/function: |
      exec:
        path: ksops
files:
  - ./secret.sops.yaml
  - ./lapi-secret.sops.yaml
