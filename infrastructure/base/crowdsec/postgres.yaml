apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-pg
  namespace: crowdsec
spec:
  instances: 1 # 3 for HA
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: crowdsec-db-app
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21, Bucket backups), wie bei
  # den anderen CNPG-Instanzen. Verliert man die DB, verliert man nur die
  # Alert-/Decision-Historie (cscli), keine Anwendungsdaten — Backup ist daher
  # niedrigere Priorität als bei den App-DBs, aber der Konsistenz halber gesetzt.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-crowdsec/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: crowdsec-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: crowdsec-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: crowdsec-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
