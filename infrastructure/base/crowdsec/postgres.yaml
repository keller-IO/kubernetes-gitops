apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec-pg
  namespace: crowdsec
spec:
  instances: 1 # 3 for HA
  # Explizit gepinnt: ohne imageName waehlt der CNPG-Operator seine eigene
  # Default-Postgres-Version. Die steht dann nicht in Git, Renovate sieht sie
  # nicht, und ein Operator-Bump wechselt die DB-Version ungefragt. Dass das
  # real passiert, zeigt der Ist-Zustand: mailman-pg ist auf 16.6 gepinnt,
  # alle ungepinnten liefen auf 17.2 — Major-Divergenz als reiner Nebeneffekt.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt; der Scheduler bilanziert Nodes ausserdem nur nach Requests.
  # Genau das traf am 28.07.2026 die MariaDB-Pods (Exit 137).
  # Gemessen am 28.07.2026: ~76Mi im Betrieb.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: crowdsec-db-app
  # Backup nach Garage-S3 (192.168.23.21, Bucket backups) — nachgezogen am
  # 12.09.2026. Vorher hatte dieser Cluster als einziger neben expense-pg gar
  # keine Sicherung: archive_mode stand zwar auf on, das archive_command des
  # Instance-Managers lief aber ohne Ziel ins Leere, die Zaehler in
  # pg_stat_archiver waren daher irrefuehrend.
  # Eigener Garage-Key cnpg-crowdsec (RW nur auf diesen Bucket).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-crowdsec/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: crowdsec-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: crowdsec-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: crowdsec-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
