apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
# Intrusion detection: an agent DaemonSet parses per-pod logs (nginx-inc ingress,
# WordPress) and raises alerts/decisions in the LAPI. Detection-only for now —
# no bouncer wired up yet, see values.yaml and PRODUCTION-READINESS.md.
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.0 # renovate: helm
    releaseName: crowdsec
    namespace: crowdsec
    valuesFile: values.yaml
resources:
  - postgres.yaml
  - backup.yaml

# The chart ships two `helm.sh/hook: test` Pods. We inflate with native kustomize,
# not Helm, so that annotation carries no weight here and ArgoCD would otherwise
# reconcile them as ordinary Pods. Drop them.
patches:
  - target: { kind: Pod, name: crowdsec-test-agent }
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: crowdsec-test-agent
      $patch: delete
  - target: { kind: Pod, name: crowdsec-test-lapi-up }
    patch: |
      apiVersion: v1
      kind: Pod
      metadata:
        name: crowdsec-test-lapi-up
      $patch: delete

generators:
  - ./secret-generator.yaml
