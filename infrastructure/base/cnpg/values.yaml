replicaCount: 1
monitoring:
  podMonitorEnabled: true
  grafanaDashboard:
    create: true
# Measured ~40Mi RSS on keller-main (kubectl top, 2026-07-28). Matches the
# homelab reference exactly (cnpg-system-cnpg-cloudnative-pg deployment there
# runs cpu:25m/mem:128Mi request, mem:256Mi limit) — reused verbatim.
resources:
  requests: { cpu: 25m, memory: 128Mi }
  limits: { memory: 256Mi }
# In-place-Update des Instance-Managers bei Operator-Upgrades: der neue Binary
# uebernimmt den laufenden Postmaster, PostgreSQL wird NICHT neu gestartet.
# Alle Cluster laufen mit instances: 1 - ein rollendes Update wuerde jede
# Datenbank kurz stoppen. Siehe docs/runbooks/cnpg-operator-upgrade-1.30.md.
config:
  data:
    ENABLE_INSTANCE_MANAGER_INPLACE_UPDATES: "true"
