apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbird
# NetBird kube-API-Proxy: macht die Kubernetes-API über das NetBird-Netz
# erreichbar und übersetzt die NetBird-Identität in K8s-Impersonation.
#
# Bewusst KEIN Agent-DaemonSet: die Nodes sind bereits NetBird-Peers (Gruppe
# `talos`) — ein DaemonSet würde pro Node einen zweiten Peer registrieren.
helmCharts:
  - name: netbird-operator
    repo: oci://ghcr.io/netbirdio/helm-charts
    version: 0.8.0 # renovate: helm
    releaseName: netbird
    namespace: netbird
    valuesFile: values.yaml
    includeCRDs: true # netbird.io-CRDs liegen im crds/-Ordner; ohne das fehlen sie
resources:
  - namespace.yaml
  - netbird-config.yaml
  - rbac.yaml

generators:
  - ./secret-generator.yaml
