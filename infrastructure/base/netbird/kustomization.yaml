apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: netbird
# NetBird: Agent-Peer pro Node + kube-API-Proxy für kubectl-Zugriff über das
# NetBird-Netz. Gruppen/Policy werden vom Operator in netbird.jit.services angelegt.
helmCharts:
  - name: netbird-operator
    repo: oci://ghcr.io/netbirdio/helm-charts
    version: 0.8.0 # renovate: helm
    releaseName: netbird
    namespace: netbird
    valuesFile: values.yaml
    includeCRDs: true # netbird.io-CRDs liegen im crds/-Ordner; ohne das fehlen sie
resources:
  - namespace.yaml
  - daemonset.yaml
  - netbird-config.yaml
  - rbac.yaml

generators:
  - ./secret-generator.yaml
