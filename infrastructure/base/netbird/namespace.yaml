apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  labels:
    # Der Agent-DaemonSet braucht hostNetwork + NET_ADMIN — PSA muss das zulassen.
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/audit: privileged
    pod-security.kubernetes.io/warn: privileged
# Bewusst KEIN netbird.io/webhook=enabled hier (siehe values.yaml): das Chart rendert nur den
# Sidecar-Injection-Webhook für Pods (die Validating-Webhooks hängen an
# ingress.enabled, das wir nicht nutzen). Sidecar-Injection brauchen wir nicht —
# und mit failurePolicy: Fail würde das Label bedeuten, dass ein ausgefallener
# Operator die Erzeugung der Agent-Pods in genau diesem Namespace blockiert.
