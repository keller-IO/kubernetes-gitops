apiVersion: v1
kind: Namespace
metadata:
  name: netbird
  labels:
    # Der NetBird-Operator rendert ClusterProxy-Pods ohne seccompProfile und die
    # ClusterProxy-CRD bietet dafür keinen PodTemplate-Hook. Baseline ist der
    # kleinste GitOps-Workaround; warn/audit bleiben auf restricted, damit ein
    # upstream-fähiger Fix sichtbar bleibt.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
# Bewusst KEIN netbird.io/webhook=enabled (siehe values.yaml): das Chart rendert nur
# den Sidecar-Injection-Webhook für Pods, den brauchen wir nicht — und mit
# failurePolicy: Fail würde das Label einen ausgefallenen Operator zum Blocker für
# Pod-Creates in genau diesem Namespace machen.
