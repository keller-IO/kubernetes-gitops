# Identitäts-Mapping für den kube-API-Proxy.
#
# Der Proxy authentifiziert den NetBird-Nutzer und impersoniert ihn gegenüber der
# API — die NetBird-Gruppennamen kommen dabei als Kubernetes-Groups an. Deshalb
# stehen die Gruppennamen hier zwangsläufig im Klartext: ein ClusterRoleBinding
# kann seine subjects nicht aus einem Secret beziehen.
---
# Impersonation-Rechte für den Proxy.
#
# Der Operator legt das NICHT an (v0.8.0 erzeugt nur SetupKey, Secret und das
# Proxy-Deployment; sein eigenes ClusterRole enthält keine einzige
# impersonate-Regel). Upstream liefert das als Beispiel-Manifest zum Selbstbauen.
#
# Der Proxy reicht ALLE Gruppen eines Peers als Impersonate-Group-Header weiter,
# und die API verlangt impersonate-Recht für JEDE davon — fehlt eine, fliegt die
# ganze Anfrage. Peers tragen aber neben k8s_admin/k8s_readonly noch beliebige
# andere NetBird-Gruppen (All, bgt, admin, …). Eine resourceNames-Allowlist müsste
# die alle enthalten und bei jeder neuen Gruppe nachgezogen werden — fragil, und
# sie koppelt unbeteiligte NetBird-Gruppen an dieses RBAC.
#
# Daher bewusst KEIN resourceNames: impersonate auf beliebige User/Gruppen. Der
# Sicherheitsgewinn einer Allowlist wäre hier ohnehin gering — ihr einziger Zweck
# wäre, eine Gruppe namens `system:masters` (umgeht RBAC) abzufangen; wer aber in
# NetBird Gruppen verwalten kann, setzt sich genauso in k8s_admin (-> cluster-admin).
# Die echte Vertrauensgrenze ist die NetBird-Gruppenverwaltung, nicht diese Regel.
# Rechte bekommt eine Gruppe erst durch ein ClusterRoleBinding unten (k8s_admin,
# k8s_readonly, k8s_ops) — All/bgt/admin sind an nichts gebunden und damit wirkungslos.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-clusterproxy
rules:
  - apiGroups: [""]
    resources: [users, groups]
    verbs: [impersonate]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-clusterproxy
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-clusterproxy
subjects:
  - kind: ServiceAccount
    name: netbird-clusterproxy
    namespace: netbird
---
# k8s_admin -> volle Rechte.
# Bewusst cluster-admin, weil "Admin-Gruppe" genau das meint. Zu bedenken: damit
# hängt Cluster-Admin an einer VPN-behaupteten Gruppenzugehörigkeit, die in
# NetBird (nicht in Git) verwaltet wird. Wer dort Gruppen ändern darf, kann sich
# selbst zum Cluster-Admin machen — ohne Spur im Kubernetes-Audit-Log.
# Engere Alternative siehe docs/PRODUCTION-READINESS.md, Abschnitt 17.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_admin
---
# k8s_readonly, Teil 1: der eingebaute `view`.
# `view` enthält upstream KEINE Secrets, kein pods/exec|attach|portforward, kein
# serviceaccounts/token. Er aggregiert zusätzlich alle ClusterRoles mit dem Label
# rbac.authorization.k8s.io/aggregate-to-view=true.
# ACHTUNG: diese Aggregation ist ein ungeprüfter Fremdkanal — jedes Chart kann
# darüber Rechte in `view` schieben (mariadb-operator aggregiert z.B. k8s.mariadb.com/*
# als Wildcard). Bei Chart-Updates im Blick behalten.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-readonly-view
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_readonly
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_ops
---
# k8s_readonly, Teil 2: alles, was `view` nicht abdeckt.
# RBAC kennt kein "deny" — "alles außer Credentials" ist nur als Positivliste
# baubar. Bewusst NICHT enthalten: `secrets` und `certificatesigningrequests`
# (deren status.certificate ist zwar nur öffentliches Zertifikatsmaterial, aber
# der Ausstellungs-Verlauf ist gute Aufklärung für Angreifer — bleibt draußen).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-cluster-reader
rules:
  # --- cluster-weite Kern-Objekte ---
  - apiGroups: [""]
    resources: [nodes, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [events.k8s.io]
    resources: [events] # `kubectl events` nutzt diese Gruppe, nicht core/v1
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses, csidrivers, csinodes, csistoragecapacities, volumeattachments, volumeattributesclasses]
    verbs: [get, list, watch]
  - apiGroups: [apiextensions.k8s.io]
    resources: [customresourcedefinitions]
    verbs: [get, list, watch]
  - apiGroups: [apiregistration.k8s.io]
    resources: [apiservices]
    verbs: [get, list, watch]
  - apiGroups: [admissionregistration.k8s.io]
    resources:
      [
        mutatingwebhookconfigurations,
        validatingwebhookconfigurations,
        validatingadmissionpolicies,
        validatingadmissionpolicybindings,
        mutatingadmissionpolicies,
        mutatingadmissionpolicybindings,
      ]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses, servicecidrs, ipaddresses]
    verbs: [get, list, watch]
  - apiGroups: [scheduling.k8s.io]
    resources: [priorityclasses]
    verbs: [get, list, watch]
  - apiGroups: [node.k8s.io]
    resources: [runtimeclasses]
    verbs: [get, list, watch]
  - apiGroups: [flowcontrol.apiserver.k8s.io]
    resources: [flowschemas, prioritylevelconfigurations]
    verbs: [get, list, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch]
  - apiGroups: [certificates.k8s.io]
    resources: [clustertrustbundles]
    verbs: [get, list, watch]
  - apiGroups: [metrics.k8s.io]
    resources: [nodes, pods]
    verbs: [get, list, watch]
  # Wer darf was — verrät die Rechtestruktur (und damit lohnende Ziele), aber
  # keine Credentials. Für eine Ops-Rolle vertretbar; Mitgliedschaft in
  # k8s_readonly ist deshalb trotzdem kein Selbstbedienungsladen.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [clusterroles, clusterrolebindings, roles, rolebindings]
    verbs: [get, list, watch]
  # --- CRDs dieses Clusters, die NICHT aggregate-to-view mitbringen ---
  # Ohne diese Regeln sieht k8s_readonly weder Postgres-Cluster noch ArgoCD-Apps
  # noch Cilium-Policies — also genau das, was man üblicherweise nachschauen will.
  - apiGroups: [postgresql.cnpg.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [argoproj.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [cilium.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [k8s.nginx.org, externaldns.nginx.org]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [netbird.io]
    resources: ["*"]
    verbs: [get, list, watch]
  - apiGroups: [objectbucket.io]
    resources: ["*"]
    verbs: [get, list, watch]
  # cert-manager aggregiert Certificates/Issuers selbst, ClusterIssuer aber nicht
  # (dessen Label zielt auf OpenShifts cluster-reader).
  - apiGroups: [cert-manager.io]
    resources: [clusterissuers]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-readonly-cluster
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-cluster-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_readonly
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_ops
---
# k8s_ops: gezielte Schreibrechte zum Entstallen von Workloads.
#
# WARUM SO ENG (verschärft am 2026-07-29, siehe Audit-Notiz unten): RBAC kennt keine
# Feld-Restriktion, nur Verb+Resource. Jedes Recht, das die PodSpec eines Workloads
# kontrolliert — Jobs anlegen, oder Deployments/StatefulSets/DaemonSets/ReplicaSets
# patchen/updaten —, erlaubt der haltenden Identität, in der PodSpec einen beliebigen
# Secret-Mount/`envFrom: secretRef` zu setzen UND/ODER `serviceAccountName` auf eine
# beliebige, bereits existierende ServiceAccount im Namespace umzubiegen. Letzteres
# ist schlimmer als ein Secret-Read: der Kubelet mountet das Token der referenzierten
# ServiceAccount automatisch als projected volume — das braucht KEIN
# `serviceaccounts/token`-Recht (das ist eine andere API, `TokenRequest`, die nur
# beim expliziten Minten via API-Call greift, nicht beim impliziten Auto-Mount durch
# den Kubelet). Beispiel: `serviceAccountName: argocd-application-controller` in
# einem selbst angelegten Job im Namespace `argocd` liefert ein gültiges Token mit
# `*/* -> [*]` (ClusterRole `argocd-application-controller`, per `kubectl get
# clusterrole argocd-application-controller -o yaml` verifiziert) — de facto
# Cluster-Admin, ganz ohne je ein Secret-Objekt zu lesen. Das gilt clusterweit, weil
# `netbird-k8s-ops-maintainer` eine ClusterRole ist und kaum ein Namespace hier
# PodSecurity restriktiv genug durchsetzt, um das zu verhindern (`kubectl get ns -o
# ...pod-security.kubernetes.io/enforce` zeigt für die meisten Namespaces gar kein
# Enforce-Label, faktisch unrestricted; nur `crowdsec`/`monitoring`/`ceph-csi` haben
# explizit `privileged` gesetzt, `netbird` nur `baseline` — kein Namespace erzwingt
# `restricted`). Per SubjectAccessReview verifiziert (2026-07-29, read-only, kein
# Live-Objekt angelegt): `create jobs` im Namespace `argocd` UND `netbird` war mit
# der alten Rolle erlaubt, ebenso `patch daemonsets`/`deployments`/... überall.
#
# Deshalb bewusst NICHT (mehr) enthalten, über den alten Ausschluss hinaus:
# - `batch/jobs|cronjobs: create|patch|update` — jede dieser Verben gibt volle
#   PodSpec-Kontrolle (Secret-Mount, envFrom, serviceAccountName-Hijack). Kostet:
#   ein Backup-CronJob lässt sich über `k8s_ops` nicht mehr manuell nachtriggern
#   (klassisch `kubectl create job --from=cronjob/...`, braucht `jobs: create`).
#   Verblieben ist nur `jobs: delete`, um ein bereits gescheitertes/hängendes
#   Job-Objekt aufzuräumen — das rührt keine PodSpec an.
# - `apps/deployments|statefulsets|daemonsets|replicasets` als Objekte (nicht die
#   Scale-Subresource) — patchen bedeutet PodSpec-Kontrolle, exakt wie oben. Damit
#   fällt `kubectl rollout restart` weg; das eigentliche Ziel „wedged Workload neu
#   starten" erreicht `pods: delete` bereits: der Controller baut den Pod aus dem
#   unveränderten Template neu, ohne dass `k8s_ops` das Template je anfasst. Scale
#   bleibt (`*/scale`, nur `spec.replicas` + Selector, keine PodSpec-Felder) für
#   „Deployment hoch-/runterskalieren". DaemonSets haben keine Scale-Subresource,
#   deshalb hier komplett ohne Schreibrecht — Restart läuft auch dort über
#   `pods: delete` (der DaemonSet-Controller stellt den Pod auf demselben Node neu her).
# - `argoproj.io/applications: patch|update` — erlaubt, `spec.source` auf ein
#   angreiferkontrolliertes Repo/Pfad umzubiegen; ArgoCD wendet das dann mit den
#   eigenen, clusterweiten `*/* -> [*]`-Rechten an (ClusterRole
#   `argocd-application-controller`, s. o.) — keine Secret-Lektüre, sondern volle
#   Cluster-Übernahme in einem Schritt. Für „hängenden Sync abbrechen" ist
#   Kubernetes-RBAC ohnehin der falsche Hebel: die API kann „Sync terminieren" nicht
#   von „Source umbiegen" unterscheiden. Das gehört in ArgoCDs eigenes RBAC
#   (`argocd-rbac-cm`, Aktion `sync` — laut ArgoCD-Server-Quellcode hängt auch
#   `TerminateOperation` an der `sync`-Aktion, es gibt keinen eigenen
#   `terminate`-Verb). Aktuell nicht nutzbar: `argocd-rbac-cm` hat kein `policy.csv`
#   (nur `policy.default: role:readonly`), und ArgoCD hat keine SSO/OIDC-Anbindung
#   (`argocd-cm` ohne `dex.config`/`oidc.config`, dafür `users.anonymous.enabled:
#   "true"` — ein separater, hier nicht behobener Befund) — NetBird-Gruppen sind
#   ArgoCD schlicht unbekannt. Empfehlung für einen Folge-PR (außerhalb dieses
#   Scopes): ArgoCD-SSO verdrahten, dann in `argocd-rbac-cm` etwas wie
#   `p, role:ops, applications, sync, */*, allow` + `g, k8s_ops, role:ops` ergänzen
#   — Kosten: Login in ArgoCD statt reinem kubectl, plus die SSO-Anbindung selbst.
#
# Weiterhin bewusst NICHT enthalten (wie im alten Kommentar): secrets,
# serviceaccounts/token, RBAC-Schreibrechte, escalate/bind/impersonate,
# pods/exec|attach|portforward, pods/ephemeralcontainers.
#
# Restrisiko, das damit NICHT behoben ist (dokumentiert statt verschwiegen):
# `pods: delete` und `pods/eviction: create` bleiben ein clusterweites
# Denial-of-Service-Primitiv — jeder in `k8s_ops` kann jeden Pod in jedem Namespace
# löschen/evicten (z. B. den CNPG-Primary und damit ein Failover auslösen). Das ist
# der Preis von Requirement (a); es liest oder schreibt aber keine Credentials.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: netbird-k8s-ops-maintainer
rules:
  # Pod löschen/evicten: stellt einen wedged Workload aus seinem unveränderten
  # Template neu her (Deployment-/StatefulSet-/DaemonSet-Controller reconciled ihn),
  # ohne dass k8s_ops die PodSpec je sieht oder anfasst. Eviction respektiert
  # PodDisruptionBudgets und ist deshalb der sanftere Weg; delete bleibt als
  # Fallback, falls ein PDB die Eviction blockiert.
  - apiGroups: [""]
    resources: [pods]
    verbs: [delete]
  - apiGroups: [""]
    resources: [pods/eviction]
    verbs: [create]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [events.k8s.io]
    resources: [events]
    verbs: [create]
  # Nur die Scale-Subresource: deren Objekt enthält ausschließlich
  # spec.replicas/status.replicas + Selector, keine PodSpec-Felder — deshalb ohne
  # Risiko für Requirement (b). DaemonSets haben keine Scale-Subresource und daher
  # hier keine Zeile (siehe Begründung oben, warum das volle Objekt fehlt).
  - apiGroups: [apps]
    resources: [deployments/scale, statefulsets/scale, replicasets/scale]
    verbs: [patch, update]
  # Nur delete: räumt ein bereits gescheitertes/hängendes Job-Objekt auf, ohne
  # jemals eine PodSpec zu setzen. create/patch/update bewusst draußen (s. o.).
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: netbird-k8s-ops-maintainer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: netbird-k8s-ops-maintainer
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: k8s_ops
