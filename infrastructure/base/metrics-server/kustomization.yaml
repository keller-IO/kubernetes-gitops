apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metrics-server
# Provides the metrics.k8s.io APIService (kubectl top, HPA). See values.yaml for
# the Talos kubelet-serving-certificate trade-off.
helmCharts:
  - name: metrics-server
    repo: https://kubernetes-sigs.github.io/metrics-server/
    version: 3.13.1 # renovate: helm
    releaseName: metrics-server
    namespace: metrics-server
    valuesFile: values.yaml
