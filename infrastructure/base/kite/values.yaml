# Kite — lightweight Kubernetes dashboard.
replicaCount: 1

resources:
  requests: { cpu: 100m, memory: 128Mi }
  limits: { memory: 256Mi }

# In-cluster access. Chart creates the ServiceAccount + ClusterRole/Binding.
serviceAccount:
  create: true
rbac:
  create: true

# Postgres im gemeinsamen Cluster monitoring-pg (ADR 0008), seit 19.10.2026;
# vorher SQLite auf der PVC kite-storage (bleibt als Rueckfallstand, pvc.yaml).
# Kein RWO-Volume mehr am Pod, daher RollingUpdate statt Recreate.
deploymentStrategy:
  type: RollingUpdate
db:
  type: postgres
# Mit db.type != sqlite erwartet das Chart DB_TYPE/DB_DSN im existingSecret
# (kite-secrets). Die DSN liegt aber im eigenen Secret kite-db, deshalb hier
# explizit; env hat Vorrang vor envFrom.
# Plugins: ohne PVC liegen Plugin-Dateien unter /data/plugins im Container.
# Offizielle Plugins laedt Kite anhand der DB-Eintraege neu herunter.
extraEnvs:
  - name: DB_TYPE
    value: postgres
  - name: DB_DSN
    valueFrom:
      secretKeyRef:
        name: kite-db
        key: DB_DSN

# JWT signing, data-encryption key and OAuth client secret come from the SOPS
# secret. The chart mounts it via envFrom, so every key becomes an env var and
# can be referenced as ${KEY} in the config below.
secret:
  create: false
  existingSecret: kite-secrets

config:
  enabled: true
  # Login mit Super-User (Passwort aus kite-secrets), bis der Keycloak-Client
  # im Realm bgt existiert und das OAuth-Secret passt.
  superUser:
    username: admin
    password: ${KITE_SUPERUSER_PASSWORD}
  oauth:
    - name: keycloak
      clientId: kite
      clientSecret: ${OAUTH_CLIENT_SECRET} # from kite-secrets
      issuer: https://auth.savar.de/realms/bgt
      scopes: openid,profile,email
      enabled: false # aktivieren, sobald Keycloak-Client und Secret passen

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
  hosts:
    - host: kite.jit.services # CHANGE ME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: kite-tls
      hosts:
        - kite.jit.services # CHANGE ME
