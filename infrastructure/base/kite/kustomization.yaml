apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kite
# Lightweight Kubernetes dashboard. In-cluster RBAC + optional Keycloak OIDC (see values.yaml).
helmCharts:
  - name: kite
    repo: https://kite-org.github.io/kite
    version: 0.16.0 # renovate: helm
    releaseName: kite
    namespace: kite
    valuesFile: values.yaml

resources:
  - pvc.yaml
  # Einmal-Migration SQLite -> Postgres. Nach der Umstellung entfernen.
  - migration/rbac.yaml
  - migration/hooks.yaml

generators:
  - ./secret-generator.yaml

# Skripte lokal gegen Kite v0.16.0 getestet (SQLite mit Testdaten -> Postgres
# 17.2, danach Login, Secret-Entschluesselung und neue Inserts geprueft).
# Ebenfalls PreSync-Hook (Wave -3), damit die Skripte vor den Jobs existieren.
configMapGenerator:
  - name: kite-pg-migration
    options:
      annotations:
        argocd.argoproj.io/hook: PreSync
        argocd.argoproj.io/sync-wave: "-3"
        argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    files:
      - migration/export.sh
      - migration/import.sh
      - migration/import.sql
      - postgres-schema.sql=migration/postgres-schema-v0.16.0.sql

# startupProbe nachruesten. Das Chart (0.15.0) kennt keinen startupProbe-Schluessel in
# values.yaml — ein Eintrag dort wird still ignoriert, geprueft per kustomize build.
# Deshalb als Patch.
# Grund (gemessen 13.09.2026 beim Sprung auf v0.15.0): bis "Kite server started on port
# 8080" vergehen rund 24 s, mit Schwankung durch Prometheus-Discovery und
# K8s-Client-Init. Die Liveness toleriert nur initialDelay 10 + 3 x 10 s = 40 s und hat
# den Container zweimal gekillt, bevor er fertig war. Mit startupProbe ist die Liveness
# bis zu 30 x 5 s = 150 s ausgesetzt; danach gelten die normalen Probes unveraendert.
patches:
  - target: { kind: Deployment, name: kite }
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/startupProbe
        value:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
          failureThreshold: 30
