apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kimai
# kimai.savar.de läuft noch über den .15-Traefik, hat seit PR #149 aber ein
# eigenes Cluster-Zertifikat (kimai-tls, cert-manager). redirect-to-https steht
# seit 12.09.2026 auf "true".
# Die alte 301-Loop-Sorge galt nur für ssl-redirect: das entscheidet am Schema
# und würde hinter einem TLS-terminierenden Proxy tatsächlich endlos umleiten.
# redirect-to-https entscheidet dagegen an X-Forwarded-Proto, das Traefik auf
# "https" setzt — also kein Redirect, solange .15 davorsteht. Live geprüft am
# 12.09. an elf bereits umgestellten Hosts: kein einziger nginx-Redirect.
# ssl-redirect bleibt bis zum 443-Cutover "false".
resources:
  - ../../../base/kimai
patches:
  - target: { kind: Ingress, name: kimai }
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.org~1redirect-to-https
        value: "true"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: kimai.savar.de
      - op: replace
        path: /spec/rules/0/host
        value: kimai.savar.de
  - target: { kind: Deployment, name: kimai }
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/4/value
        value: kimai.savar.de|kimai.jit.services|localhost|127.0.0.1|kimai|nginx|traefik
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: kimai.savar.de
