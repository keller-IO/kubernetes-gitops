# Offsite-Backup von WordPress 1: PVC wordpress -> Garage Potsdam, Bucket backup-wordpress.
#
#   files-wordpress-1/current/         Spiegel von /var/www/html (rclone sync)
#   files-wordpress-1/archive/<Zeit>/  von sync geloeschte/ueberschriebene Dateien, 30 Tage
#   files-wordpress-1/last-run.txt     Heartbeat
#
# Gesichert wird das ganze Webroot (wp-config.php mit Salts, wp-content mit Uploads,
# Plugins, Themes). Ausgenommen: wp-content/cache, upgrade und upgrade-temp-backup.
# Die Datenbank sichert der mariadb-operator (backup.yaml, mariadb-wordpress-N).
# Dieser CronJob liegt im Overlay, nicht in der Base: wordpress-3 (0 Replicas) teilt die
# Base und soll keinen Backup-Pod bekommen, der mangels Ziel-Pod ewig Pending bliebe.
#
# Dateien gehoeren www-data (33:33), alle world-readable; der App-Container laeuft als root.
# Instanzen teilen Bucket und Key, nur der Prefix unterscheidet sich (wie bei den MariaDB-
# Dumps). Die PVC ist RWO: podAffinity auf app.kubernetes.io/name=wordpress
# (im Namespace wordpress-1 traegt nur das Deployment dieses Label).
# Namespace ohne PodSecurity-Labels; der Pod ist restricted-konform.
#
# Offen nach dem Merge (Abnahme): Garage-Bucket/-Key backup-wordpress pruefen, ersten Lauf anstossen,
# Restore-Test. Das Secret wordpress-files-backup-s3 liegt verschluesselt in Git und ist eingebunden
# (secret-generator.yaml). Fehlt ein Key im Secret oder stimmt der Name nicht, scheitert der Pod
# mit CreateContainerConfigError (KubeJobFailed); Ursache steht in den Pod-Events.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wordpress-offsite-backup
  namespace: wordpress-1
  labels:
    app.kubernetes.io/name: wordpress-offsite-backup
    app.kubernetes.io/part-of: wordpress
    app.kubernetes.io/component: offsite-backup
spec:
  schedule: "40 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Abgeschlossene Jobs verschwinden nach 7 Tagen, damit ein laengst
      # abgeloester Fehllauf KubeJobFailed nicht dauerhaft aktiv haelt.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          # Bewusst ohne app.kubernetes.io/instance und mit eigenem name-Wert:
          # Deployment und Service selektieren auf app.kubernetes.io/name=wordpress.
          labels:
            app.kubernetes.io/name: wordpress-offsite-backup
            app.kubernetes.io/part-of: wordpress
            app.kubernetes.io/component: offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: wordpress
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2 # renovate: image=rclone/rclone
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  rclone sync /data garage:backup-wordpress/files-wordpress-1/current \
                    --exclude "/lost+found/**" \
                    --exclude "/wp-content/cache/**" \
                    --exclude "/wp-content/upgrade/**" \
                    --exclude "/wp-content/upgrade-temp-backup/**" \
                    --backup-dir "garage:backup-wordpress/files-wordpress-1/archive/${STAMP}" \
                    --checksum --stats-one-line --stats 0 -v
                  rclone delete garage:backup-wordpress/files-wordpress-1/archive --use-server-modtime --min-age 30d --rmdirs -v
                  date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/last-run
                  rclone copyto /tmp/last-run garage:backup-wordpress/files-wordpress-1/last-run.txt
                  rclone size garage:backup-wordpress
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # existiert nicht (harmloser NOTICE); Remote kommt aus RCLONE_CONFIG_*
                - { name: RCLONE_CACHE_DIR, value: /tmp/cache }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://192.168.23.21:3900" }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                # Der Key darf keine Buckets anlegen; ohne no_check_bucket scheitert
                # rclone vor jedem Upload an CreateBucket (403).
                - { name: RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_GARAGE_REGION
                  valueFrom: { secretKeyRef: { name: wordpress-files-backup-s3, key: region } }
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: wordpress-files-backup-s3, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: wordpress-files-backup-s3, key: SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: wordpress
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
