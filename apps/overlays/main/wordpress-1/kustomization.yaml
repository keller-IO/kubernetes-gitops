apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wordpress-1
# Instanz "jugend". Läuft noch über den .15-Traefik, hat seit PR #149 aber ein
# eigenes Cluster-Zertifikat (wordpress-tls für jugendbeauftragter-halbe.de +
# www.). redirect-to-https steht seit 12.09.2026 auf "true": die Annotation
# entscheidet an X-Forwarded-Proto (von Traefik auf "https" gesetzt), nicht am
# Schema — die alte Loop-Sorge galt für ssl-redirect, das bis zum 443-Cutover
# "false" bleibt.
resources:
  - ../../../base/wordpress
patches:
  - target: { kind: Ingress }
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.org~1redirect-to-https
        value: "true"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: jugendbeauftragter-halbe.de
      - op: add
        path: /spec/tls/0/hosts/-
        value: www.jugendbeauftragter-halbe.de
      - op: replace
        path: /spec/rules/0/host
        value: jugendbeauftragter-halbe.de
      - op: add
        path: /spec/rules/-
        value:
          host: www.jugendbeauftragter-halbe.de
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: wordpress
                    port:
                      number: 80
  - target: { kind: Backup, name: wordpress-mariadb }
    patch: |
      - op: replace
        path: /spec/storage/s3/prefix
        value: mariadb-wordpress-1
