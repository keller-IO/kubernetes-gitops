# Zertifikat fuer die oeffentlichen Hosts (DNS-01), genutzt von ingress-public.yaml
# und ingress-redirect.yaml.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jitmgmt-www
  namespace: jitmgmt
spec:
  secretName: jitmgmt-www-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-prod
  dnsNames:
    - www.jit-creatives.de
    - www.jitcreatives.de
