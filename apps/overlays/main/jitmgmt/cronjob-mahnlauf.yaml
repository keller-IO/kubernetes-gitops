# Mahnlauf: Zahlungserinnerung 18 Tage und Mahnung 32 Tage nach
# Zustellung fuer unbezahlte Rechnungen (Gebuehr nur fuer Gewerbekunden), je
# Stufe hoechstens einmal. Laeuft nach
# dem Bankabgleich, damit gestern eingegangene Zahlungen schon zugeordnet sind.
# Faellig ist alles bis zum Stichtag: ein ausgefallener Tag wird beim naechsten
# Lauf mit erledigt.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mahnlauf
  namespace: jitmgmt
spec:
  schedule: "35 8 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  # Beim Anlegen oder nach einer Pause nicht nachholen; das erledigt der naechste Lauf.
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      # Kein Neuversuch am selben Tag: der naechste Lauf holt nach, ohne doppelt zu senden.
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: mahnlauf
              image: registry.jit-creatives.de/jit/jitmgmt:3365084f
              command: ["python", "manage.py", "send_payment_reminders"]
              envFrom:
                - configMapRef: { name: jitmgmt-config }
                - secretRef: { name: jitmgmt-secrets }
              resources:
                requests: { cpu: 20m, memory: 128Mi }
                limits: { memory: 384Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
