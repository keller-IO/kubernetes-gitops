# Wie der Cronjob auf dem Altsystem (alle 15 Minuten). Seit dem Umzug aktiv;
# auf dem Altsystem ist er abgeschaltet (sonst liefe er doppelt).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: proxmox-sync
  namespace: jitmgmt
spec:
  suspend: false
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  # Kein Nachholen verpasster Zeitpunkte (etwa beim Aufheben von suspend):
  # nur ein Zeitpunkt, der hoechstens 5 Minuten zurueckliegt, startet noch;
  # kuerzer als das 15-Minuten-Intervall.
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          imagePullSecrets:
            - name: gitlab-registry
          containers:
            - name: proxmox-sync
              image: registry.jit-creatives.de/jit/jitmgmt:e29d79c1
              command: ["sh", "-c", "python manage.py sync_proxmox_vms --verbosity 0"]
              envFrom:
                - configMapRef: { name: jitmgmt-config }
                - secretRef: { name: jitmgmt-secrets }
              resources:
                requests: { cpu: 10m, memory: 96Mi }
                limits: { memory: 256Mi }
              volumeMounts:
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
          volumes:
            - name: tmp
              emptyDir: { sizeLimit: 64Mi }
