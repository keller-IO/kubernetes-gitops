# Vor dem Umzug nur intern (Abnahme gegen Produktionsdaten). Die oeffentlichen
# Hosts kommen mit dem Umzugs-PR dazu; ihr Zertifikat stellt certificate.yaml
# vorab aus.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitmgmt
  namespace: jitmgmt
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "10m"
    nginx.org/proxy-read-timeout: "120s"
    # Nur interne Netze, wie phpmyadmin/matomo.
    nginx.org/server-snippets: |
      allow 192.168.0.0/16;
      allow 10.0.0.0/8;
      allow 100.64.0.0/10;
      deny all;
spec:
  ingressClassName: nginx
  tls:
    - hosts: [jitmgmt.jit.services]
      secretName: jitmgmt-internal-tls
  rules:
    - host: jitmgmt.jit.services
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jitmgmt
                port:
                  name: http
