apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jitmgmt
resources:
  - ../../../base/jitmgmt
  - ingress.yaml
  - ingress-public.yaml
  - certificate.yaml
  - cronjob-proxmox-sync.yaml
  - cronjob-hetzner-import.yaml

patches:
  - path: deployment-patch.yaml

images:
  - name: registry.jit-creatives.de/jit/jitmgmt
    newTag: 3e1b10ba

configMapGenerator:
  - name: jitmgmt-config
    envs: [config.env]

generators:
  - ./secret-generator.yaml
# Produktion: www.jit-creatives.de, www.jitcreatives.de (oeffentlich) und
# jitmgmt.jit.services (nur intern).
