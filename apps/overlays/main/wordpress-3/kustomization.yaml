apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: wordpress-3
resources:
  - ../../../base/wordpress
patches:
  # DEAKTIVIERT (27.07.2026). Die Instanz lief seit 16 Tagen nicht: das Deployment
  # verlangt ServiceAccount "wordpress", der im Namespace nicht existiert
  # -> FailedCreate, nie ein Pod, site3.jit.services antwortete mit 502.
  # Bewusst nur auf replicas: 0 gesetzt statt das Overlay zu entfernen — die
  # AppSet-Apps laufen mit prune: true, ein Entfernen wuerde PVC, MariaDB und
  # Backups mitloeschen. So bleiben alle Daten erhalten.
  # Reaktivieren: diesen Patch entfernen UND den fehlenden ServiceAccount anlegen.
  - target: { kind: Deployment, name: wordpress }
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0
  - target: { kind: Ingress }
    patch: |
      - op: replace
        path: /spec/rules/0/host
        value: site3.jit.services
      - op: replace
        path: /spec/tls/0/hosts/0
        value: site3.jit.services
  - target: { kind: Backup, name: wordpress-mariadb }
    patch: |
      - op: replace
        path: /spec/storage/s3/prefix
        value: mariadb-wordpress-3
