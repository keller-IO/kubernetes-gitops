# die vor dem Cutover zwangslaeufig scheitern (Traefik faengt Port 80 ab).
#
# NACH dem Cutover: Annotation ergaenzen, cert-manager uebernimmt per HTTP-01,
# danach diese Datei und den Generator-Eintrag wieder entfernen.
#
