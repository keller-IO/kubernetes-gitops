# (acme_letsencrypt.json, Resolver "http") und sind hier VORGELADEN, damit die
# betroffenen Namen im Moment des UDM-Schwenks nicht fuer Minuten ohne
# Zertifikat dastehen: nginx liefert sonst fuer unbekanntes SNI GAR KEINS
