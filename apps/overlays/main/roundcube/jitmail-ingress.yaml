apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundcube-jitmail
  namespace: roundcube
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ⚠️ ssl-redirect bleibt "false", bis die HTTP-01-Zertifikate dieses Ingress
    # stehen. Mit "true" beantwortet nginx nach dem Cutover die ACME-Challenge auf
    # /.well-known/acme-challenge/ mit einem 301 auf https — die Ausstellung
    # scheitert dann dauerhaft. Siehe Runbook, "Cutover-Reihenfolge und Rollback".
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "false"
    nginx.org/client-max-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - roundcube.savar.de
        - webmail01.jit-creatives.de
        - jitmail.de
        - www.jitmail.de
        - webmail.daec-berlin.de
      secretName: roundcube-jitmail-tls
  rules:
    - host: roundcube.savar.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: mail.steinba.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: webmail01.jit-creatives.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: jitmail.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: webmail.daec-berlin.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: www.jitmail.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
