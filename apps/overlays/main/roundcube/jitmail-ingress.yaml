apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundcube-jitmail
  namespace: roundcube
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ⚠️ ssl-redirect bleibt "false", bis die HTTP-01-Zertifikate dieses Ingress
    # stehen. Mit "true" beantwortet nginx nach dem Cutover die ACME-Challenge auf
    # /.well-known/acme-challenge/ mit einem 301 auf https — die Ausstellung
    # scheitert dann dauerhaft. Siehe Runbook, "Cutover-Reihenfolge und Rollback".
    # Seit PR #170 traegt dieser Ingress nur noch Hosts MIT Zertifikat
    # (mail.steinba.ch steht im eigenen Ingress roundcube-jitmail-preload) —
    # daher hier "true".
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "false"
    nginx.org/client-max-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - roundcube.savar.de
        - webmail01.jit-creatives.de
        - jitmail.de
        - www.jitmail.de
        - webmail.daec-berlin.de
      secretName: roundcube-jitmail-tls
  rules:
    - host: roundcube.savar.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: webmail01.jit-creatives.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: jitmail.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: webmail.daec-berlin.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
    - host: www.jitmail.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
---
# mail.steinba.ch hat ein eigenes Objekt und Zertifikat, getrennt von
# roundcube-jitmail: steinba.ch laeuft ueber den http01-Solver (DNS bei hosttech),
# die Namen dort ueber DNS-01. So kann eine scheiternde HTTP-01-Challenge das
# Sammelzertifikat nicht mitreissen. Der Name "-preload" ist historisch (PR #170,
# vorgeladenes Traefik-Zertifikat bis 27.10.2026); er bleibt, damit beim Sync
# nicht kurz zwei Ingresses denselben Host beanspruchen.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundcube-jitmail-preload
  namespace: roundcube
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # edit-in-place ist Pflicht, sonst verwirft nginx-inc den Solver-Ingress fuer
    # denselben Host ("All hosts are taken by other resources").
    acme.cert-manager.io/http01-edit-in-place: "true"
    # ⚠️ "false", bis roundcube-steinbach-tls zum ersten Mal ausgestellt ist
    # (ohne Secret lehnt nginx-inc den TLS-Handshake ab). Danach "true".
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "false"
    nginx.org/client-max-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - mail.steinba.ch
      # Neuer Name: in das ksops-Secret aus Git wuerde cert-manager schreiben und
      # selfHeal es wieder zuruecksetzen.
      secretName: roundcube-steinbach-tls
  rules:
    - host: mail.steinba.ch
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: roundcube
                port:
                  number: 80
