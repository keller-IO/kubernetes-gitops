apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
resources:
  - ../../../base/mastodon
patches:
  - target:
      kind: Deployment
      name: mastodon-web
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
        value: 5
