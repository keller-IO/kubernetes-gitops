apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mailman
# Cluster-TLS ist vorbereitet; der Redirect bleibt bis zum Router-Cutover aus,
# damit der vorgeschaltete .15-Traefik weiter per HTTP proxien kann.
resources:
  - ../../../base/mailman
patches:
  - target: { kind: Ingress, name: mailman }
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.org~1redirect-to-https
        value: "false"
      - op: replace
        path: /spec/rules/0/host
        value: lists.jitmail.de
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lists.jitmail.de
