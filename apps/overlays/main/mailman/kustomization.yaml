apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mailman
# lists.jitmail.de läuft noch über den .15-Traefik, hat seit PR #149 aber ein
# eigenes Cluster-Zertifikat (mailman-tls). redirect-to-https steht seit
# 12.09.2026 auf "true": die Annotation entscheidet an X-Forwarded-Proto (von
# Traefik auf "https" gesetzt), nicht am Schema — die alte Loop-Sorge galt für
# ssl-redirect, das bis zum 443-Cutover "false" bleibt.
resources:
  - ../../../base/mailman
patches:
  - target: { kind: Ingress, name: mailman }
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.org~1redirect-to-https
        value: "true"
      - op: replace
        path: /spec/tls/0/hosts/0
        value: lists.jitmail.de
      - op: replace
        path: /spec/rules/0/host
        value: lists.jitmail.de
