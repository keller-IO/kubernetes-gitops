apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: paperless-ngx
resources:
  - ../../../base/paperless-ngx
  - pre-22015-recovery-points.yaml
patches:
  - target: { kind: Ingress, name: paperless-paperless-ngx }
    patch: |
      - op: replace
        path: /metadata/annotations/nginx.org~1redirect-to-https
        value: "true"
      - op: replace
        path: /spec/rules/0/host
        value: paperless.savar.de
      - op: replace
        path: /spec/tls/0/hosts/0
        value: paperless.savar.de
  - target: { kind: Deployment, name: paperless-paperless-ngx }
    patch: |
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: paperless-paperless-ngx
      spec:
        # WARTUNG 3.x-Upgrade (Runbook paperless-v3-upgrade.md, Phase 2 Schritt 4):
        # Paperless ist gestoppt, bis der 3.x-Change gemergt wird. Der 3.x-PR
        # entfernt diese Zeile wieder.
        replicas: 0
        template:
          spec:
            containers:
              - name: paperless-paperless-ngx
                env:
                  - name: PAPERLESS_URL
                    value: https://paperless.savar.de
  # WARTUNG 3.x-Upgrade: Offsite-Export pausiert, solange Paperless gestoppt ist
  # (der Job braucht den App-Pod per podAffinity und das zur DB passende Image).
  # Nach der 3.x-Abnahme entfernen (Runbook, Beobachtung und Abnahme, Schritt 8).
  - target: { kind: CronJob, name: paperless-offsite-backup }
    patch: |
      - op: add
        path: /spec/suspend
        value: true
