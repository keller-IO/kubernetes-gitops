apiVersion: batch/v1
kind: Job
metadata:
  name: paperless-pre-22015-export-20260802-v2
  namespace: paperless-ngx
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: exporter
          image: ghcr.io/paperless-ngx/paperless-ngx:2.20.6
          imagePullPolicy: IfNotPresent
          workingDir: /usr/src/paperless/src
          command:
            - /command/s6-setuidgid
          args:
            - paperless
            - python3
            - manage.py
            - document_exporter
            - /usr/src/paperless/export/pre-2.20.15-20260802
            - --no-progress-bar
          env:
            - name: PAPERLESS_DBENGINE
              value: postgresql
            - name: PAPERLESS_DBHOST
              value: paperless-pg-rw
            - name: PAPERLESS_DBNAME
              value: paperless
            - name: PAPERLESS_DBUSER
              value: paperless
            - name: PAPERLESS_REDIS
              value: redis://paperless-valkey:6379
            - name: PAPERLESS_TIME_ZONE
              value: Europe/Berlin
          envFrom:
            - secretRef:
                name: paperless-secret
          resources:
            requests: { cpu: 200m, memory: 640Mi }
            limits: { memory: 1536Mi }
          volumeMounts:
            - name: data
              mountPath: /usr/src/paperless/data
            - name: media
              mountPath: /usr/src/paperless/media
            - name: export
              mountPath: /usr/src/paperless/export
            - name: consume
              mountPath: /usr/src/paperless/consume
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: paperless-paperless-ngx-data
        - name: media
          persistentVolumeClaim:
            claimName: paperless-paperless-ngx-media
        - name: export
          persistentVolumeClaim:
            claimName: paperless-paperless-ngx-export
        - name: consume
          emptyDir: {}
