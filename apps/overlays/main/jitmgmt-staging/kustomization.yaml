apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jitmgmt-staging
resources:
  - ../../../base/jitmgmt
  - ingress.yaml
  - cronjob-rechnungslauf.yaml
  - webhook-forwarder.yaml

images:
  - name: registry.jit-creatives.de/jit/jitmgmt
    newTag: 721160a4

configMapGenerator:
  - name: jitmgmt-config
    envs: [config.env]

generators:
  - ./secret-generator.yaml
# Erreichbar unter https://jitmgmt-staging.jit.services, nur aus internen Netzen.
