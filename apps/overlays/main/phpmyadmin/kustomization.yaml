apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: phpmyadmin
# Die Legacy-Hosts phpmyadmin.savar.de/.jit-creatives.de haengen am selben
# Ingress und erben damit die IP-Allowlist aus der Base.
resources:
  - ../../../base/phpmyadmin
patches:
  - target: { kind: Ingress, name: phpmyadmin }
    patch: |
      - op: add
        path: /spec/rules/-
        value:
          host: phpmyadmin.savar.de
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: phpmyadmin
                    port:
                      number: 80
      - op: add
        path: /spec/rules/-
        value:
          host: phpmyadmin.jit-creatives.de
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: phpmyadmin
                    port:
                      number: 80
      - op: add
        path: /spec/tls/0/hosts/-
        value: phpmyadmin.savar.de
      - op: add
        path: /spec/tls/0/hosts/-
        value: phpmyadmin.jit-creatives.de
