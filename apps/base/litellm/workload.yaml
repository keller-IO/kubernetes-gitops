apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: server
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: litellm
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: litellm
        app.kubernetes.io/component: server
        network-policy.jit.land/identity: litellm
      annotations:
        litellm.jit.land/secret-revision: v1
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm-non_root:v1.104.0@sha256:37066242e6b8327fdd627682a66a9ae2a599553b4d5a84c905c6d8b9eb35c01e
          args:
            - --config
            - /app/config/config.yaml
            - --port
            - "4000"
            - --num_workers
            - "1"
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          env:
            - name: BLABLADOR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: BLABLADOR_API_KEY
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm
                  key: LITELLM_MASTER_KEY
            - { name: LITELLM_MODE, value: PRODUCTION }
            - { name: LITELLM_LOCAL_MODEL_COST_MAP, value: "True" }
            - { name: LITELLM_LOG, value: ERROR }
            - { name: LITELLM_DONT_SHOW_FEEDBACK_BOX, value: "True" }
            - { name: LITELLM_MIGRATION_DIR, value: /app/migrations }
            - { name: XDG_CACHE_HOME, value: /app/.cache }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
            - { name: DISABLE_ADMIN_UI, value: "True" }
            - { name: NO_DOCS, value: "True" }
            - { name: NO_REDOC, value: "True" }
            - { name: NO_OPENAPI, value: "True" }
          readinessProbe:
            httpGet:
              path: /health/readiness
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/liveliness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /app/config
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: cache
              mountPath: /app/.cache
            - name: migrations
              mountPath: /app/migrations
      volumes:
        - name: config
          configMap:
            name: litellm-config
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: cache
          emptyDir:
            sizeLimit: 128Mi
        - name: migrations
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: litellm
  namespace: litellm
  labels:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: litellm
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 4000
      targetPort: http
      protocol: TCP
