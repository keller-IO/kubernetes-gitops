apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: litellm
  namespace: litellm
spec:
  endpointSelector:
    matchLabels:
      network-policy.jit.land/identity: litellm
  ingress:
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": ingress-nginx
            "k8s:app.kubernetes.io/instance": nginx-ingress
            "k8s:app.kubernetes.io/name": nginx-ingress
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
    # Paperless (ADR 0011) spricht den Service direkt an, nicht den Ingress:
    # Die Identitaet ist der App-Pod (Watchdog und Offsite-Export tragen kein
    # instance-Label), erlaubt ist ausschliesslich POST /v1/embeddings.
    - fromEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": paperless-ngx
            "k8s:app.kubernetes.io/instance": paperless
            "k8s:app.kubernetes.io/name": paperless-ngx
      toPorts:
        - ports:
            - port: "4000"
              protocol: TCP
          rules:
            http:
              - method: POST
                path: /v1/embeddings
  egress:
    - toEndpoints:
        - matchLabels:
            "k8s:io.kubernetes.pod.namespace": kube-system
            "k8s:k8s-app": kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchName: api.blablador.fz-juelich.de
              - matchName: chat-ai.academiccloud.de
    - toFQDNs:
        - matchName: api.blablador.fz-juelich.de
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - api.blablador.fz-juelich.de
    - toFQDNs:
        - matchName: chat-ai.academiccloud.de
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
          serverNames:
            - chat-ai.academiccloud.de
