apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - ingress.yaml
  - network-policy.yaml
  - network-policy-probe.yaml
  - namespace.yaml
  - workload.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
      - request_policy.py
      - request_policy_core.py
  - name: litellm-network-probe
    files:
      - network_probe.py

generators:
  - ./secret-generator.yaml
