apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: litellm
resources:
  - namespace.yaml
  - workload.yaml

configMapGenerator:
  - name: litellm-config
    files:
      - config.yaml
      - request_policy.py
      - request_policy_core.py

generators:
  - ./secret-generator.yaml
