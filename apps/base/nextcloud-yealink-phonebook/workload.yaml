apiVersion: apps/v1
kind: Deployment
metadata:
  name: nextcloud-yealink-phonebook
  namespace: nextcloud-yealink-phonebook
  labels:
    app.kubernetes.io/name: nextcloud-yealink-phonebook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nextcloud-yealink-phonebook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nextcloud-yealink-phonebook
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: phonebook
          # renovate: image=python
          image: python:3.13.5-alpine3.22@sha256:37b14db89f587f9eaa890e4a442a3fe55db452b69cca1403cc730bd0fbdc8aaf
          command: [python, /app/app.py]
          ports:
            - name: http
              containerPort: 8080
          env:
            - { name: NEXTCLOUD_URL, value: "https://jit.cloud" }
            - { name: ADDRESSBOOK, value: kontakte }
            - { name: PHONEBOOK_TITLE, value: Nextcloud Kontakte }
            - { name: REFRESH_INTERVAL, value: "900" }
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: http }
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { memory: 96Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: app, mountPath: /app, readOnly: true }
            - { name: secrets, mountPath: /run/secrets/phonebook, readOnly: true }
      volumes:
        - name: app
          configMap:
            name: nextcloud-yealink-phonebook-code
        - name: secrets
          secret:
            secretName: nextcloud-yealink-phonebook
---
apiVersion: v1
kind: Service
metadata:
  name: nextcloud-yealink-phonebook
  namespace: nextcloud-yealink-phonebook
spec:
  selector:
    app.kubernetes.io/name: nextcloud-yealink-phonebook
  ports:
    - name: http
      port: 80
      targetPort: http
