apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
# Official mastodon chart (mastodon/helm-charts). Postgres=CNPG, Redis=Valkey, media=Ceph S3.
helmCharts:
  - name: mastodon
    repo: https://mastodon.github.io/helm-charts
    version: 1.0.3 # renovate: helm  (official chart; appVersion = Mastodon release)
    releaseName: mastodon
    namespace: mastodon
    valuesFile: values.yaml
resources:
  - database.yaml
  - cache.yaml
  # objectbucket.yaml braucht die objectbucket.io-CRD (Rook/lib-bucket-provisioner)
  # — ohne sie blockiert der OBC den GESAMTEN mastodon-Sync, ArgoCD validiert alle
  # Sync-Tasks vorab und kippt beim ersten fehlenden Kind. Wieder aktivieren, sobald
  # ein Bucket-Provisioner läuft. Bis dahin wird mastodon-s3 nicht autogeneriert —
  # Media-Storage ist eine separate Folgeaufgabe.
  # - objectbucket.yaml
  - backup.yaml

generators:
  - ./secret-generator.yaml
