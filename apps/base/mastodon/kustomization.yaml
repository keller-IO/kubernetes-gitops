apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mastodon
# Official chart; migration staging keeps all Mastodon Deployments at 0 replicas.
# Postgres=CNPG, Redis=Valkey, media=external Ceph RGW.
helmCharts:
  - name: mastodon
    repo: https://mastodon.github.io/helm-charts
    version: 1.0.3 # renovate: helm; appVersion 4.6.3 is intentionally overridden to 4.5.9
    releaseName: mastodon
    namespace: mastodon
    valuesFile: values.yaml
# Chart 1.0.3 renders Helm-hook helpers even when every hook Job is disabled.
# Delete them during staging so ArgoCD cannot map them to sync hooks.
#
# ArgoCD sieht den mastodon-db-prepare-Job (helm.sh/hook: pre-install) NICHT als
# eigenen Hook — das ist eine reine Helm-Annotation, die unter kustomize/ArgoCD
# wirkungslos ist (ArgoCD kennt nur argocd.argoproj.io/hook). Der Job läuft also
# als normale Resource in sync-wave 0 — im selben Wave wie das per KSOPS erzeugte
# mastodon-secret. Ohne explizite Ordnung race'n beide, und der Job kann vor dem
# Secret starten ("secret mastodon-secret not found"). Fix: Secret eine Wave vor
# den Rest der App synchronisieren.
patches:
  - target:
      kind: ServiceAccount
      name: mastodon-predeploy
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: mastodon-predeploy
  - target:
      kind: ConfigMap
      name: mastodon-env-predeploy
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: mastodon-env-predeploy
  - target:
      kind: Secret
      name: mastodon-secret
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          argocd.argoproj.io/sync-wave: "-1"
resources:
  - database.yaml
  - cache.yaml
  - backup.yaml

generators:
  - ./secret-generator.yaml
