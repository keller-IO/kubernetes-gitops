  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 3600 # 4.7.0 hat lange Post-Migrationen: vorher am Restore-Klon messen
  template:
    metadata:
