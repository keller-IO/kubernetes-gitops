# Values for the official mastodon/helm-charts chart (schema 1.0.x).
# Migration staging: storage is prepared, but all app/cache workloads and Ingress stay disabled.
image:
  repository: ghcr.io/mastodon/mastodon
  tag: v4.5.19
  pullPolicy: IfNotPresent

mastodon:
  # Federation identity must never change during a server migration.
  localDomain: jit.social
  singleUserMode: false

  createAdmin:
    enabled: false

  hooks:
    # Restore and schema checks are run explicitly according to the migration runbook.
    # ArgoCD must not initialize or migrate the database during staging.
    dbPrepare:
      enabled: false
    dbMigrate:
      enabled: false
    deploySearch:
      enabled: false

  # Runtime secret-key-base, VAPID and Active-Record-Encryption keys. OTP_SECRET
  # is retained in the Secret for recovery but no longer injected by chart 1.0.x.
  secrets:
    existingSecret: mastodon-secret

  s3:
    enabled: true
    existingSecret: mastodon-s3 # dedizierter Ceph-RGW-Benutzer mastodon
    existingSecretKeys:
      accessKeyId: AWS_ACCESS_KEY_ID
      secretAccessKey: AWS_SECRET_ACCESS_KEY
    bucket: jit-social-media
    # ⚠️ Frueher stand hier s3.jit.services — den Namen gibt es nicht. Er faellt
    # nur ins Wildcard-DNS auf 192.168.2.246, und nginx lehnt ihn per SNI ab
    # ("unrecognized name"). Am 22.09.2026 nachgewiesen.
    # Intern per HTTP auf den RGW, wie bei ciso-assistant. Ueber den Service in
    # legacy-proxy laufen alle drei RGW-Daemons (.6/.7/.8) statt nur einem.
    endpoint: http://s3.legacy-proxy.svc.cluster.local:7480
    hostname: s3.legacy-proxy.svc.cluster.local
    # Nur das URL-Schema der Medien-Links, nicht der API-Zugriff (siehe
    # config/initializers/paperclip.rb: S3_ENDPOINT bringt sein eigenes Schema mit).
    protocol: https
    region: default
    # Medien-URLs laufen ueber den eigenen Host, nicht ueber den RGW-Namen: das
    # haelt die bestehenden https://jit.social/system/...-URLs gueltig, auf die
    # alte Posts und foederierte Instanzen verweisen. Die passende /system-Route
    # steht in ingress.yaml — beides gehoert zusammen.
    aliasHost: jit.social/system

  smtp:
    server: mail.jit-creatives.de
    port: 587
    fromAddress: "Mastodon <notifications@jit.social>"
    authMethod: plain
    opensslVerifyMode: none # preserve legacy behavior; harden after SMTP certificate validation
    existingSecret: mastodon-smtp

  # Ausfallsicherheit (#339): Web, Streaming und der Sidekiq-Worker `default`
  # laufen je zweimal, hart auf verschiedene Nodes gestreut, mit PDB
  # (pdb.yaml). Ein Node-Ausfall oder Drain trifft so immer nur eine Replik.
  # Die chart-eigenen `pdb`-Values sind wirkungslos: Chart 1.2.5 hat dafuer
  # kein Template.
  web:
    replicas: 2
    # Gemessen 21.10.2026 (2 Tage nach Cutover): ~1,05 GiB je Pod im Mittel,
    # Spitze 1,1 GiB; CPU im Mittel 40m, Spitze 170m (5-min-Rate). Der
    # bisherige Request von 512Mi lag unter dem echten Bedarf.
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mastodon
                app.kubernetes.io/component: web
  sidekiq:
    # ⚠️ Bis mastodon02 stillgelegt ist: dort darf kein Mastodon-Dienst mehr
    # starten, solange diese Worker laufen (Runbook mastodon-migration.md).
    # Chart-Default ist Recreate fuer alle Worker; dann staende `default` bei
    # jedem Rollout komplett. Der Scheduler bekommt per Patch in
    # kustomization.yaml wieder Recreate, damit nie zwei parallel laufen.
    updateStrategy:
      type: RollingUpdate
      rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
    # Die Readiness-Datei legt Mastodon an, sobald Sidekiq Jobs annimmt. Ohne
    # Probe gilt ein Pod sofort als Ready und die PDB zaehlt ihn zu frueh.
    readinessProbe:
      enabled: true
    workers:
      - name: default
        # 2 x 15 Threads statt 1 x 25: Der Durchsatz haengt an der fsync-Latenz
        # der DB (docs/learnings/mastodon-remote-cache-nach-cutover.md), mehr
        # Threads stauen sich nur vor COMMIT. 15 je Pod haelt die
        # DB-Verbindungen nahe am bisherigen Stand (Spitze 57 von 100).
        replicas: 2
        concurrency: 15
        queues: ["default,8", "push,6", "ingress,4", "mailers,2", "pull", "fasp"]
        # 19.10.2026: bei 2Gi OOMKilled (Exit 137), als nach dem Poller-Fix
        # (4.5.19) der Rueckstau an RedownloadMediaWorker anlief — ffmpeg
        # verarbeitet Videos in mehreren Threads parallel. Gemessen bei -c 25:
        # Spitze 1,8 GiB mit Rueckstau, ~0,85 GiB im Mittel, CPU im Mittel 35m.
        # Das Limit bleibt fuer ffmpeg-Spitzen hoch.
        resources:
          requests: { cpu: 100m, memory: 1Gi }
          limits: { memory: 4Gi }
        affinity:
          podAntiAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: mastodon
                    app.kubernetes.io/component: sidekiq-default
      - name: scheduler
        # Genau eine Replik (der Chart bricht bei mehr ab) und keine PDB, damit
        # sie keinen Drain blockiert. Faellt sie aus, verzoegern sich nur die
        # geplanten Jobs, bis Kubernetes sie neu startet. Nur dieser Prozess
        # hoert auf `scheduler` und reiht damit die Cron-Jobs ein
        # (listened_queues_only in config/sidekiq.yml).
        replicas: 1
        concurrency: 5
        queues: ["scheduler"]
        # Noch nicht getrennt gemessen; der Rails-Grundbedarf liegt bei
        # ~0,4 GiB (Retention-Jobs). Nach einer Woche aus der Messung nachziehen.
        resources:
          requests: { cpu: 50m, memory: 512Mi }
          limits: { memory: 1536Mi }
  streaming:
    replicas: 2
    image:
      repository: ghcr.io/mastodon/mastodon-streaming
      tag: v4.5.19
    # Gemessen 21.10.2026: ~90 MiB im Mittel, Spitze 115 MiB; CPU < 10m.
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { memory: 512Mi }
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - topologyKey: kubernetes.io/hostname
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: mastodon
                app.kubernetes.io/component: streaming

postgresql:
  hostname: mastodon-pg-rw # CNPG read-write service
  port: 5432
  # Die physische Kopie bringt die Datenbank unter ihrem Originalnamen mit —
  # mastodon_production, nicht mastodon. Kein Umbenennen beim Cutover: das
  # braucht eine verbindungsfreie Datenbank und waere ein Schritt mehr unter
  # Zeitdruck. mastodon-db-app traegt seit 23.09.2026 das Kennwort der QUELLE,
  # damit nach der Promotion auch kein ALTER ROLE noetig ist.
  database: mastodon_production
  username: mastodon
  existingSecret: mastodon-db-app # Schluessel: username/password

redis:
  hostname: mastodon-valkey
  port: 6379
  # The official chart requires Redis auth. Shared secret with the Valkey
  # StatefulSet's requirepass (see cache.yaml). Default key name is "password".
  existingSecret: mastodon-redis

elasticsearch:
  enabled: false # enable for full-text search (extra resources)

ingress:
  # Der Chart-Ingress kennt nur / und /api/v1/streaming. Die Medien brauchen
  # zusaetzlich /system, deshalb liegt der Ingress als eigenes Objekt in
  # ingress.yaml. Zwei Ingresses fuer denselben Host waeren bei nginx-inc ein
  # mergeable-master/minion-Fall und damit unnoetig kompliziert.
  enabled: false

# Gateway API not used — this cluster routes through NGINX Ingress.
httproute:
  enabled: false
