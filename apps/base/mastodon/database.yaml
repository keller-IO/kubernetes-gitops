apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastodon-pg
  namespace: mastodon
spec:
  # Migration stage: restore into one PG16 instance, then scale to 3 and wait
  # for healthy replicas before exposing Mastodon.
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14-202607270908-system-bookworm@sha256:0fd578912f7786e218b7ed223458824236c03084f38030563b274865679ecd62
  storage:
    size: 64Gi # source DB is currently 20 GB; leaves room for restore and migrations
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }
  bootstrap:
    initdb:
      database: mastodon
      owner: mastodon
      secret:
        name: mastodon-db-app
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21, Bucket backups).
  # WICHTIG: erst reaktiviert, seit das externe S3 existiert (13.07.) — ein
  # kaputtes Archive-Target würde WALs stauen bis die Disk voll ist.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-mastodon/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: mastodon-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: mastodon-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: mastodon-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
