apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastodon-pg
  namespace: mastodon
spec:
  # Eine Instanz wie bei allen anderen CNPG-Clustern; Absicherung ueber das
  # kontinuierliche WAL-Archiv nach Garage. Drei Instanzen wuerden RAM und
  # Ceph-Belegung verdreifachen — erst nach der Migration neu bewerten.
  instances: 1
  # Explizit gepinnt: PG 16 wie die Bestandsinstanz (16.14), Restore per
  # logischem Dump. Kein Major-Wechsel waehrend der Migration.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14-202607270908-system-bookworm@sha256:0fd578912f7786e218b7ed223458824236c03084f38030563b274865679ecd62
  storage:
    size: 64Gi # Quell-DB 21 GB (22.09.2026); Luft fuer Restore und Migrationen
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt (MariaDB-Pods, 28.07.2026, Exit 137).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }
  # Am 23.09.2026 gemessen: der erste Restore-Probelauf brauchte 3 h 59 min und
  # schob dabei 2.085 WAL-Segmente (rund 33 GB) unkomprimiert ueber den VPN nach
  # Potsdam. Diese drei Werte adressieren das und sind auch im Normalbetrieb
  # sinnvoll — maintenance_work_mem bleibt bewusst draussen und wird nur fuer
  # den Restore per ALTER DATABASE gesetzt.
  postgresql:
    parameters:
      # Halbiert bis drittelt das WAL-Volumen; der Weg nach Garage laeuft ueber
      # die VPN-Strecke nach Potsdam, dort zaehlt jedes Byte.
      wal_compression: "on"
      # Default 1 GB erzwingt beim Massenimport Dauer-Checkpoints. Die PVC hat
      # 64 GiB, davon sind nach dem Restore rund 15 GB belegt.
      max_wal_size: "4GB"
      checkpoint_timeout: "15min"
  bootstrap:
    initdb:
      database: mastodon
      owner: mastodon
      secret:
        name: mastodon-db-app
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21) in den EIGENEN Bucket
  # backup-mastodon mit eigenem Key (RW nur darauf, 20 GiB Quota; Secret in
  # backup-s3.sops.yaml). Garage kennt keine Prefix-Rechte, deshalb kein
  # gemeinsamer Bucket mehr. WICHTIG: ein kaputtes Archive-Target würde WALs
  # stauen, bis die Disk voll ist.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backup-mastodon/cnpg/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: mastodon-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: mastodon-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: mastodon-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
