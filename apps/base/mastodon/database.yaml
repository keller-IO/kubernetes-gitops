apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mastodon-pg
  namespace: mastodon
spec:
  # Eine Instanz wie bei allen anderen CNPG-Clustern; Absicherung ueber das
  # kontinuierliche WAL-Archiv nach Garage. Drei Instanzen wuerden RAM und
  # Ceph-Belegung verdreifachen — erst nach der Migration neu bewerten.
  instances: 1
  # Explizit gepinnt: PG 16 wie die Bestandsinstanz (16.14), Restore per
  # logischem Dump. Kein Major-Wechsel waehrend der Migration.
  imageName: ghcr.io/cloudnative-pg/postgresql:16.14-202607270908-system-bookworm@sha256:0fd578912f7786e218b7ed223458824236c03084f38030563b274865679ecd62
  storage:
    size: 64Gi # Quell-DB 21 GB (22.09.2026); Luft fuer Restore und Migrationen
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt (MariaDB-Pods, 28.07.2026, Exit 137).
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { memory: 4Gi }
  # Am 23.09.2026 gemessen: der erste Restore-Probelauf brauchte 3 h 59 min und
  # schob dabei 2.085 WAL-Segmente (rund 33 GB) unkomprimiert ueber den VPN nach
  # Potsdam. Diese drei Werte adressieren das und sind auch im Normalbetrieb
  # sinnvoll — maintenance_work_mem bleibt bewusst draussen und wird nur fuer
  # den Restore per ALTER DATABASE gesetzt.
  postgresql:
    parameters:
      # Halbiert bis drittelt das WAL-Volumen; der Weg nach Garage laeuft ueber
      # die VPN-Strecke nach Potsdam, dort zaehlt jedes Byte.
      wal_compression: "on"
      # Default 1 GB erzwingt beim Massenimport Dauer-Checkpoints. Die PVC hat
      # 64 GiB, davon sind nach dem Restore rund 15 GB belegt.
      max_wal_size: "4GB"
      checkpoint_timeout: "15min"
  # PHYSISCHE Migration statt logischem Dump (Entscheidung 23.09.2026): Quelle
  # und Ziel sind beide PG 16.14 auf Debian Bookworm, also gleiche Major-Version
  # und gleiche glibc-Kollation. Die Indizes kommen fertig mit, statt nach dem
  # Laden neu gebaut zu werden — der logische Probelauf brauchte dafuer 3 h 59.
  # Der Cluster laeuft zunaechst als Replica-Cluster und folgt mastodon02
  # per Streaming; der Cutover ist dann nur noch eine Promotion.
  bootstrap:
    pg_basebackup:
      source: mastodon02
      # CNPG haelt die Datenbank aus diesem Block fuer die Anwendungs-DB und
      # fuehrt dort die Monitoring-Queries aus. Ohne Angabe ist das `app`, die
      # es in der Kopie nicht gibt — bis 18.10.2026 scheiterten deshalb alle
      # Queries mit `database "app" does not exist` (kein Replikations-Lag).
      # Das Secret traegt das Kennwort der Quelle; verwaltet CNPG den Owner
      # nach der Promotion, bleibt es dasselbe. Wirkt ohne Neustart.
      database: mastodon_production
      owner: mastodon
      secret:
        name: mastodon-db-app
  # Die Quelle braucht `wal_keep_size = '8GB'` (Drop-in
  # conf.d/10-kellerio-migration.conf auf mastodon02): Ohne Slot und ohne Archiv
  # reisst die Replikation sonst bei Cluster-Ausfaellen ab (07.10.2026, Stromarbeiten).
  # PROMOTION im Cutover-Fenster 19.10.2026: replica.enabled ist false, damit
  # beendet CNPG den Recovery-Modus und macht mastodon-pg-1 schreibfaehig.
  # Reihenfolge (Runbook, Phase 4): Mastodon auf mastodon02 gestoppt, sent_lsn auf
  # der Quelle == replay-LSN hier, Valkey-RDB und Medien-Delta uebernommen — ERST
  # DANN diesen PR mergen. Die App spricht mastodon_production an; das Kennwort
  # der Rolle setzt der managed-Block unten (siehe dort).
  # Nicht rueckgaengig machbar: ein einmal promoteter Cluster wird nicht wieder
  # Replica; Rollback auf mastodon02 ist danach nur per Rueck-Dump moeglich.
  # `source` bleibt als Verweis auf den externalCluster stehen (kein Distributed-
  # Topology-Setup, daher weder replica.primary noch replica.self).
  replica:
    enabled: false
    source: mastodon02
  # ⚠️ Die Rolle `mastodon` hat auf der Quelle KEIN Kennwort (rolpassword NULL,
  # lokale peer-Auth ueber den Unix-Socket); die physische Kopie bringt das mit.
  # Das Kennwort in mastodon-db-app (= DB_PASS aus .env.production) ist in der DB
  # also nirgends gesetzt — ohne diesen Block scheitert jeder TCP-Login der App
  # nach der Promotion mit "password authentication failed" (am 19.10.2026 auf der
  # Replik nachgewiesen). Managed Roles setzt es auf dem Primary deklarativ; Attribute
  # entsprechen der Quelle (login, createdb, kein Superuser).
  managed:
    roles:
      - name: mastodon
        ensure: present
        login: true
        createdb: true
        passwordSecret:
          name: mastodon-db-app
  externalClusters:
    - name: mastodon02
      connectionParameters:
        host: "192.168.2.233"
        port: "5432"
        user: streaming_replica
        dbname: postgres
        # Die Quelle hat ssl=on (Debian-Snakeoil). require verschluesselt, ohne
        # ein Zertifikat zu pruefen, das es hier nicht zu pruefen gibt.
        sslmode: require
      password:
        name: mastodon-source-replica
        key: password
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21) in den EIGENEN Bucket
  # backup-mastodon mit eigenem Key (RW nur darauf, 100 GiB Quota; Secret in
  # backup-s3.sops.yaml). Garage kennt keine Prefix-Rechte, deshalb kein
  # gemeinsamer Bucket mehr. WICHTIG: ein kaputtes Archive-Target würde WALs
  # stauen, bis die Disk voll ist. Am 2026-10-01 stoppte ein volles Bucket das
  # WAL-Archiving (barman exit 4), pg_wal wuchs unbemerkt. Die Quota muss
  # (Retention ÷ Intervall + 1) × Base + WAL des Retention-Fensters decken.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backup-mastodon/cnpg/
      # Re-Seed am 18.10.2026: Der neu angelegte Cluster darf nicht in den Pfad des
      # alten (`mastodon-pg`) archivieren, sonst bricht barman-cloud-check-wal-archive
      # mit "Expected empty archive" ab. Der alte Prefix
      # s3://backup-mastodon/cnpg/mastodon-pg/ enthaelt nur Replikat-Kopien und
      # kann nach erfolgreichem neuem Base-Backup geloescht werden.
      serverName: mastodon-pg-r2
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: mastodon-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: mastodon-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: mastodon-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      # Garage braucht fuer CompleteMultipartUpload bei grossen Base-Backups
      # laenger als das boto3-Read-Timeout von 60 s. barman wiederholt den
      # Aufruf dann, Garage hat den Upload aber schon abgeschlossen und
      # antwortet 404 NoSuchUpload -> Backup "failed" (mailman 18.10.2026
      # 02:30, mastodon 18.10.2026 07:52). Groessere Teile (64 MB statt 5 MB)
      # verkuerzen das Zusammensetzen, das Timeout faengt den Rest ab.
      data:
        compression: gzip
        additionalCommandArgs: ["--read-timeout=600", "--min-chunk-size=64MB"]
  monitoring:
    enablePodMonitor: true
