apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO-PVC: RollingUpdate verklemmt, wenn alter+neuer Pod auf verschiedenen Nodes landen
    rollingUpdate: null # Altwert im Live-Objekt muss beim Apply explizit gelöscht werden
  selector:
    matchLabels:
      app.kubernetes.io/name: kimai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimai
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: kimai
          # Voruebergehend eigener Rebuild (20.11.2026): kimai/kimai2 hat das PHP-Sicherheits-
          # release vom 19.11.2026 (CVE-2026-126714/-129481) noch nicht (2.70.1: PHP 8.3.36,
          # 2.72.0: 8.5.12). Gebaut aus kimai/kimai@2.70.1 (Dockerfile, --target prod,
          # BASE=apache, KIMAI=2.70.1) auf docker.io/library/php:8.3-apache-bookworm@sha256:d60f7be7…
          # (PHP 8.3.37). Module, php.ini, Entrypoint, Apache-vhost und App-Code/vendor/ sind
          # byteidentisch zu kimai/kimai2:2.70.1@sha256:7ccc9597…
          # Zurueck auf kimai/kimai2:<version>@<digest>, sobald Upstream PHP >= 8.3.37 bzw. 8.5.13
          # hat; dann auch imagePullSecrets und registry-pull.sops.yaml wieder entfernen.
          # Seit 2.58 heisst das Apache-Image upstream nur noch <version> (apache-<version> ist eingestellt).
          image: registry.jit-creatives.de/jit/container-rebuilds/kimai2:2.70.1-apache-php8.3.37@sha256:4755ced9a849ea7d3b485b50b4e0b1234ad49ea9456d9da8c6ac7e63c1898ff8
          ports:
            - containerPort: 8001
          env:
            # MARIADB_PASSWORD MUSS vor DATABASE_URL stehen: K8s expandiert
            # $(VAR)-Referenzen nur auf zuvor definierte Variablen.
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: mariadb-password }
            - name: DATABASE_URL
              value: "mysql://kimai:$(MARIADB_PASSWORD)@kimai-mariadb:3306/kimai?charset=utf8mb4&serverVersion=11.8.9-MariaDB"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: app-secret }
            - name: REDIS_URL
              value: "redis://kimai-valkey:6379/0"
            - name: TRUSTED_HOSTS
              value: "kimai.jit.services,localhost" # CHANGE ME
            - name: ADMINMAIL
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: admin-mail }
            - name: ADMINPASS
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: admin-pass }
          readinessProbe:
            httpGet:
              path: /en/login
              port: 8001
              httpHeaders: # Probe nutzt sonst die Pod-IP als Host -> 400 wegen TRUSTED_HOSTS
                - { name: Host, value: localhost }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /opt/kimai/var/data, subPath: data }
            # Plugins (z. B. ImportBundle) überleben Image-Updates auf der PVC.
            - { name: data, mountPath: /opt/kimai/var/plugins, subPath: plugins }
            - { name: php-cve-mitigation, mountPath: /usr/local/etc/php/conf.d/zz-cve-2026-109619.ini, subPath: zz-cve-2026-109619.ini, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kimai-data
        - name: php-cve-mitigation
          configMap:
            name: kimai-php-cve-mitigation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-data
  namespace: kimai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd # CHANGE ME
  resources:
    requests:
      storage: 2Gi
