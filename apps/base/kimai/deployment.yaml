apiVersion: apps/v1
kind: Deployment
metadata:
  name: kimai
  namespace: kimai
  labels:
    app.kubernetes.io/name: kimai
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO-PVC: RollingUpdate verklemmt, wenn alter+neuer Pod auf verschiedenen Nodes landen
    rollingUpdate: null # Altwert im Live-Objekt muss beim Apply explizit gelöscht werden
  selector:
    matchLabels:
      app.kubernetes.io/name: kimai
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kimai
    spec:
      containers:
        - name: kimai
          # renovate: image=kimai/kimai2
          # Seit 2.58 heisst das Apache-Image nur noch <version> (apache-<version> ist eingestellt).
          # Digest = Multi-Arch-Index von 2.70.1 (21.10.2026, PHP 8.3.36, fixt CVE-2026-109618/-109619).
          image: kimai/kimai2:2.70.1@sha256:7ccc9597309b9f76ded0a3cf168b5e137167fec6c8aa6a588194dcf6ce26ec2f
          ports:
            - containerPort: 8001
          env:
            # MARIADB_PASSWORD MUSS vor DATABASE_URL stehen: K8s expandiert
            # $(VAR)-Referenzen nur auf zuvor definierte Variablen.
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: mariadb-password }
            - name: DATABASE_URL
              value: "mysql://kimai:$(MARIADB_PASSWORD)@kimai-mariadb:3306/kimai?charset=utf8mb4&serverVersion=11.8.9-MariaDB"
            - name: APP_SECRET
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: app-secret }
            - name: REDIS_URL
              value: "redis://kimai-valkey:6379/0"
            - name: TRUSTED_HOSTS
              value: "kimai.jit.services,localhost" # CHANGE ME
            - name: ADMINMAIL
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: admin-mail }
            - name: ADMINPASS
              valueFrom:
                secretKeyRef: { name: kimai-secret, key: admin-pass }
          readinessProbe:
            httpGet:
              path: /en/login
              port: 8001
              httpHeaders: # Probe nutzt sonst die Pod-IP als Host -> 400 wegen TRUSTED_HOSTS
                - { name: Host, value: localhost }
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /opt/kimai/var/data, subPath: data }
            # Plugins (z. B. ImportBundle) überleben Image-Updates auf der PVC.
            - { name: data, mountPath: /opt/kimai/var/plugins, subPath: plugins }
            - { name: php-cve-mitigation, mountPath: /usr/local/etc/php/conf.d/zz-cve-2026-109619.ini, subPath: zz-cve-2026-109619.ini, readOnly: true }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kimai-data
        - name: php-cve-mitigation
          configMap:
            name: kimai-php-cve-mitigation
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: kimai-data
  namespace: kimai
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd # CHANGE ME
  resources:
    requests:
      storage: 2Gi
