apiVersion: apps/v1
kind: Deployment
metadata:
  name: roundcube
  namespace: roundcube
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: roundcube }
  template:
    metadata:
      labels: { app.kubernetes.io/name: roundcube }
    spec:
      imagePullSecrets:
        - name: gitlab-registry
      containers:
        - name: roundcube
          # Voruebergehend eigener Rebuild (21.10.2026): roundcube/roundcubemail:1.7.4-apache
          # enthaelt PHP 8.4.26 und ist gegen CVE-2026-109618/-109619 (PHP2Shell) nicht gefixt.
          # Gebaut aus roundcube/roundcubemail-docker@2297664 (apache/Dockerfile, --target root,
          # ROUNDCUBEMAIL_VERSION=1.7.4) auf docker.io/library/php:8.4-apache (PHP 8.4.27).
          # Zurueck auf roundcube/roundcubemail:<version>-apache@<digest>, sobald Upstream PHP >= 8.4.27 hat
          # (Release-Builds montags 02:23 UTC, roundcube/roundcubemail-docker#468); dann auch
          # imagePullSecrets und registry-pull.sops.yaml wieder entfernen.
          image: registry.jit-creatives.de/jit/container-rebuilds/roundcubemail:1.7.4-apache-php8.4.27@sha256:6231f984378169da56317de558de85d57e4006c77ffed3d1fe9fbc771ac5890c
          ports: [{ containerPort: 80 }]
          env:
            # Ohne dies deaktiviert Composer (läuft als root) den roundcube/
            # plugin-installer -> composer-Plugins (fetchmail, contextmenu)
            # landen in vendor/, aber nie in plugins/ -> "Failed to load plugin".
            - name: COMPOSER_ALLOW_SUPERUSER
              value: "1"
            - name: ROUNDCUBEMAIL_DB_TYPE
              value: pgsql
            - name: ROUNDCUBEMAIL_DB_HOST
              value: roundcube-pg-rw
            - name: ROUNDCUBEMAIL_DB_PORT
              value: "5432"
            - name: ROUNDCUBEMAIL_DB_NAME
              value: roundcube
            - name: ROUNDCUBEMAIL_DB_USER
              valueFrom: { secretKeyRef: { name: roundcube-db-app, key: username } }
            - name: ROUNDCUBEMAIL_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: roundcube-db-app, key: password } }
            - name: ROUNDCUBEMAIL_DEFAULT_HOST
              value: "tls://mail.jit-creatives.de"
            - name: ROUNDCUBEMAIL_DEFAULT_PORT
              value: "143"
            - name: ROUNDCUBEMAIL_SMTP_SERVER
              value: "tls://mail.jit-creatives.de"
            - name: ROUNDCUBEMAIL_SMTP_PORT
              value: "587"
            - name: ROUNDCUBEMAIL_PLUGINS
              value: "managesieve,virtuser_query,acl,password,archive,additional_message_headers,fetchmail,zipdownload,contextmenu,showpassword"
            - name: ROUNDCUBEMAIL_COMPOSER_PLUGINS
              value: "johndoh/contextmenu:3.3.1,pf4public/fetchmail:1.0.13"
            - name: ROUNDCUBEMAIL_SKIN
              value: elastic
            - name: ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE
              value: "25M"
            - name: ROUNDCUBEMAIL_DES_KEY
              valueFrom: { secretKeyRef: { name: roundcube-legacy-app, key: des_key } }
            - name: ROUNDCUBE_VIRTUSER_QUERY_DSN
              valueFrom: { secretKeyRef: { name: roundcube-legacy-app, key: virtuser_query_dsn } }
            - name: ROUNDCUBE_PASSWORD_DB_DSN
              valueFrom: { secretKeyRef: { name: roundcube-legacy-app, key: password_db_dsn } }
            # Ohne diesen DSN steht das fetchmail-Plugin zwar in der Liste,
            # kann aber keine Abholkonten lesen oder anlegen - die Nutzer
            # sehen eine leere Maske.
            - name: ROUNDCUBE_FETCHMAIL_DB_DSN
              valueFrom: { secretKeyRef: { name: roundcube-legacy-app, key: fetchmail_db_dsn } }
          volumeMounts:
            - name: roundcube-config
              mountPath: /var/roundcube/config
            # J.I.T.-Anpassungen aus dem Swarm (roundcube-customizations CM):
            - { name: roundcube-custom, mountPath: /var/www/html/plugins/showpassword/showpassword.php, subPath: showpassword.php }
            - { name: roundcube-custom, mountPath: /var/www/html/plugins/showpassword/init.js, subPath: init.js }
            - { name: roundcube-custom, mountPath: /var/www/html/plugins/showpassword/style.css, subPath: style.css }
            - { name: roundcube-custom, mountPath: /var/www/html/skins/jit-logo.png, subPath: jit-logo.png }
            - { name: php-cve-mitigation, mountPath: /usr/local/etc/php/conf.d/zz-cve-2026-109619.ini, subPath: zz-cve-2026-109619.ini, readOnly: true }
          resources:
            # Gemessen am 28.07.2026: 170Mi, also oberhalb des alten 128Mi-Requests.
            # 19.08.2026: Limit 384Mi -> 768Mi. Der Ruhewert (gemessen 240Mi) lag bei
            # 62 % des Limits — das sieht harmlos aus, reicht aber nicht fuer
            # Lastspitzen: der Pod wurde 11x mit OOMKilled/Exit 137 abgeraeumt,
            # zuletzt nach 5,3 h Laufzeit. Die Nodes hatten dabei reichlich Luft
            # (wrk1: 32 % Speicher), es war also das cgroup-Limit, nicht der Node.
            # Faustregel hier: Limit ~3x Ruhewert, nicht ~1,5x.
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: roundcube-config
          configMap:
            name: roundcube-config
        - name: roundcube-custom
          configMap:
            name: roundcube-customizations
        - name: php-cve-mitigation
          configMap:
            name: roundcube-php-cve-mitigation
---
apiVersion: v1
kind: Service
metadata:
  name: roundcube
  namespace: roundcube
spec:
  selector: { app.kubernetes.io/name: roundcube }
  ports: [{ name: http, port: 80, targetPort: 80 }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: roundcube
  namespace: roundcube
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "25m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [webmail.jit.services] # CHANGE ME
      secretName: roundcube-tls
  rules:
    - host: webmail.jit.services # CHANGE ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: roundcube, port: { number: 80 } } }
