apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: roundcube-pg
  namespace: roundcube
spec:
  instances: 1 # 3 for HA
  # Explizit gepinnt: ohne imageName waehlt der CNPG-Operator seine eigene
  # Default-Postgres-Version. Die steht dann nicht in Git, Renovate sieht sie
  # nicht, und ein Operator-Bump wechselt die DB-Version ungefragt. Dass das
  # real passiert, zeigt der Ist-Zustand: mailman-pg ist auf 16.6 gepinnt,
  # alle ungepinnten liefen auf 17.2 — Major-Divergenz als reiner Nebeneffekt.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt; der Scheduler bilanziert Nodes ausserdem nur nach Requests.
  # Genau das traf am 28.07.2026 die MariaDB-Pods (Exit 137).
  # Gemessen am 28.07.2026: ~117Mi im Betrieb.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi # 12.07.: 2Gi durch WAL-Stau vollgelaufen — Puffer
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: roundcube
      owner: roundcube
      secret:
        name: roundcube-db-app # basic-auth secret (username/password) — see secret.sops.yaml
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21, Bucket backups).
  # WICHTIG: erst reaktiviert, seit das externe S3 existiert (13.07.) — ein
  # kaputtes Archive-Target würde WALs stauen bis die Disk voll ist.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-roundcube/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: roundcube-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: roundcube-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: roundcube-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
