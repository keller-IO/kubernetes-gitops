# Cutover-Ingress: uebernimmt office.savar.de von dockerswarm02 in den Cluster.
#
# Warum ein eigener Ingress und nicht ein zweiter Host im Chart-Ingress:
# office.jit.services laeuft mit Cluster-TLS und eigenem Redirect-Verhalten.
# office.savar.de bleibt deshalb in einem separaten Ingress; sein Redirect wird
# erst beim Router-Cutover aktiviert.
#
# Es ist KEINE DNS-Aenderung noetig: office.savar.de (87.191.135.42) laeuft schon
# heute ueber den .15-Traefik auf den Cluster-Ingress — der legacy-proxy-Eintrag
# hat den Request bisher nur an dockerswarm02 (192.168.2.242:9980) weitergereicht.
# Dieser Ingress ersetzt lediglich das Backend durch das In-Cluster-Collabora.
# Deshalb wird der office-Ingress in apps/base/legacy-proxy/ingress.yaml im
# SELBEN Commit entfernt: zwei Ingresses mit demselben Host wuerde nginx-inc mit
# "All hosts are taken by other resources" quittieren.
#
# Rollback: diesen Commit revertieren. Service und EndpointSlice "office" bleiben
# in legacy-proxy bestehen, der alte Pfad ist damit sofort wieder aktivierbar.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: collabora-office-savar
  namespace: collabora
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "false"
    # MUSS dem Service-Namen entsprechen, sonst verwirft NGINX den GESAMTEN
    # Ingress (NIC 5.x validiert strikt) — siehe docs/learnings/
    # nginx-ingress-5x-annotation-strictness.md
    nginx.org/websocket-services: collabora-collabora-online
    # WOPI-Editiersession ist ein langlebiger, meist idler WebSocket; der
    # 60s-Default trennt sie mit "connection lost, please reload".
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
    # Grosse Dokumente via WOPI PutFile — keine Grenze, wie im bisherigen
    # legacy-proxy-Eintrag.
    nginx.org/client-max-body-size: "0"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - office.savar.de
      secretName: collabora-office-savar-tls
  rules:
    - host: office.savar.de
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: collabora-collabora-online
                port:
                  number: 9980
