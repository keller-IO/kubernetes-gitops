replicaCount: 1
# Chart-Default ist autoscaling.enabled=true mit maxReplicas: 100 — das ignoriert
# replicaCount komplett. Im Cluster gibt es aber KEINEN metrics-server
# (APIService v1beta1.metrics.k8s.io = MissingEndpoints), also lief die HPA in
# FailedGetResourceMetric und konnte weder hoch- noch runterskalieren: sie fror bei
# 55 Replicas ein (~28 GB Memory-Requests, mehr als alle Worker zusammen haben) und
# hat am 28.07.2026 den halben Cluster lahmgelegt — ArgoCD, cert-manager, ceph-csi
# und cnpg kamen mangels Speicher nicht mehr hoch.
# Erst wieder aktivieren, wenn ein metrics-server läuft UND maxReplicas realistisch ist.
autoscaling:
  enabled: false
collabora:
  # WOPI hosts allowed to embed the editor (aus dem Swarm-Setup übernommen:
  # jit.cloud ist die Nextcloud, die Collabora einbindet).
  aliasgroups:
    - host: "https://jit\\.cloud"
    - host: "https://.*\\.jit\\.services"
  extra_params: --o:ssl.enable=false --o:ssl.termination=true
  # admin console credentials come from env (see existingSecret below)
existingSecret:
  enabled: true
  secret: collabora-secret
  usernameKey: username
  passwordKey: password
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
    nginx.org/websocket-services: collabora-collabora-online # MUSS dem Service-Namen entsprechen, sonst verwirft NGINX den ganzen Ingress
    nginx.org/client-max-body-size: "100m" # large documents via WOPI PutFile
    # WOPI editing session is a long-lived idle WebSocket — default 60s proxy
    # timeout drops it ("connection lost, please reload"). Match upstream Collabora/Nextcloud docs.
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
  hosts:
    - host: office.jit.services # CHANGE ME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [office.jit.services] # CHANGE ME
      secretName: collabora-tls
