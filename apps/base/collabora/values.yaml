replicaCount: 1
# NICHT wieder einschalten. Der Chart-Default ist autoscaling.enabled=true mit
# maxReplicas: 100 und ignoriert replicaCount komplett.
#
# Die HPA skaliert u. a. auf memory mit einem Ziel von 50 % der Requests. Collabora
# belegt aber dauerhaft MEHR als seinen 512Mi-Request (gemessen: 104 %), und dieser
# Wert ist PRO POD — mehr Replicas senken ihn nicht. Damit ist das Ziel prinzipiell
# unerreichbar und die HPA skaliert monoton bis maxReplicas hoch. Das ist kein
# Tuning-Problem, sondern speicherbasiertes Autoscaling auf einer Workload, die
# dafuer ungeeignet ist.
#
# Am 28.07.2026 stand das Deployment dadurch bei 55 Replicas (~28 GB Requests, mehr
# als alle drei Worker zusammen haben) und legte den Cluster lahm: ArgoCD (alle 7
# Komponenten), cert-manager, ceph-csi, cnpg und kube-state-metrics in
# CrashLoopBackOff, 25 Pods Pending mit "Insufficient memory".
#
# Ein laufender metrics-server ist ausdruecklich KEINE Entwarnung — im Gegenteil:
# ohne Metriken war die HPA nur eingefroren, mit Metriken (metrics-server kam per
# PR #43 dazu) skalierte sie sofort wieder hoch. Wer autoscaling erneut aktivieren
# will, braucht zuerst realistische Requests und ein CPU- statt Memory-Target.
autoscaling:
  enabled: false
collabora:
  # WOPI hosts allowed to embed the editor (aus dem Swarm-Setup übernommen:
  # jit.cloud ist die Nextcloud, die Collabora einbindet).
  aliasgroups:
    - host: "https://jit\\.cloud"
    - host: "https://.*\\.jit\\.services"
  extra_params: --o:ssl.enable=false --o:ssl.termination=true
  # admin console credentials come from env (see existingSecret below)
existingSecret:
  enabled: true
  secret: collabora-secret
  usernameKey: username
  passwordKey: password
resources:
  requests: { cpu: 250m, memory: 512Mi }
  limits: { memory: 1Gi }
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
    nginx.org/websocket-services: collabora-collabora-online # MUSS dem Service-Namen entsprechen, sonst verwirft NGINX den ganzen Ingress
    nginx.org/client-max-body-size: "100m" # large documents via WOPI PutFile
    # WOPI editing session is a long-lived idle WebSocket — default 60s proxy
    # timeout drops it ("connection lost, please reload"). Match upstream Collabora/Nextcloud docs.
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
  hosts:
    - host: office.jit.services # CHANGE ME
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts: [office.jit.services] # CHANGE ME
      secretName: collabora-tls
