apiVersion: v1
kind: Namespace
metadata:
  # Name setzt das Overlay (kustomize namespace:)
  name: jitmgmt
  labels:
    app.kubernetes.io/name: jitmgmt
    # Eigener Namespace statt ArgoCD CreateNamespace=true, sonst fehlen die
    # PodSecurity-Labels.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
