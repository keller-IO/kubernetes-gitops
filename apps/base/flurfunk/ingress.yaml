apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flurfunk
  namespace: flurfunk
  annotations:
    # Ingress-Controller ist nginx-inc (nginx.org/ingress-controller), NICHT
    # community-ingress-nginx — nginx.ingress.kubernetes.io/*-Annotationen
    # würden hier still ignoriert (siehe apps/base/expense-tracker/ingress.yaml).
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/redirect-to-https: "true"
    nginx.org/ssl-redirect: "true"
    nginx.org/client-max-body-size: "12m"   # Bild-Uploads im Aufgaben-Editor, App-Limit 8 MB
    nginx.org/proxy-read-timeout: "60s"
spec:
  ingressClassName: nginx
  # ACHTUNG (noch ungelöst, siehe Chat): wohngut.net steht NICHT in den
  # dnsZones-Selektoren des letsencrypt-prod-ClusterIssuer (weder beim
  # rfc2136-DNS-01-Solver noch beim http01-Solver) — obwohl die Zone laut
  # SOA/NS bereits auf dns01/ns3.jitcreatives.de gehostet wird. Ohne
  # passenden Solver-Eintrag bleibt die Certificate-Order für diesen Host
  # hängen (No solver found). Muss vor dem ersten Deploy in
  # infrastructure/base/cert-manager ergänzt werden.
  tls:
    - hosts: [app.wohngut.net]
      secretName: flurfunk-tls
  rules:
    - host: app.wohngut.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: flurfunk
                port: { name: http }
