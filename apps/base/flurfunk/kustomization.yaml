apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flurfunk
resources:
  - namespace.yaml
  - pvc.yaml
  - service.yaml
  - deployment.yaml
  - ingress.yaml

generators:
  - ./secret-generator.yaml

# NTFY_URL/NTFY_TOKEN (optionale Push-Benachrichtigungen) sind bewusst nicht
# gesetzt -- bei Bedarf in secret.sops.yaml ergänzen (just decrypt, editieren,
# just encrypt). Achtung: der lokale age-Key (~/.config/sops/age/keys.txt)
# entspricht NICHT dem echten Cluster-Key (argocd-sops-age im argocd-
# Namespace) -- Entschlüsseln/Bearbeiten geht erst, wenn der richtige
# private Key lokal vorliegt (siehe Chat-Verlauf, 18.09.2026).
