apiVersion: v1
kind: Namespace
metadata:
  name: flurfunk
  labels:
    app.kubernetes.io/name: flurfunk
    # Eigener Namespace statt ArgoCD CreateNamespace=true, sonst fehlen die
    # PodSecurity-Labels (siehe crowdsec-agent-Vorfall, docs/learnings +
    # apps/base/expense-tracker/namespace.yaml).
    pod-security.kubernetes.io/enforce: baseline
