apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
# Self-hosted Renovate as a CronJob, scanning the GitHub source repository.
resources:
  - cronjob.yaml
configMapGenerator:
  - name: renovate-config
    files:
      - config.js
generatorOptions:
  disableNameSuffixHash: true

generators:
  - ./secret-generator.yaml
