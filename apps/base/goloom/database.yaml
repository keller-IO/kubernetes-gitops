# Postgres fuer Goloom (ersetzt SQLite auf goloom-data; Medien bleiben auf der PVC).
# Zugang: goloom-db-app (SOPS), dieselben Zugangsdaten stehen als DATABASE_URL in
# goloom-secrets, weil das Upstream-Chart die DSN nur aus diesem Secret liest.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: goloom-pg
  namespace: goloom
spec:
  instances: 2
  # Zwei Instanzen (Primary + Standby), damit ein Node-Drain (Talos-Upgrade) per
  # Switchover statt als DB-Ausfall laeuft. required: Standby landet nie auf dem
  # Node des Primary (5 Worker, daher erfuellbar). Der SUC-Preflight erwartet
  # fuer volle Drain-Sicherheit weiterhin 3 Instanzen.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  # Explizit gepinnt wie die uebrigen CNPG-Cluster: ohne imageName waehlt der
  # Operator seine Default-Version, und ein Operator-Bump wechselt sie ungefragt.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort. Startwert wie ciso-assistant-pg; nach
  # der ersten Betriebswoche nachziehen.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: goloom
      owner: goloom
      secret:
        name: goloom-db-app
  # Backup nach Garage-S3 in den eigenen Bucket backup-goloom (Key backup-goloom,
  # RW nur auf diesen Bucket, Quota 20 GiB), Pfad cnpg/.
  # Schema siehe docs/runbooks/backup-restore.md, Abschnitt Secrets.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backup-goloom/cnpg/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: goloom-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: goloom-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: goloom-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: goloom-pg
  namespace: goloom
spec:
  schedule: "0 50 2 * * *" # 6-field (CNPG = Sekunden zuerst): taeglich 02:50, versetzt zu den uebrigen
  backupOwnerReference: self
  cluster:
    name: goloom-pg
