# Einmal-Migration SQLite -> Postgres als ArgoCD-PreSync-Hooks. Sie laufen VOR dem
# Sync, der die App auf database.type=postgres umstellt:
#
#   Wave -2  goloom-pg-stop     App auf 0 skalieren und warten, bis der Pod weg ist
#   Wave -1  goloom-pg-migrate  SQLite exportieren, in einer Transaktion importieren
#   Sync                        Deployment mit replicas: 1 auf Postgres
#
# Beide sind idempotent: existiert public._goloom_sqlite_import, stoppt der erste
# Hook die App nicht und der Import endet sofort. Scheitert der Import, rollt er
# komplett zurueck, der Sync bricht ab und die SQLite-Datei bleibt unveraendert —
# Rueckweg: Umstellungs-PR revertieren. Nach der Umstellung wieder entfernen.
apiVersion: batch/v1
kind: Job
metadata:
  name: goloom-pg-stop
  namespace: goloom
  labels:
    app.kubernetes.io/name: goloom
    app.kubernetes.io/component: pg-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goloom
        app.kubernetes.io/component: pg-migration
    spec:
      restartPolicy: Never
      serviceAccountName: goloom-pg-migrate
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: check
          image: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              for i in $(seq 1 60); do pg_isready -q -d "$DATABASE_URL" && break; echo "warte auf Postgres ($i)"; sleep 5; done
              if [ "$(psql "$DATABASE_URL" -Atc "select to_regclass('public._goloom_sqlite_import') is not null")" = t ]; then
                echo "Migration bereits erfolgt, App wird nicht gestoppt"; touch /work/skip
              fi
          env:
            - { name: HOME, value: /tmp }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: goloom-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: work, mountPath: /work }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: stop
          image: curlimages/curl:8.17.0 # renovate: image=curlimages/curl
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              if [ -e /work/skip ]; then exit 0; fi
              SA=/var/run/secrets/kubernetes.io/serviceaccount
              API=https://kubernetes.default.svc/apis/apps/v1/namespaces/goloom/deployments/goloom/scale
              curl -sS --fail --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
                -X PATCH -H 'Content-Type: application/merge-patch+json' \
                -d '{"spec":{"replicas":0}}' "$API" -o /dev/null
              echo "goloom auf 0 skaliert, warte auf Pod-Ende"
              SEL='app.kubernetes.io/name%3Dgoloom%2Capp.kubernetes.io/instance%3Dgoloom'
              for i in $(seq 1 100); do
                n=$(curl -sS --fail --cacert $SA/ca.crt -H "Authorization: Bearer $(cat $SA/token)" \
                  "https://kubernetes.default.svc/api/v1/namespaces/goloom/pods?labelSelector=$SEL" | grep -o '"phase"' | wc -l)
                [ "$n" -eq 0 ] && { echo "App gestoppt"; exit 0; }
                sleep 3
              done
              echo "App-Pod nach 300 s noch vorhanden"; exit 1
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: work, mountPath: /work }
      volumes:
        - { name: work, emptyDir: { sizeLimit: 1Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 16Mi } }
---
apiVersion: batch/v1
kind: Job
metadata:
  name: goloom-pg-migrate
  namespace: goloom
  labels:
    app.kubernetes.io/name: goloom
    app.kubernetes.io/component: pg-migration
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/sync-wave: "-1"
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: goloom
        app.kubernetes.io/component: pg-migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      # goloom-data ist RWO. Beim ersten Lauf ist die App gestoppt. Laeuft der Hook
      # spaeter erneut (Migration erledigt, App auf Postgres haelt die PVC fuer
      # Medien), muss er auf deren Node landen, sonst haengt er an Multi-Attach.
      affinity:
        podAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: goloom
                    app.kubernetes.io/instance: goloom
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: export
          image: keinos/sqlite3:3.53.4 # renovate: image=keinos/sqlite3
          command: ["/bin/sh", "/migration/export.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: SQLITE_DB, value: /app/data/goloom.db }
            - { name: EXPORT_DIR, value: /migrate }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # Schreibbar: sqlite3 braucht bei WAL die -shm-Datei.
            - { name: data, mountPath: /app/data }
            - { name: migrate, mountPath: /migrate }
            - { name: scripts, mountPath: /migration, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      containers:
        - name: import
          image: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
          command: ["/bin/bash", "/migration/import.sh"]
          env:
            - { name: HOME, value: /tmp }
            - { name: EXPORT_DIR, value: /migrate }
            - { name: SQL_DIR, value: /migration }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: goloom-secrets, key: DATABASE_URL } }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: migrate, mountPath: /migrate, readOnly: true }
            - { name: scripts, mountPath: /migration, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: goloom-data
        - { name: migrate, emptyDir: { sizeLimit: 512Mi } }
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
        - name: scripts
          configMap:
            name: goloom-pg-migration
