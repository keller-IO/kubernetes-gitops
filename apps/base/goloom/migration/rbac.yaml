# Einmal-Migration SQLite -> Postgres: Der PreSync-Hook goloom-pg-stop stoppt die
# SQLite-App, bevor exportiert wird. Er darf nur das Deployment goloom skalieren
# und Pods im Namespace lesen. Wird nach der Umstellung wieder entfernt.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: goloom-pg-migrate
  namespace: goloom
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: goloom-pg-migrate
  namespace: goloom
rules:
  - apiGroups: [apps]
    resources: [deployments, deployments/scale]
    resourceNames: [goloom]
    verbs: [get, patch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: goloom-pg-migrate
  namespace: goloom
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: goloom-pg-migrate
subjects:
  - kind: ServiceAccount
    name: goloom-pg-migrate
    namespace: goloom
