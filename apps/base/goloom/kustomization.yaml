apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goloom
helmGlobals:
  chartHome: ../../vendor
helmCharts:
  - name: goloom
    version: 0.1.0
    releaseName: goloom
    namespace: goloom
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - issuer.yaml
generators:
  - ./secret-generator.yaml
patches:
  - target:
      kind: Deployment
      name: goloom
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: goloom
      spec:
        template:
          spec:
            automountServiceAccountToken: false
            securityContext:
              seccompProfile:
                type: RuntimeDefault
            containers:
              - name: goloom
                securityContext:
                  capabilities:
                    drop: [ALL]
                  allowPrivilegeEscalation: false
                  readOnlyRootFilesystem: true
