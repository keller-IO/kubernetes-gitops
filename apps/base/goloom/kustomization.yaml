apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goloom
# The upstream chart is a separate source of the same Argo CD Application.
# This overlay owns only local resources and SOPS secrets.
resources:
  - namespace.yaml
  - issuer.yaml
  - backup-cronjob.yaml
  - service-account.yaml
  - pvc.yaml
generators:
  - ./secret-generator.yaml
