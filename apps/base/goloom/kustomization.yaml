apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: goloom
# The upstream chart is a separate source of the same Argo CD Application.
# This overlay owns only local resources and SOPS secrets.
resources:
  - namespace.yaml
  - issuer.yaml
  - backup-cronjob.yaml
  - service-account.yaml
  - pvc.yaml
  - database.yaml
  - migration/rbac.yaml
generators:
  - ./secret-generator.yaml
# Einmal-Migration SQLite -> Postgres (Skripte lokal gegen eine Kopie der
# Produktivdaten getestet). Nach der Umstellung entfernen.
configMapGenerator:
  - name: goloom-pg-migration
    files:
      - migration/export.sh
      - migration/import.sh
      - migration/import.sql
      - postgres-schema.sql=migration/postgres-schema-v0.3.0.sql
