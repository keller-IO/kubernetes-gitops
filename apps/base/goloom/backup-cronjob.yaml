# Offsite-Backup der Goloom-Medien: PVC goloom-data -> Garage Potsdam, Bucket backup-goloom.
#
#   media/current/               Spiegel von /app/data/media (rclone sync)
#   media/archive/<Zeit>/        von sync geloeschte/ueberschriebene Dateien, 30 Tage
#
# Die Datenbank liegt seit 18.10.2026 in Postgres (CNPG goloom-pg) und wird vom
# Operator nach s3://backup-goloom/cnpg/ gesichert (database.yaml). Unter sqlite/
# liegen die frueheren SQLite-Staende; sie werden nicht mehr geloescht, der
# letzte ist goloom-2026-10-18T052756Z.db.gz (Stand der Migration).
#
# goloom-data ist RWO: der Pod muss auf dem Node der App laufen (podAffinity).
# Die Labels hier duerfen den Selector von Deployment/Service nicht treffen,
# deshalb fehlt app.kubernetes.io/instance.
#
# Zugang: goloom-backup-s3 (Garage-Key backup-goloom, RW nur auf den eigenen
# Bucket, Quota 20 GiB). Restore: docs/runbooks/backup-restore.md, Abschnitt Goloom.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: goloom-backup
  namespace: goloom
  labels:
    app.kubernetes.io/name: goloom
    app.kubernetes.io/component: backup
spec:
  schedule: "45 3 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: goloom
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: goloom
                      app.kubernetes.io/instance: goloom
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2 # renovate: image=rclone/rclone
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  if [ -d /data/media ]; then
                    rclone sync /data/media garage:backup-goloom/media/current \
                      --backup-dir "garage:backup-goloom/media/archive/${STAMP}" \
                      --checksum --stats-one-line --stats 0 -v
                  else
                    echo "noch kein /data/media"
                  fi
                  rclone delete garage:backup-goloom/media/archive --min-age 30d --rmdirs -v
                  rclone size garage:backup-goloom
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # existiert nicht (harmloser NOTICE); Remote kommt aus RCLONE_CONFIG_*
                - { name: RCLONE_CACHE_DIR, value: /tmp/cache }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://192.168.23.21:3900" }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                # Der Key darf keine Buckets anlegen; ohne no_check_bucket scheitert
                # rclone vor jedem Upload an CreateBucket (403).
                - { name: RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_GARAGE_REGION
                  valueFrom: { secretKeyRef: { name: goloom-backup-s3, key: region } }
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: goloom-backup-s3, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: goloom-backup-s3, key: SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: goloom-data
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
