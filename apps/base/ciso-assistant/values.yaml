global:
  # Host fuer Ingress, CISO_ASSISTANT_URL, ALLOWED_HOSTS und ORIGIN des Frontends.
  domain: grc.jit.services
  image:
    # Explizit statt Chart-appVersion (0.12.3 = v4.0.4): gilt fuer Backend,
    # Huey und Frontend gemeinsam, die drei muessen dieselbe Version fahren.
    tag: v4.0.6 # renovate: image=ghcr.io/intuitem/ciso-assistant-community/backend
    imagePullPolicy: IfNotPresent

backend:
  config:
    # Leer lassen. Mit gesetzter Adresse legt CISO Assistant beim `migrate`
    # einen Superuser OHNE Passwort an (Passwort nur per Mail-Link, SMTP gibt
    # es hier noch nicht) — und das anschliessende createsuperuser mit
    # Passwort scheitert dann an der schon vergebenen Adresse. Der Admin
    # kommt stattdessen ueber DJANGO_SUPERUSER_* aus dem Secret (env unten).
    emailAdmin: ""
    databaseType: externalPgsql
    djangoExistingSecretKey: ciso-assistant-django
  env:
    # startup.sh: `createsuperuser --noinput`, sobald DJANGO_SUPERUSER_EMAIL
    # gesetzt ist; bei jedem weiteren Start ein harmloser "already exists"-Fehler.
    # Adresse bewusst im Secret: das gitops-Repo ist oeffentlich.
    - name: DJANGO_SUPERUSER_EMAIL
      valueFrom:
        secretKeyRef: { name: ciso-assistant-django, key: superuser-email }
    - name: DJANGO_SUPERUSER_PASSWORD
      valueFrom:
        secretKeyRef: { name: ciso-assistant-django, key: superuser-password }
  persistence:
    # Evidenzen/Anhaenge (Default waere db/attachments im Container = fluechtig).
    # Liegt NICHT im CNPG-Backup — siehe PRODUCTION-READINESS.md.
    localStorage:
      enabled: true
      size: 5Gi
      storageClass: ceph-rbd
      accessMode: ReadWriteOnce
  # Startwerte ohne Messung (neue App); nach der ersten Betriebswoche per
  # `kubectl top` nachziehen. Gunicorn laeuft mit 3 Workern.
  resources:
    requests: { cpu: 200m, memory: 768Mi }
    limits: { memory: 1536Mi }
  huey:
    resources:
      requests: { cpu: 50m, memory: 384Mi }
      limits: { memory: 1Gi }

frontend:
  resources:
    requests: { cpu: 50m, memory: 192Mi }
    limits: { memory: 512Mi }

externalPgsql:
  host: ciso-assistant-pg-rw
  port: 5432
  database: ciso-assistant
  user: ciso-assistant
  # Das CNPG-Bootstrap-Secret traegt den Key 'password' — genau den erwartet der Chart.
  existingSecret: ciso-assistant-db-app

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    # Ingress-Controller ist nginx-inc: nginx.org/*, nicht nginx.ingress.kubernetes.io/*.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    # Muss zu frontend.config.bodySizeLimit (50M) passen, sonst schneidet nginx
    # Evidenz-Uploads ab (Controller-Default ist 10m).
    nginx.org/client-max-body-size: "50m"
    # Nur interne Netze. *.jit.services loest zwar auf .246 (RFC1918) auf, der
    # Router leitet 443 aber auf genau diesen LB — wer den Host-Header setzt,
    # kaeme sonst von aussen an VVT und Risikoregister.
    # $remote_addr ist die echte Client-IP (externalTrafficPolicy: Local);
    # XFF wird nur aus 192.168.2.0/24 geglaubt, eine Internet-Adresse kann sich
    # hier also nicht hineinschreiben.
    #   192.168.0.0/16  LAN Halbe (.2, .9, .107 ...), Potsdam (.23)
    #   10.0.0.0/8      Pod-Netz (10.244/16, z. B. gatus), victorianix 10.10.10/24
    #   100.64.0.0/10   NetBird
    nginx.org/server-snippets: |
      allow 192.168.0.0/16;
      allow 10.0.0.0/8;
      allow 100.64.0.0/10;
      deny all;
  tls:
    enabled: true
    # Von cert-manager (Annotation oben) per DNS-01 ueber ClouDNS befuellt.
    existingSecret: ciso-assistant-tls
