apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ciso-assistant-pg
  namespace: ciso-assistant
spec:
  instances: 1 # 3 fuer HA
  # Explizit gepinnt: ohne imageName waehlt der Operator seine Default-Version.
  # Die steht dann nicht in Git, Renovate sieht sie nicht, und ein
  # Operator-Bump wechselt die DB-Version ungefragt. 17.2 wie bei den
  # uebrigen CNPG-Clustern.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort: bei Speicherdruck zuerst gekillt,
  # und der Scheduler bilanziert Nodes nur nach Requests.
  # Startwert wie expense-pg/paperless-pg (dort gemessen 57-108Mi); nach der
  # ersten Betriebswoche per `kubectl top` nachziehen.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: ciso-assistant
      owner: ciso-assistant
      secret:
        name: ciso-assistant-db-app
  # Backup nach Garage-S3 in einen EIGENEN Bucket mit eigenem Key (RW nur auf
  # diesen Bucket, 20 GiB Quota). Garage kennt keine Prefix-Rechte: ein Key auf
  # dem gemeinsamen Bucket backups koennte die Backups aller Apps loeschen.
  # Schema siehe docs/runbooks/backup-restore.md, Abschnitt Secrets.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backup-ciso-assistant/cnpg/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: ciso-assistant-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: ciso-assistant-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: ciso-assistant-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
