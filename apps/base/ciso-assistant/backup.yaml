apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: ciso-assistant-pg
  namespace: ciso-assistant
spec:
  schedule: "0 40 2 * * *" # 6-field (CNPG = Sekunden zuerst): taeglich 02:40, versetzt zu den uebrigen
  # Schreibruhiger Cluster: auf einem Standby erzwingt pg_backup_stop keinen WAL-Switch,
  # das Backup endet dann in einem noch nicht archivierten Segment (docs/learnings/cnpg-standby-backup-unarchived-wal.md).
  target: primary
  backupOwnerReference: self
  cluster:
    name: ciso-assistant-pg
