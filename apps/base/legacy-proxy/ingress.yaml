# Reverse-Proxy-Routen fuer den docker15-Cutover. Cluster-TLS wird VOR dem
# Routerwechsel ausgestellt (DNS-01), die HTTPS-Redirects bleiben bis dahin aus —
# sonst loopt der vorgeschaltete .15-Traefik.
#
# Bewusst OHNE Issuer: stream.horads.de (HTTP-01, loest erst wenn WAN:80 auf .246
# zeigt). Ebenso fehlt cloud.naturkindergarten-moehringen.de im jitcloud-Zertifikat,
# solange der _acme-challenge-CNAME beim Provider fehlt — ein scheiternder Name
# reisst sonst die gesamte Anforderung mit.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mgmt02
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "false"
    nginx.org/client-max-body-size: "0" # keine Upload-Grenze (Web/FTP)
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.jit-creatives.de
        - mgmt02.jit-creatives.de
        - www.jitcreatives.de
        - ftp.jit-creatives.de
      secretName: mgmt02-tls
  rules:
    - host: www.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: mgmt02.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: www.jitcreatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: ftp.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
---
