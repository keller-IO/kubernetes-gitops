# Reverse-Proxy-Routen nach dem docker15-Cutover. Seit dem 13.09.2026 gehen die
# WAN-Ports 80/443 direkt auf den Cluster-LB; TLS terminiert im Cluster.
#
# Bewusst noch OHNE Issuer: stream.horads.de verwendet bis zur separaten
# HTTP-01-Migration das vorgeladene Zertifikat. Ebenso fehlt
# cloud.naturkindergarten-moehringen.de im jitcloud-Zertifikat, solange der
# _acme-challenge-CNAME beim Provider fehlt — ein scheiternder Name reisst sonst
# die gesamte Anforderung mit.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mgmt02
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "0" # keine Upload-Grenze (Web/FTP)
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - www.jit-creatives.de
        - mgmt02.jit-creatives.de
        - www.jitcreatives.de
        - ftp.jit-creatives.de
      secretName: mgmt02-tls
  rules:
    - host: www.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: mgmt02.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: www.jitcreatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: ftp.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
---
