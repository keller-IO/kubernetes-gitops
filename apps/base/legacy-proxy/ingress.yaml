# Reverse-Proxy-Routen nach dem docker15-Cutover. Seit dem 13.09.2026 gehen die
# WAN-Ports 80/443 direkt auf den Cluster-LB; TLS terminiert im Cluster.
#
# cloud.steinba.ch und cloud.naturkindergarten-moehringen.de stehen nicht im
# jitcloud-Zertifikat (DNS-01), sondern in jitcloud-preload mit eigenem
# HTTP-01-Zertifikat, siehe jitcloud-extra-certificate.yaml.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mgmt02
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "0" # keine Upload-Grenze (Web/FTP)
spec:
  ingressClassName: nginx
  tls:
    # www.jit-creatives.de und www.jitcreatives.de liefert seit dem Umzug
    # apps/overlays/main/jitmgmt aus (Ingress jitmgmt-public).
    - hosts:
        - mgmt02.jit-creatives.de
        - ftp.jit-creatives.de
      secretName: mgmt02-tls
  rules:
    - host: mgmt02.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
    - host: ftp.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: mgmt02, port: { number: 80 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: umdiehand
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "0" # Nextcloud: keine Upload-Grenze
    # HSTS hier, weil TLS am Ingress endet; das Backend spricht nur HTTP.
    # 180 Tage = Mindestwert des Nextcloud-Setup-Checks. Ohne includeSubDomains:
    # unter jit-creatives.de haengen viele andere Dienste.
    nginx.org/hsts: "true"
    nginx.org/hsts-max-age: "15552000"
    nginx.org/hsts-include-subdomains: "false"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - umdiehand.jit-creatives.de
        - gesinefranze.jit-creatives.de
      secretName: umdiehand-tls
  rules:
    - host: umdiehand.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: umdiehand, port: { number: 80 } } } }]
    - host: gesinefranze.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: umdiehand, port: { number: 80 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: horads
  namespace: legacy-proxy
  annotations:
    # horads.de liegt im http01-Solver des ClusterIssuers (DNS bei BelWue/HdM).
    # edit-in-place ist Pflicht: ohne legt cert-manager einen zweiten Ingress fuer
    # denselben Host an, nginx-inc verwirft ihn ("All hosts are taken by other
    # resources") und die Challenge landet als 404 beim Icecast.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
    # ssl-redirect bleibt "false" (Entscheidung Ingo, 26.10.2026): Webradios und
    # aeltere Player, die den Stream per http:// eingetragen haben, folgen einem
    # 301 auf https oft nicht. HTTP-01-Erneuerungen gehen so ohnehin ohne Umweg.
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "false"
    # Icecast-Stream: Buffering aus + lange Timeouts (Dauer-Verbindung). Als
    # nginx-inc-Annotations statt Snippet (Snippet dupliziert proxy_read_timeout
    # -> nginx-Reload scheitert [emerg]).
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  # Neuer Secret-Name statt horads-preload-tls: in das ksops-Secret aus Git
  # wuerde cert-manager schreiben und selfHeal es wieder zuruecksetzen.
  tls:
    - hosts:
        - stream.horads.de
      secretName: horads-tls
  rules:
    - host: stream.horads.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: horads, port: { number: 8080 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: spam
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - spam.savar.de
      secretName: spam-tls
  rules:
    - host: spam.savar.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: spam, port: { number: 80 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: imcor
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    # Backend spricht selbst HTTPS (.21:443) -> re-encrypt zum Upstream
    nginx.org/ssl-services: "imcor"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - imcor.de
        - www.imcor.de
        - db.imcor.de
        - config.imcor.de
        - jonaks.com
        - www.jonaks.com
      secretName: imcor-tls
  rules:
    - host: imcor.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
    - host: www.imcor.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
    - host: db.imcor.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
    - host: config.imcor.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
    - host: jonaks.com
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
    - host: www.jonaks.com
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: imcor, port: { number: 443 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - auth.savar.de
        - auth2.savar.de
        - login.jit-creatives.de
      secretName: auth-tls
  rules:
    - host: auth.savar.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: auth, port: { number: 8080 } } } }]
    - host: auth2.savar.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: auth, port: { number: 8080 } } } }]
    # Zweite oeffentliche Domain fuer denselben Keycloak (JIT-Branding).
    - host: login.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: auth, port: { number: 8080 } } } }]
---
# office.savar.de wird jetzt vom In-Cluster-Collabora bedient, siehe
# apps/base/collabora/ingress-savar.yaml. Der Ingress MUSS hier verschwinden,
# solange der neue existiert: zwei Ingresses mit demselben Host quittiert
# nginx-inc mit "All hosts are taken by other resources" und verwirft einen davon.
#
# Service und EndpointSlice "office" (-> dockerswarm02, 192.168.2.242:9980)
# bleiben bewusst in external-backends.yaml stehen: ein Revert dieses Commits
# stellt den alten Pfad damit sofort wieder her. Erst entfernen, wenn
# dockerswarm02 endgueltig abgeschaltet wird.
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    # S3: grosse Objekte streamen, nicht puffern; lange Multipart-Transfers
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - s3.savar.de
        - s3.jit-creatives.de
      secretName: s3-tls
  rules:
    - host: s3.savar.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: s3, port: { number: 7480 } } } }]
    - host: s3.jit-creatives.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: s3, port: { number: 7480 } } } }]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitcloud
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # ⚠️ ssl-redirect bleibt "false", bis die HTTP-01-Zertifikate dieses Ingress
    # stehen. Mit "true" beantwortet nginx die ACME-Challenge auf
    # /.well-known/acme-challenge/ mit einem 301 auf https — die Ausstellung
    # scheitert dann dauerhaft. Siehe Runbook, "Cutover-Reihenfolge und Rollback".
    # Seit PR #170 traegt dieser Ingress nur noch Hosts MIT Zertifikat
    # (cloud.steinba.ch und cloud.naturkindergarten-moehringen.de sind nach
    # jitcloud-preload gewandert) — daher hier "true".
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "false"
    # Backend spricht selbst HTTPS (.218:443 = nc04) -> re-encrypt zum Upstream.
    # jitcloud-push steht bewusst NICHT hier: der notify_push-Daemon spricht
    # Klartext-HTTP auf 7867.
    nginx.org/ssl-services: "jitcloud"
    # notify_push haelt eine WebSocket-Verbindung je Client offen.
    nginx.org/websocket-services: "jitcloud-push"
    # Der Daemon erwartet seine Pfade an der Wurzel (/ws, /test/cookie), der
    # Client spricht https://jit.cloud/push/... an.
    nginx.org/rewrites: "serviceName=jitcloud-push rewrite=/"
    # Nextcloud: grosse Uploads + Sync-Clients mit langen Requests
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cloud.savar.de
        - jit.cloud
        - cloud.daec-berlin.de
      secretName: jitcloud-tls
  rules:
    - host: cloud.savar.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: jitcloud, port: { number: 443 } } } }]
    - host: jit.cloud
      http:
        paths:
          # ⚠️ Der abschliessende Schraegstrich in "/push/" ist Pflicht, nicht
          # Kosmetik. nginx-inc setzt das Rewrite als Schraegstrich am
          # proxy_pass um und ersetzt damit genau das gematchte Praefix. Mit
          # "/push" bliebe der Schraegstrich des Restpfads stehen, aus
          # /push/test/cookie wuerde //test/cookie, und notify_push antwortet
          # darauf mit 404 statt 400. Genau so lief diese Route am 03.10.2026
          # ins Leere. cloud-dev nutzt dieselbe Schreibweise.
          # /push/ vor / : nginx waehlt ohnehin das laengste Praefix, aber die
          # Reihenfolge macht beim Lesen sichtbar, dass hier abgezweigt wird.
          - { path: /push/, pathType: Prefix, backend: { service: { name: jitcloud-push, port: { number: 7867 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: jitcloud, port: { number: 443 } } } }
    - host: cloud.daec-berlin.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: jitcloud, port: { number: 443 } } } }]
---
# cloud-dev.savar.de bleibt auf den Dev-VMs. TLS terminiert direkt an diesem
# Ingress; der Hauptpfad wird per HTTPS zum Nextcloud-Backend re-encryptet.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-dev
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/ssl-services: "cloud-dev"
    nginx.org/websocket-services: "cloud-dev-push"
    # Traefik hat /push bisher per StripPrefix entfernt. Das servicebezogene
    # Rewrite bildet exakt dieses Verhalten nach, ohne den Hauptpfad zu aendern.
    nginx.org/rewrites: "serviceName=cloud-dev-push rewrite=/"
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cloud-dev.savar.de
      secretName: cloud-dev-tls
  rules:
    - host: cloud-dev.savar.de
      http:
        paths:
          - path: /push/
            pathType: Prefix
            backend: { service: { name: cloud-dev-push, port: { number: 7867 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: cloud-dev, port: { number: 443 } } }
---
# Nextcloud Talk HPB. TLS terminates in the cluster; talk01 serves HTTP only and
# performs the signaling path rewrite before forwarding to its container.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloud-dev-talk-hpb
  namespace: legacy-proxy
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/websocket-services: "cloud-dev-talk-hpb"
    nginx.org/proxy-buffering: "false"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - signal.cloud-dev.savar.de
      secretName: cloud-dev-talk-hpb-tls
  rules:
    - host: signal.cloud-dev.savar.de
      http:
        paths:
          - path: /standalone-signaling/
            pathType: Prefix
            backend: { service: { name: cloud-dev-talk-hpb, port: { number: 80 } } }
---
# Diese beiden Namen gehoeren inhaltlich zum jitcloud-Ingress, haben aber ein
# eigenes Objekt und Zertifikat: jitcloud laeuft ueber DNS-01, diese beiden ueber
# HTTP-01 (naturkindergarten-moehringen.de hat keinen _acme-challenge-CNAME). So
# reisst eine scheiternde Challenge das Sammelzertifikat nicht mit.
# ⚠️ Name nicht aendern: der Issuer legacy-proxy-http01 traegt den Challenge-Pfad
# per http01.ingress.name in DIESEN Ingress ein (jitcloud-extra-certificate.yaml).
# "-preload" ist historisch (PR #170, vorgeladenes Traefik-Zertifikat bis 30.11.2026).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jitcloud-preload
  namespace: legacy-proxy
  annotations:
    # jitcloud-extra-tls steht seit #391, daher "true" wie jitcloud: Erneuerungen
    # gehen trotz Redirect, weil LE ihm auf https folgt und das Secret existiert.
    # ⚠️ Bei einer Neuausstellung ohne Secret vorher auf "false" stellen.
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "false"
    nginx.org/ssl-services: "jitcloud"
    nginx.org/client-max-body-size: "0"
    nginx.org/proxy-read-timeout: "3600s"
    nginx.org/proxy-send-timeout: "3600s"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - cloud.steinba.ch
        - cloud.naturkindergarten-moehringen.de
      secretName: jitcloud-extra-tls
  rules:
    - host: cloud.steinba.ch
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: jitcloud, port: { number: 443 } } } }]
    - host: cloud.naturkindergarten-moehringen.de
      http:
        paths: [{ path: /, pathType: Prefix, backend: { service: { name: jitcloud, port: { number: 443 } } } }]
