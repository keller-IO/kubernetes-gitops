# ⚠️ TEMPORAER — nur fuer den docker15-Cutover, danach wieder entfernen.
#
# Zertifikat aus dem ACME-Store des Traefik auf 192.168.2.15 (Resolver "http"),
# hier VORGELADEN. Grund: nginx liefert fuer unbekanntes SNI GAR KEIN
# Zertifikat — der Default-Server hat keins —, der TLS-Handshake bricht also ab.
# Ohne Vorladen waere stream.horads.de im Moment des UDM-Schwenks fuer Minuten tot,
# bis cert-manager per HTTP-01 nachgezogen haette.
#
# Der zugehoerige Ingress traegt BEWUSST KEINE cert-manager-Annotation: sonst
# startet cert-manager sofort HTTP-01-Challenges, die vor dem Cutover
# zwangslaeufig scheitern, weil Traefik auf .15 Port 80 abfaengt.
#
# NACH dem Cutover: Annotation ergaenzen, cert-manager uebernimmt, danach diese
# Datei und ihren Generator-Eintrag loeschen.
#
# horads-preload-tls: stream.horads.de (gueltig bis 24.10.2026)
