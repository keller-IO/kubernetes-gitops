# s3 (Ceph RGW, 3-fach load-balanced) -> 192.168.2.6/.7/.8:7480
apiVersion: v1
kind: Service
metadata: { name: s3, namespace: legacy-proxy }
spec:
  # ClusterIP gepinnt (der bereits zugeteilte Wert), weil ciso-assistant sie als
  # S3-Endpoint traegt: die App kann botocore nicht auf Path-Style zwingen, mit
  # einem DNS-Endpoint wuerde daraus Virtual-Host-Style und NXDOMAIN. Ein
  # Neuanlegen des Service ohne diesen Pin wuerde die IP aendern und die
  # Evidenz-Speicherung brechen.
  clusterIP: 10.103.83.185
  ports: [{ name: http, port: 7480, targetPort: 7480 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: s3
  namespace: legacy-proxy
  labels: { kubernetes.io/service-name: s3 }
addressType: IPv4
ports: [{ name: http, port: 7480 }]
endpoints:
  - addresses: ["192.168.2.6"]
    conditions: { ready: true }
  - addresses: ["192.168.2.7"]
    conditions: { ready: true }
  - addresses: ["192.168.2.8"]
    conditions: { ready: true }
---
# ⚠️⚠️ DIE ADRESSEN IN DIESER DATEI ERZEUGEN NICHTS. ⚠️⚠️
# ArgoCD schliesst Endpoints UND EndpointSlice per resource.exclusions aus
# (argocd-cm, ArgoCDs mitgelieferte Standardliste). Die Slices hier werden also
# weder angelegt, noch abgeglichen, noch gepruned — und die App meldet trotzdem
# "Synced", weil ausgeschlossene Objekte nicht verglichen werden. Alle Slices im
# Namespace sind von Hand angelegt. Diese Datei dokumentiert nur den Sollstand.
#
# Folge: Wer hier eine Adresse aendert, aendert nichts am Cluster. Neue oder
# geaenderte Slices zusaetzlich per kubectl apply ausrollen und den Live-Stand
# mit `kubectl -n legacy-proxy get endpointslice` gegenpruefen.
#
# Am 03.10.2026 war die Datei deshalb zehn Tage lang falsch: live lief .218,
# hier stand .217. Wer dem Repo glaubte, suchte den Fehler auf dem falschen Node.
#
# Wenn Git diese Objekte wirklich besitzen soll, muss EndpointSlice aus den
# Exclusions. Vorher die Werte hier mit dem Live-Stand abgleichen, sonst zieht
# ArgoCD beim ersten Sync den Produktivverkehr auf eine andere Node.
---
# jitcloud (Nextcloud, HTTPS-Backend!) -> 192.168.2.218:443 = nc04
# Bewusst nc04 und nicht nc05: nc05 (VM 2034) laeuft auf dem Node lat7440,
# einem Laptop, der zugleich runner01, mastodon02 und kellerio-wrk1 traegt.
# Nur EIN aktives Backend, daher kein Sticky-Cookie noetig (in nginx-inc OSS
# waere es ohnehin NGINX-Plus-only).
apiVersion: v1
kind: Service
metadata: { name: jitcloud, namespace: legacy-proxy }
spec:
  ports: [{ name: https, port: 443, targetPort: 443 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jitcloud
  namespace: legacy-proxy
  labels: { kubernetes.io/service-name: jitcloud }
addressType: IPv4
ports: [{ name: https, port: 443 }]
endpoints:
  - addresses: ["192.168.2.218"]
    conditions: { ready: true }
---
# notify_push (Client Push) fuer jit.cloud -> nc04 192.168.2.218:7867.
# Eigenes Backend, weil der Daemon im Gegensatz zum Nextcloud-Backend KLARTEXT-
# HTTP spricht: "jitcloud-push" darf deshalb nicht in nginx.org/ssl-services.
# Dieselbe Node wie der Hauptpfad, damit Client und Session zusammenbleiben.
# Der Daemon laeuft auf beiden App-Nodes; beim Umschwenken des Hauptpfads muss
# diese Adresse mitwandern — und zwar per kubectl, siehe Warnung oben.
apiVersion: v1
kind: Service
metadata: { name: jitcloud-push, namespace: legacy-proxy }
spec:
  ports: [{ name: http, port: 7867, targetPort: 7867 }]
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: jitcloud-push
  namespace: legacy-proxy
  labels: { kubernetes.io/service-name: jitcloud-push }
addressType: IPv4
ports: [{ name: http, port: 7867 }]
endpoints:
  - addresses: ["192.168.2.218"]
    conditions: { ready: true }
---
# cloud-dev (Nextcloud-Dev, HTTPS-Backend) -> nc01-dev 192.168.2.220:443 und
# nc02-dev 192.168.2.221:443. Beide Nodes teilen PHP-Sessions ueber Redis
# (cfgmgmt01 playbooks/nc_dev_runtime.yml); Sticky Sessions sind nicht noetig.
apiVersion: v1
kind: Service
