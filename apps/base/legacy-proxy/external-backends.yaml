  labels: { kubernetes.io/service-name: cloud-dev }
addressType: IPv4
ports: [{ name: https, port: 443 }]
endpoints:
  - addresses: ["192.168.2.220"]
    conditions: { ready: true }
  - addresses: ["192.168.2.221"]
    conditions: { ready: true }
---
