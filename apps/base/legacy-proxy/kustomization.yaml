apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: legacy-proxy
# Reverse-Proxy zu Legacy-Backends außerhalb des Clusters (nachgebaut aus dem
# .15-Traefik): mgmt02 (jit-creatives), umdiehand/gesinefranze, horads-Stream.
# Keine eigenen Workloads; nur Service/EndpointSlice + Ingress.
resources:
  - namespace.yaml
  - external-backends.yaml
  - ingress.yaml

# ⚠️ TEMPORAER bis nach dem docker15-Cutover: vorgeladene Zertifikate aus dem
# Traefik-ACME-Store, damit stream.horads.de und die beiden cloud-Aliase im
# Moment des UDM-Schwenks nicht ohne Zertifikat dastehen. Siehe
# preload-horads.sops.yaml.
generators:
  - ./secret-generator.yaml
