# Zertifikat fuer die beiden jitcloud-Aliase aus jitcloud-preload
# (cloud.steinba.ch, cloud.naturkindergarten-moehringen.de). Hat das vorgeladene
# Traefik-Zertifikat abgeloest, zweistufig ohne Luecke: #391 stellte in das neue
# Secret jitcloud-extra-tls aus, waehrend der Ingress noch das Preload-Secret
# auslieferte; der Folge-PR stellte den Ingress um.
#
# Warum ein eigener Issuer statt letsencrypt-prod:
# - naturkindergarten-moehringen.de steht im ClusterIssuer im DNS-01-Follow-Solver,
#   der beim Provider (IONOS) fehlende _acme-challenge-CNAME laesst ihn scheitern.
#   Entscheidung 12.09.2026: HTTP-01 (docs/runbooks/docker15-retirement.md).
# - http01.ingress.name traegt den Challenge-Pfad direkt in jitcloud-preload ein
#   (wie edit-in-place). Ein eigener Solver-Ingress wuerde von nginx-inc als
#   Host-Duplikat verworfen. Den Pfad nimmt clusters/main/appset-apps.yaml von der
#   Drift-Erkennung aus (#390).
# - Ein explizites Certificate statt ingress-shim: nur so kann das Secret
#   ausgestellt werden, bevor der Ingress darauf zeigt.
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: legacy-proxy-http01
  namespace: legacy-proxy
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: legacy-proxy-http01-account
    solvers:
      - http01:
          ingress:
            name: jitcloud-preload
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: jitcloud-extra
  namespace: legacy-proxy
spec:
  secretName: jitcloud-extra-tls
  dnsNames:
    - cloud.steinba.ch
    - cloud.naturkindergarten-moehringen.de
  issuerRef:
    name: legacy-proxy-http01
    kind: Issuer
