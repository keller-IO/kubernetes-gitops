# Offsite-Backup von Tonu: PVC tonu-data -> Garage Potsdam, Bucket backup-tonu.
#
#   sqlite/tonu-<Zeit>.db.gz   konsistente Kopie per SQLite-Backup-API, 30 Tage
#   uploads/current/           Spiegel von /data/uploads (rclone sync)
#   uploads/archive/<Zeit>/    von sync geloeschte/ueberschriebene Dateien, 30 Tage
#   uploads/last-run.txt       Heartbeat
#
# Die DB (app.db) laeuft im WAL-Modus; eine Dateikopie waere nicht konsistent. Tonu hat keine
# eigene Sicherung (kein backups/-Verzeichnis). Wie die fruehere Goloom-Sicherung (Commit
# d34a050) zieht der initContainer per `sqlite3 .backup` eine Kopie, prueft sie per
# integrity_check und packt sie; scheitert die Pruefung, bricht der Job vor dem Upload ab.
# Der initContainer mountet die PVC schreibbar, weil SQLite bei WAL die -shm-Datei mappen
# muss; dieselbe UID/GID 10001 wie die App. Der rclone-Container mountet read-only.
#
# Die Manifeste der App liegen im GitLab-Repo tommy/tonu (ADR 0004); dieser CronJob kommt
# ueber die Application app-offsite-backups-external aus diesem Repo.
# tonu-data ist RWO: podAffinity auf app.kubernetes.io/name=tonu. Namespace-PSA: baseline.
#
# Offen nach dem Merge (Abnahme): Garage-Bucket/-Key backup-tonu pruefen, ersten Lauf anstossen,
# Restore-Test. Das Secret tonu-backup-s3 liegt verschluesselt in Git und ist eingebunden
# (secret-generator.yaml). Fehlt ein Key im Secret oder stimmt der Name nicht, scheitert der Pod
# mit CreateContainerConfigError (KubeJobFailed); Ursache steht in den Pod-Events.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tonu-offsite-backup
  namespace: tonu
  labels:
    app.kubernetes.io/name: tonu-offsite-backup
    app.kubernetes.io/part-of: tonu
    app.kubernetes.io/component: offsite-backup
spec:
  schedule: "30 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Abgeschlossene Jobs verschwinden nach 7 Tagen, damit ein laengst
      # abgeloester Fehllauf KubeJobFailed nicht dauerhaft aktiv haelt.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          # Bewusst ohne app.kubernetes.io/instance und mit eigenem name-Wert:
          # Deployment und Service selektieren auf app.kubernetes.io/name=tonu.
          labels:
            app.kubernetes.io/name: tonu-offsite-backup
            app.kubernetes.io/part-of: tonu
            app.kubernetes.io/component: offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: tonu
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: snapshot
              image: keinos/sqlite3:3.54.1 # renovate: image=keinos/sqlite3
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  OUT=/work/tonu-${STAMP}.db
                  sqlite3 -cmd ".timeout 30000" /data/app.db ".backup ${OUT}"
                  CHECK=$(sqlite3 "${OUT}" "pragma integrity_check;")
                  if [ "${CHECK}" != "ok" ]; then echo "integrity_check: ${CHECK}"; exit 1; fi
                  sqlite3 "${OUT}" "select 'tables=' || count(*) from sqlite_master where type='table';"
                  gzip -9 "${OUT}"
                  sha256sum "${OUT}.gz"
              env:
                - { name: HOME, value: /work }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                # Schreibbar gemountet: sqlite3 muss bei WAL die -shm-Datei mappen.
                - { name: data, mountPath: /data }
                - { name: work, mountPath: /work }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2 # renovate: image=rclone/rclone
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  rclone copy /work garage:backup-tonu/sqlite --include "tonu-*.db.gz" -v
                  if [ -d /data/uploads ]; then
                    rclone sync /data/uploads garage:backup-tonu/uploads/current \
                      --backup-dir "garage:backup-tonu/uploads/archive/${STAMP}" \
                      --checksum --stats-one-line --stats 0 -v
                  fi
                  rclone delete garage:backup-tonu/sqlite --use-server-modtime --min-age 30d -v
                  rclone delete garage:backup-tonu/uploads/archive --use-server-modtime --min-age 30d --rmdirs -v
                  date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/last-run
                  rclone copyto /tmp/last-run garage:backup-tonu/uploads/last-run.txt
                  rclone lsl garage:backup-tonu/sqlite | tail -3
                  rclone size garage:backup-tonu
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # existiert nicht (harmloser NOTICE); Remote kommt aus RCLONE_CONFIG_*
                - { name: RCLONE_CACHE_DIR, value: /tmp/cache }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://192.168.23.21:3900" }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                # Der Key darf keine Buckets anlegen; ohne no_check_bucket scheitert
                # rclone vor jedem Upload an CreateBucket (403).
                - { name: RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_GARAGE_REGION
                  valueFrom: { secretKeyRef: { name: tonu-backup-s3, key: region } }
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: tonu-backup-s3, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: tonu-backup-s3, key: SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: work, mountPath: /work, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: tonu-data
            - name: work
              emptyDir: { sizeLimit: 256Mi }
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
