# Offsite-Backup von Flurfunk: PVC flurfunk-data -> Garage Potsdam, Bucket backup-flurfunk.
#
#   files/current/          Spiegel von /data ohne die Live-Datenbank (rclone sync)
#   files/archive/<Zeit>/   von sync geloeschte/ueberschriebene Dateien, 30 Tage
#   files/last-run.txt      Heartbeat
#
# SQLite: app.db, app.db-wal und app.db-shm werden NICHT kopiert (Dateikopie im WAL-Betrieb
# waere inkonsistent). Stattdessen liegt backups/app-JJJJ-MM-TT.db.gz im Spiegel: die App
# erzeugt es taeglich um ca. 02:30 UTC; gemessen am 02.11.2026 vier aufeinanderfolgende Staende,
# gzip ok, SQLite integrity_check ok, 40 Objekte, Zeilenzahlen plausibel. Auch backups/vm-*.bin und
# vm-status.json der App werden mitgesichert. Der Job laeuft nach dem App-Dump und scheitert
# (exit 1, KubeJobFailed), wenn der neueste Dump aelter als 36 h oder kein gueltiges gzip ist.
# Fehlt die App-Sicherung, ist das also sichtbar statt still.
#
# Die Manifeste der App liegen im GitLab-Repo tommy/flurfunk (ADR 0004); dieser CronJob kommt
# ueber die Application app-offsite-backups-external aus diesem Repo.
# flurfunk-data ist RWO: podAffinity auf app.kubernetes.io/name=flurfunk. UID/GID 10001 wie die
# App. Namespace-PSA: baseline, restricted-konform.
#
# UNVOLLSTAENDIG (Draft-PR): Das Secret flurfunk-backup-s3 und der Garage-Bucket/-Key
# backup-flurfunk fehlen noch. Bis dahin scheitert der Pod mit CreateContainerConfigError
# (KubeJobFailed). Anlegen und einbinden: docs/runbooks/backup-restore.md, Abschnitt
# "Offsite-Sicherung der PVCs".
apiVersion: batch/v1
kind: CronJob
metadata:
  name: flurfunk-offsite-backup
  namespace: flurfunk
  labels:
    app.kubernetes.io/name: flurfunk-offsite-backup
    app.kubernetes.io/part-of: flurfunk
    app.kubernetes.io/component: offsite-backup
spec:
  schedule: "20 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Abgeschlossene Jobs verschwinden nach 7 Tagen, damit ein laengst
      # abgeloester Fehllauf KubeJobFailed nicht dauerhaft aktiv haelt.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          # Bewusst ohne app.kubernetes.io/instance und mit eigenem name-Wert:
          # Deployment und Service selektieren auf app.kubernetes.io/name=flurfunk.
          labels:
            app.kubernetes.io/name: flurfunk-offsite-backup
            app.kubernetes.io/part-of: flurfunk
            app.kubernetes.io/component: offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: flurfunk
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2 # renovate: image=rclone/rclone
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  rclone sync /data garage:backup-flurfunk/files/current \
                    --exclude "/lost+found/**" \
                    --exclude "/app.db" \
                    --exclude "/app.db-wal" \
                    --exclude "/app.db-shm" \
                    --backup-dir "garage:backup-flurfunk/files/archive/${STAMP}" \
                    --checksum --stats-one-line --stats 0 -v
                  rclone delete garage:backup-flurfunk/files/archive --use-server-modtime --min-age 30d --rmdirs -v
                  date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/last-run
                  rclone copyto /tmp/last-run garage:backup-flurfunk/files/last-run.txt
                  rclone size garage:backup-flurfunk
                  LATEST=$(ls -1 /data/backups/app-*.db.gz 2>/dev/null | sort | tail -1 || true)
                  if [ -z "${LATEST}" ]; then echo "FEHLER: kein App-Dump unter /data/backups"; exit 1; fi
                  if [ -z "$(find "${LATEST}" -mmin -2160)" ]; then echo "FEHLER: neuester App-Dump ${LATEST} ist aelter als 36 h"; exit 1; fi
                  gzip -t "${LATEST}" || { echo "FEHLER: ${LATEST} ist kein gueltiges gzip"; exit 1; }
                  echo "App-Dump ok: ${LATEST}"
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # existiert nicht (harmloser NOTICE); Remote kommt aus RCLONE_CONFIG_*
                - { name: RCLONE_CACHE_DIR, value: /tmp/cache }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://192.168.23.21:3900" }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                # Der Key darf keine Buckets anlegen; ohne no_check_bucket scheitert
                # rclone vor jedem Upload an CreateBucket (403).
                - { name: RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_GARAGE_REGION
                  valueFrom: { secretKeyRef: { name: flurfunk-backup-s3, key: region } }
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: flurfunk-backup-s3, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: flurfunk-backup-s3, key: SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: flurfunk-data
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
