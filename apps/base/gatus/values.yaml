# Gatus — automated service health dashboard.
resources:
  requests: { cpu: 50m, memory: 32Mi }
  limits: { memory: 64Mi }

# Inject the OIDC client secret; gatus expands ${...} in config at runtime.
envFrom:
  - secretRef:
      name: gatus-oidc

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
  hosts:
    - status.jit.services
  tls:
    - secretName: gatus-tls
      hosts:
        - status.jit.services

config:
  # OIDC DEAKTIVIERT bis der Keycloak-Client im Realm bgt existiert und das
  # Secret passt: Gatus macht beim Start OIDC-Discovery und panict, wenn die
  # fehlschlägt. Block erst nach Client-/Secret-Abgleich wieder einsetzen.
  # security:
  #   oidc:
  #     issuer-url: https://auth.savar.de/realms/bgt
  #     redirect-url: https://status.jit.services/authorization-code/callback
  #     client-id: gatus
  #     client-secret: ${OIDC_CLIENT_SECRET} # from gatus-oidc secret
  #     scopes: [openid, profile, email]
  ui:
    title: Homelab Status
  # Push-Checks: Gatus kann diese Zustände nicht selbst abfragen, sie werden vom
  # CronJob paperless-watchdog (apps/base/paperless-ngx/watchdog.yaml) gemeldet.
  # Meldet sich ein Check länger als heartbeat-interval nicht, wertet Gatus das
  # als Ausfall — damit fällt auch ein toter CronJob auf.
  external-endpoints:
    - name: consume-queue
      group: paperless
      token: ${WATCHDOG_TOKEN} # aus gatus-oidc secret
      heartbeat:
        interval: 45m
    - name: last-document
      group: paperless
      token: ${WATCHDOG_TOKEN}
      heartbeat:
        interval: 45m
  endpoints:
    - name: argocd
      group: intern (jit.services)
      url: https://argocd.jit.services
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: webmail
      group: intern (jit.services)
      url: https://webmail.jit.services
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: paperless
      group: extern (via Legacy-Traefik)
      url: https://paperless.savar.de
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: phpmyadmin
      group: intern (jit.services)
      url: https://dbadmin.jit.services
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: collabora (WOPI)
      group: intern (jit.services)
      url: https://office.jit.services/hosting/discovery
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: victoriametrics
      group: intern (jit.services)
      url: https://metrics.jit.services/health
      interval: 60s
      conditions: ["[STATUS] == 401", "[STATUS] < 500"] # BasicAuth erwartet
    # forgejo entfernt (13.09.2026): das Deployment steht in Git bewusst auf
    # replicas: 0, ArgoCD meldet das korrekt als Synced/Healthy. Der Check war
    # damit dauerhaft rot, ohne dass es etwas zu tun gab. Wieder aufnehmen,
    # sobald forgejo zurueckkommt.
    # mastodon entfernt (13.09.2026): die App wurde am 11.09. aus dem Cluster
    # entfernt, social.jit.services existiert nicht mehr. Die oeffentliche
    # Instanz prueft weiterhin jit.social — die laeuft und bleibt drin.
    - name: eurooffice
      group: intern (jit.services)
      url: https://eurooffice.jit.services/healthcheck
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: icecast
      group: intern (jit.services)
      url: https://radio.jit.services/status.xsl
      interval: 60s
      conditions: ["[STATUS] == 200"]
    # wordpress-3 entfernt (13.09.2026): seit 27.07.2026 bewusst auf replicas: 0,
    # weil das Deployment einen ServiceAccount "wordpress" verlangt, den es im
    # Namespace nie gab. Reaktivieren heisst: den replicas-Patch im Overlay
    # entfernen UND den ServiceAccount anlegen — dann auch diesen Check zurueck.
    - name: kite
      group: intern (jit.services)
      url: https://kite.jit.services/healthz
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: kubernetes-mcp
      group: intern (jit.services)
      url: https://mcp.jit.services/healthz
      interval: 60s
      conditions: ["[STATUS] == 401", "[STATUS] < 500"] # BasicAuth erwartet
    - name: kimai
      group: extern (via Legacy-Traefik)
      url: https://kimai.savar.de
      interval: 60s
      conditions: ["[STATUS] < 400"]
    - name: mailman
      group: extern (via Legacy-Traefik)
      url: https://lists.jitmail.de/postorius/lists/
      interval: 60s
      conditions: ["[STATUS] == 200"]
    # nextcloud-dev entfernt (13.09.2026): das Backend nc01-dev (192.168.2.220)
    # antwortet seit mindestens dem 11.09. nicht mehr. Der Host cloud-dev.savar.de
    # bleibt laut Entscheidung vom 11.09. bestehen und hat ein gueltiges
    # Zertifikat — nur das Backend dahinter laeuft nicht. Check zurueckholen,
    # sobald .220 wieder da ist.
    - name: jugendbeauftragter-halbe
      group: extern (via Legacy-Traefik)
      url: https://jugendbeauftragter-halbe.de
      interval: 60s
      conditions: ["[STATUS] == 200"]
    - name: gemeinsam-fuer-halbe
      group: extern (via Legacy-Traefik)
      url: https://www.gemeinsam-fuer-halbe.de
      interval: 60s
      conditions: ["[STATUS] == 200"]
