apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matomo
  namespace: matomo
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # HTTPS wird erzwungen. Die nginx auf mgmt02 (192.168.2.234) spricht den
    # Cluster fuer den first-party-Tracker /stats/ seit dem 14.09.2026 per
    # HTTPS an (proxy_ssl_server_name on; proxy_ssl_name matomo.jit.services).
    #
    # Historie: bis zum 12./13.09.2026 standen beide Werte auf "false", weil
    # mgmt02 damals per HTTP anlieferte. Die Sammel-PRs #152 und #169 stellten
    # sie auf "true" und brachen damit /stats/ — der Tracker lief in einen
    # Redirect auf matomo.jit.services, das oeffentlich auf eine RFC1918-Adresse
    # zeigt und von aussen nicht erreichbar ist. Ergebnis: vom 13. bis 14.09.
    # wurde kein einziger Besuch gezaehlt.
    #
    # NICHT auf "false" zuruecksetzen — stattdessen mgmt02 auf HTTPS lassen.
    nginx.org/ssl-redirect: "true"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "10m"
    # Nur interne Netze (wie ciso-assistant). *.jit.services loest zwar auf die
    # LAN-Adresse .246 auf, der Router leitet 443 aber auf denselben LB. Am
    # 22.09.2026 von extern (Hetzner) mit gesetztem Host-Header geprueft: HTTP 200.
    #   192.168.0.0/16  LAN Halbe, Potsdam (.23), mgmt02 (.234, Tracker /stats/)
    #   10.0.0.0/8      Pod-Netz (gatus), victorianix
    #   100.64.0.0/10   NetBird
    #
    # Geprueft wird der TCP-Peer ($realip_remote_addr), NICHT $remote_addr.
    # mgmt02 reicht den Tracker mit X-Forwarded-For weiter, und XFF aus
    # 192.168.2.0/24 wird global geglaubt (set-real-ip-from). $remote_addr ist
    # fuer Tracker-Aufrufe daher die oeffentliche Besucher-IP — mit
    # allow/deny lief vom 22.09. bis 23.10.2026 jeder externe Besuch in 403
    # und Matomo zaehlte nichts. Interne Tests fielen nicht auf, weil dort
    # auch die Besucher-IP intern ist. Oeffentlich wird dadurch nichts:
    # mgmt02 reicht nur ^/stats/(matomo\.php|matomo\.js)$ durch.
    nginx.org/server-snippets: |
      if ($realip_remote_addr !~ "^(192\.168\.|10\.|100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.)") {
        return 403;
      }
spec:
  ingressClassName: nginx
  tls:
    - hosts: [matomo.jit.services]
      secretName: matomo-tls
  rules:
    - host: matomo.jit.services
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: matomo
                port:
                  number: 80
