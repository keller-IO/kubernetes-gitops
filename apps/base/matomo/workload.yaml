apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: matomo-data
  namespace: matomo
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: matomo
  namespace: matomo
spec:
  replicas: 1 # RWO-PVC: mehr als eine Replica geht nicht ohne RWX
  strategy:
    type: Recreate # sonst blockiert die alte Replica das RWO-Volume
  selector:
    matchLabels: { app.kubernetes.io/name: matomo }
  template:
    metadata:
      labels: { app.kubernetes.io/name: matomo }
    spec:
      # Das Image entpackt /usr/src/matomo nur, wenn /var/www/html noch kein
      # matomo.php hat (/entrypoint.sh). Auf dem PVC blieb der Code daher fuer
      # immer auf dem Stand der Erstinstallation: bis 23.10.2026 lief unter dem
      # 5.14.0-Image weiter 5.13.0-Code. Dieser initContainer tauscht den Code
      # bei jedem Versionswechsel aus und fuehrt die DB-Migration aus.
      # Erhalten bleiben config/config.ini.php, tmp/, misc/user/ und Plugins,
      # die nicht aus dem Image stammen (Marketplace). Alles andere wird
      # geloescht, damit keine Dateien der Vorversion liegen bleiben.
      initContainers:
        - name: upgrade-code
          # Muss immer dasselbe Image wie der matomo-Container sein.
          # renovate: image=matomo
          image: matomo:5.14.0-apache@sha256:c7abe4fa279bc5f80d1e6820b48586106408d15c8f5e774a8ebc10350868ceb4
          command: ["/bin/sh", "-euc"]
          args:
            - |
              cd /var/www/html
              version() { sed -n "s/.*const VERSION = '\(.*\)';/\1/p" "$1/core/Version.php" 2>/dev/null || true; }
              want=$(version /usr/src/matomo)
              have=$(version .)
              if [ ! -e matomo.php ]; then
                echo "Erstinstallation, uebernimmt /entrypoint.sh"; exit 0
              fi
              if [ "$have" = "$want" ]; then
                echo "Matomo $have aktuell"; exit 0
              fi
              echo "Matomo-Code $have -> $want"
              find . -mindepth 1 -maxdepth 1 ! -name config ! -name tmp ! -name misc \
                ! -name plugins ! -name lost+found -exec rm -rf {} +
              find config -mindepth 1 -maxdepth 1 ! -name config.ini.php \
                ! -name common.config.ini.php -exec rm -rf {} +
              find misc -mindepth 1 -maxdepth 1 ! -name user -exec rm -rf {} +
              for p in plugins/*; do
                if [ -e "/usr/src/matomo/$p" ]; then rm -rf "$p"; fi
              done
              rm -rf tmp/cache tmp/templates_c
              tar cf - --one-file-system -C /usr/src/matomo . | tar xf -
              chown -R www-data:www-data .
              su -s /bin/sh www-data -c "php console core:update --yes --no-interaction"
              echo "Matomo $(version .) installiert"
          # DB-Zugang liest console aus config/config.ini.php auf dem PVC.
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: config
              mountPath: /var/www/html/config/common.config.ini.php
              subPath: common.config.ini.php
              readOnly: true
            - name: init-tmp
              mountPath: /tmp
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
      containers:
        - name: matomo
          # Digest = Neubau vom 21.10.2026 mit PHP 8.4.27 (CVE-2026-109618/-109619).
          # renovate: image=matomo
          image: matomo:5.14.0-apache@sha256:c7abe4fa279bc5f80d1e6820b48586106408d15c8f5e774a8ebc10350868ceb4
          ports: [{ containerPort: 80, name: http }]
          env:
            - name: MATOMO_DATABASE_ADAPTER
              value: mysql
            - name: MATOMO_DATABASE_HOST
              value: matomo-mariadb
            - name: MATOMO_DATABASE_DBNAME
              value: matomo
            - name: MATOMO_DATABASE_USERNAME
              value: matomo
            - name: MATOMO_DATABASE_PASSWORD
              valueFrom: { secretKeyRef: { name: matomo-secret, key: mariadb-password } }
          volumeMounts:
            - name: data
              mountPath: /var/www/html
            - name: config
              mountPath: /var/www/html/config/common.config.ini.php
              subPath: common.config.ini.php
              readOnly: true
          # Probe-Werte bewusst grosszuegig: in diesem Cluster wurden schon
          # mehrfach gesunde Dienste von ihren eigenen Probes abgeschossen
          # (mailman-web, roundcube-pg, gatus-public). Matomo entpackt beim
          # ersten Start seine Dateien auf das Ceph-Volume, das dauert.
          startupProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60 # bis zu 10 Minuten fuer den Erststart
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          # Kein `capabilities: drop: [ALL]`: das Apache-Image bindet Port 80
          # und braucht dafuer CAP_NET_BIND_SERVICE — ein pauschales Drop
          # laesst den Container gar nicht erst starten.
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: matomo-data }
        - name: config
          configMap: { name: matomo-config }
        - name: init-tmp
          emptyDir: { sizeLimit: 64Mi }
