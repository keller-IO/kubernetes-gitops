apiVersion: apps/v1
kind: Deployment
metadata:
  name: eurooffice
  namespace: eurooffice
  labels:
    app.kubernetes.io/name: eurooffice
spec:
  replicas: 1 # All-in-One (interne PG/RabbitMQ/Redis) ist nicht horizontal skalierbar
  strategy:
    type: Recreate # RWO-PVC: RollingUpdate verklemmt, wenn alter+neuer Pod auf verschiedenen Nodes landen
    rollingUpdate: null # Altwert im Live-Objekt muss beim Apply explizit gelöscht werden
  selector:
    matchLabels:
      app.kubernetes.io/name: eurooffice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: eurooffice
    spec:
      securityContext:
        fsGroup: 107 # gid des "ds"-Users im Image — PVC ist sonst root-owned (EACCES auf App_Data)
      containers:
        - name: documentserver
          # renovate: image=ghcr.io/euro-office/documentserver
          image: ghcr.io/euro-office/documentserver:v9.3.2
          ports:
            - containerPort: 80
          env:
            - name: JWT_ENABLED
              value: "true"
            - name: JWT_SECRET # identischer Wert gehört in die Nextcloud-Connector-Config
              valueFrom:
                secretKeyRef: { name: eurooffice-secret, key: jwt-secret }
            # Die Dev-Nextcloud (cloud-dev.savar.de) löst intern auf 192.168.2.x auf —
            # ohne das Flag blockt der Request-Filter den Dokumenten-Abruf.
            - name: ALLOW_PRIVATE_IP_ADDRESS
              value: "true"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 80
            initialDelaySeconds: 180 # Erststart: interner Stack + Font-Cache-Generierung dauern
            periodSeconds: 30
            # Default-Timeout 1 s: 31 Liveness-Fehler "context deadline exceeded"
            # (Befund 31.10.2026); wie die Readiness-Probe 5 s.
            timeoutSeconds: 5
          resources:
            # Gemessen am 28.07.2026: 1013Mi — praktisch exakt auf dem alten Request,
            # also ohne Reserve. Request mit Kopffreiheit statt auf Kante.
            requests: { cpu: 250m, memory: 1280Mi }
            limits: { memory: 4Gi } # Doku-Minimum 4 GB RAM
          volumeMounts:
            # KEIN Mount über /var/log/euro-office/documentserver: das Image bringt dort
            # vorangelegte Unterverzeichnisse (adminpanel/ …) mit — ein emptyDir verdeckt
            # sie und supervisord bricht beim Start ab.
            - { name: data, mountPath: /var/lib/euro-office/documentserver }
            # Das Image bringt ein nicht sauber heruntergefahrenes PG-Datenverzeichnis mit
            # (Container-Layer, fluechtig). Jeder Start fuehrt daher eine Crash-Recovery aus,
            # die zuerst jede Datei per fsync() synchronisiert. Auf wrk4 (Ceph-RBD mit
            # langsamer OSD) dauert das > 60 s, und das pg_ctl-Start-Timeout beendet den
            # Container (CrashLoopBackOff). syncfs sichert das Dateisystem in einem Aufruf.
            # subPath, damit der Rest von conf.d (include_dir) erhalten bleibt.
            - name: postgres-conf
              mountPath: /etc/postgresql/16/main/conf.d/90-recovery-syncfs.conf
              subPath: 90-recovery-syncfs.conf
              readOnly: true
      volumes:
        - name: postgres-conf
          configMap:
            name: eurooffice-postgres-conf
        - name: data
          persistentVolumeClaim:
            claimName: eurooffice-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: eurooffice-data
  namespace: eurooffice
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ceph-rbd # CHANGE ME
  resources:
    requests:
      storage: 10Gi
