# Nicht-Geheimes fuer Staging; Zugangsdaten und Endpunkte in secret.sops.yaml.
# Alle Integrationen nach aussen sind aus, Mails gehen nur an support@
# (MAIL_REDIRECT_TO), sobald MAIL_ENABLED gesetzt ist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: jitmgmt-config
  namespace: jitmgmt-staging
data:
  DEBUG: "0"
  # Kein Ingress; Zugriff per kubectl port-forward, daher Host localhost.
  DJANGO_ALLOWED_HOSTS: "localhost 127.0.0.1"
  TRUST_X_FORWARDED_PROTO: "0"
  LOG_LEVEL: "INFO"
  HOME: "/tmp"

  INVOICE_STORAGE: "s3"
  INVOICE_S3_BUCKET: "invoices-staging"
  INVOICE_S3_REGION: "us-east-1"

  MAIL_ENABLED: "0"
  MAIL_REDIRECT_TO: "support@jitcreatives.de"
  MAIL_REDIRECT_LABEL: "STAGING"
  EMAIL_PORT: "587"

  PAYPAL_MODE: "sandbox"
  JITIX_REMOTE_ENABLED: "0"
  HETZNER_ROBOT_ENABLED: "0"
  BANKING_ENABLED: "0"
