apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jitmgmt-staging
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - cronjob-rechnungslauf.yaml

configMapGenerator:
  - name: jitmgmt-config
    envs: [config.env]

generators:
  - ./secret-generator.yaml
# Erreichbar unter https://jitmgmt-staging.jit.services, nur aus internen Netzen.
