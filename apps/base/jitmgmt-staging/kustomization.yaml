apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: jitmgmt-staging
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - cronjob-rechnungslauf.yaml

generators:
