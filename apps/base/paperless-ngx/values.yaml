image:
  # 3.x seit 13.11.2026 (Runbook docs/runbooks/paperless-v3-upgrade.md). Ein
  # Downgrade auf 2.x per Tag ist nach der Migration kein gueltiger Rollback.
  # watchdog.yaml und offsite-backup.yaml nutzen dasselbe Image: mitziehen.
  tag: 3.4.2 # renovate: image=ghcr.io/paperless-ngx/paperless-ngx
env:
  PAPERLESS_URL: https://paperless.jit.services
  PAPERLESS_DBENGINE: postgresql
  PAPERLESS_DBHOST: paperless-pg-rw
  PAPERLESS_DBNAME: paperless
  PAPERLESS_DBUSER: paperless
  PAPERLESS_REDIS: redis://paperless-valkey:6379
  PAPERLESS_TIME_ZONE: Europe/Berlin
  # CIFS does not reliably propagate inotify events; poll the scanner inbox.
  # 3.x: PAPERLESS_CONSUMER_POLLING heisst jetzt ..._POLLING_INTERVAL; der alte
  # Name wird nicht mehr ausgewertet (dann inotify, auf CIFS unzuverlaessig).
  PAPERLESS_CONSUMER_POLLING_INTERVAL: "10"
  # 3.x laesst Duplikate standardmaessig zu. Mit true lehnt Paperless Dateien
  # mit bekannter Pruefsumme wie bisher ab und loescht sie aus dem
  # Scanner-Share; dort loeste jede liegengebliebene Datei nach 30 min den
  # Watchdog-Alarm paperless_consume-queue aus (29.10.2026: 5 Dateien, alle
  # schon im Bestand).
  PAPERLESS_CONSUMER_DELETE_DUPLICATES: "true"
  # OCR-Einstellungen wie im Alt-System auf 192.168.2.15
  PAPERLESS_OCR_LANGUAGE: deu+eng
  PAPERLESS_OCR_LANGUAGES: deu # Paket-Liste (Leerzeichen-Format), eng ist im Image enthalten
  # 3.x trennt OCR und Archivdatei: auto + always entspricht dem frueheren
  # skip (OCR ueberspringen, wenn Text vorhanden ist, aber immer archivieren).
  PAPERLESS_OCR_MODE: auto
  PAPERLESS_ARCHIVE_FILE_GENERATION: always
  PAPERLESS_OCR_CLEAN: clean
  PAPERLESS_OCR_ROTATE_PAGES: "true"
  # Pillow warnt ab 30 MP pro Seite und bricht erst beim DOPPELTEN Wert ab
  # (A2 bei 300 dpi ~35 MP = nur Warnung, A1 ~70 MP = Abbruch). Der Abbruch wird
  # in Paperless 2.20 zum ParseError, auch im Force-OCR-Fallback: der Consume-Task
  # scheitert, es entsteht KEIN Dokument (auch nicht ohne OCR-Text), und eine
  # einzelne grosse Seite laesst das ganze Dokument scheitern. Ohne Grenze gilt
  # ocrmypdfs 250 MP: ein 57x129-cm-Plan ohne Text (Force-OCR, 103 MP) brauchte
  # lokal 2,3 GiB und killte den Pod am 26.10. und 28.10.2026 trotz 3Gi.
  PAPERLESS_OCR_MAX_IMAGE_PIXELS: "30000000"
  # Empfehlung von Paperless selbst bei "Ghostscript PDF/A rendering failed".
  # Gilt global: Seiten mit behebbarem Renderfehler (typisch fehlende Fonts)
  # werden trotzdem gerastert; Archiv-PDF und OCR-Text koennen optisch vom
  # Original abweichen. Das Original bleibt unveraendert gespeichert.
  PAPERLESS_OCR_USER_ARGS: '{"continue_on_soft_render_error": true}'
  # LLM-Index (ADR 0011): Vektorindex ueber ALLE Dokumente fuer "aehnliche
  # Dokumente". Es gibt keinen Tag- oder Besitzerfilter: auch Dokumente mit dem
  # Tag "Privat" gehen als Text an SAIA (GWDG). Kein Chat-Modell gesetzt, also
  # keine AI-Vorschlaege und kein Dokument-Chat (die Chat-Schaltflaeche
  # erscheint trotzdem und endet in einem Fehler).
  # Der Gateway wird direkt am Service angesprochen; die CiliumNetworkPolicy in
  # apps/base/litellm erlaubt diesem Pod nur POST /v1/embeddings. Der Schluessel
  # kommt aus paperless-ai-gateway (ai-gateway.sops.yaml).
  # Aktualisierung taeglich 02:10 (PAPERLESS_LLM_INDEX_TASK_CRON, Standard).
  PAPERLESS_AI_ENABLED: "true"
  PAPERLESS_AI_LLM_EMBEDDING_BACKEND: openai-like
  PAPERLESS_AI_LLM_EMBEDDING_MODEL: paperless-saia-embedding
  PAPERLESS_AI_LLM_EMBEDDING_ENDPOINT: http://litellm.litellm.svc.cluster.local:4000/v1
  # OIDC via django-allauth. Provider JSON lives in paperless-secret and must
  # match the Keycloak client in Realm bgt before login is enabled.
  PAPERLESS_APPS: allauth.socialaccount.providers.openid_connect
envFrom:
  - secretRef:
      name: paperless-secret
  - secretRef:
      name: paperless-ai-gateway
# Bitnami-redis-Subchart des Charts abschalten (Images tot, wir nutzen die
# eigene Valkey-Instanz aus cache.yaml — PAPERLESS_REDIS zeigt dorthin).
redis:
  enabled: false
persistence:
  data:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageClass: ceph-rbd # CHANGE ME
    accessMode: ReadWriteOnce
    size: 5Gi
  media:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    # RWO statt CephFS/RWX: Single-Replica reicht; zurück auf ceph-fs/RWX,
    # sobald der CephFS-Treiber deployt ist (client.kubernetes braucht mds-Caps).
    storageClass: ceph-rbd
    accessMode: ReadWriteOnce
    size: 20Gi
  consume:
    enabled: true
    type: custom
    mountPath: /usr/src/paperless/consume
    volumeSpec:
      csi:
        driver: smb.csi.k8s.io
        volumeAttributes:
          source: //192.168.2.75/scanner
          mountOptions: guest,vers=3.0,uid=1000,gid=1000,dir_mode=0777,file_mode=0666,noperm,cache=strict,noserverino
  export:
    enabled: true
    annotations:
      argocd.argoproj.io/sync-options: Prune=false,Delete=false
    storageClass: ceph-rbd # CHANGE ME
    accessMode: ReadWriteOnce
    # Haelt den inkrementellen Export des Offsite-Backups (offsite-backup.yaml,
    # export/nightly, Stand 27.10.2026 ca. 700 MiB) plus Upgrade-Exporte.
    size: 5Gi
  # PAPERLESS_SCRATCH_DIR (Default /tmp/paperless): Web-Uploads liegen hier, bis
  # Celery sie konsumiert. Im Container-Overlay gingen sie beim OOM-Kill am
  # 26.10.2026 mit verloren; ein emptyDir uebersteht Container-Neustarts, nicht
  # aber einen Pod-Wechsel — Rollouts deshalb nur ohne laufende Consume-Tasks
  # und mit leerer Warteschlange.
  scratch:
    enabled: true
    type: emptyDir
    mountPath: /tmp/paperless
    sizeLimit: 10Gi
# Startzeit bis Ready: 70 s beim ersten 3.4.2-Start am 13.11.2026 inklusive
# aller 3.x-Migrationen und Tantivy-Neuaufbau (731 Dokumente). 60 x 5 s = 5 min
# statt der Chart-Vorgabe 30 x 5 s = 150 s, damit Migrationen kuenftiger
# Updates nicht in den Neustart laufen. Fuer den ersten 3.x-Start galten 15 min.
probes:
  startup:
    spec:
      failureThreshold: 60
      periodSeconds: 5
resources:
  # Gemessen am 28.07.2026: 574Mi, knapp oberhalb des alten 512Mi-Requests.
  # CPU 500m statt 200m: Celery-Timeout ("Timed out waiting for UP message") am
  # 02.11.2026 13:00, als kellerio-wrk1 zu ~80 % ausgelastet war (NetBox ~2 Kerne);
  # der Request bestimmt den CPU-Anteil des Containers bei Konkurrenz.
  requests: { cpu: 500m, memory: 1Gi }
  # 1Gi war zu knapp: OOMKilled am 28.07.2026 um 13:35 kurz nach einem Rollout,
  # waehrend der Dauerverbrauch am 29.07. bei nur 529Mi lag. Der Ausschlag kommt
  # also vom Start (Index-/Migrations-Arbeit), nicht vom Normalbetrieb — gleiche
  # Klasse wie mailman-web, siehe apps/base/mailman/workload.yaml.
  # 1536Mi reichte nicht: OOMKilled am 26.10.2026 18:18 waehrend eines Massen-
  # Uploads (~170 PDFs, OCR mit 4 Seiten parallel); Pod stand davor bei 1,1Gi.
  # 3Gi ohne Reserve: memory.peak 3221200896 Byte (24 KiB unter dem Limit) im Pod
  # vom 28.10.2026, ohne OOM; Working-Set-Spitze im 1-min-Raster 2676Mi.
  limits: { memory: 4Gi }
# bjw-s common-library: ingress is a named map (main), not a flat block.
ingress:
  main:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.org/ssl-redirect: "true"
      nginx.org/redirect-to-https: "true"
      nginx.org/client-max-body-size: "100m"
      nginx.org/websocket-services: paperless-paperless-ngx # Upload-Fortschritt via /ws/status/; MUSS dem Service-Namen entsprechen
    hosts:
      - host: paperless.jit.services # CHANGE ME
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: main
              port: 8000
    tls:
      - hosts: [paperless.jit.services] # CHANGE ME
        secretName: paperless-tls
