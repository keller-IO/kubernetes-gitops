# Offsite-Backup der Belege: PVC expense-tracker-receipts -> Garage Potsdam, Bucket backup-expense-tracker.
#
#   files/current/          Spiegel von /data/receipts (rclone sync)
#   files/archive/<Zeit>/   von sync geloeschte/ueberschriebene Dateien, 30 Tage
#   files/last-run.txt      Heartbeat; beweist Schreibzugriff auch bei leerer PVC
#
# Die PVC war bei der Messung (02.11.2026) leer (nur lost+found); sie enthaelt kuenftig die
# Belege. Die Datenbank sichert CNPG (expense-pg, database.yaml/backup.yaml).
#
# expense-tracker-receipts ist RWO: der Pod muss auf dem Node der App laufen (podAffinity).
# Deployment und Service selektieren nur auf app.kubernetes.io/name=expense-tracker, deshalb
# traegt der Backup-Pod einen eigenen name-Wert. UID/GID 10001 wie die App (Dateien gehoeren
# root:10001, setgid, gruppenlesbar). Namespace-PSA: baseline, restricted-konform.
#
# Abgenommen am 02.11.2026 (Runbook backup-restore.md). Das Secret expense-tracker-files-backup-s3 liegt verschluesselt in Git und ist eingebunden
# (secret-generator.yaml). Fehlt ein Key im Secret oder stimmt der Name nicht, scheitert der Pod
# mit CreateContainerConfigError (KubeJobFailed); Ursache steht in den Pod-Events.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: expense-tracker-offsite-backup
  namespace: expense-tracker
  labels:
    app.kubernetes.io/name: expense-tracker-offsite-backup
    app.kubernetes.io/part-of: expense-tracker
    app.kubernetes.io/component: offsite-backup
spec:
  schedule: "0 5 * * *"
  timeZone: Europe/Berlin
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      # Abgeschlossene Jobs verschwinden nach 7 Tagen, damit ein laengst
      # abgeloester Fehllauf KubeJobFailed nicht dauerhaft aktiv haelt.
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          # Bewusst ohne app.kubernetes.io/instance und mit eigenem name-Wert:
          # Deployment und Service selektieren auf app.kubernetes.io/name=expense-tracker.
          labels:
            app.kubernetes.io/name: expense-tracker-offsite-backup
            app.kubernetes.io/part-of: expense-tracker
            app.kubernetes.io/component: offsite-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: expense-tracker
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: rclone
              image: rclone/rclone:1.75.2 # renovate: image=rclone/rclone
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  STAMP=$(date -u +%Y-%m-%dT%H%M%SZ)
                  rclone sync /data garage:backup-expense-tracker/files/current \
                    --exclude "/lost+found/**" \
                    --backup-dir "garage:backup-expense-tracker/files/archive/${STAMP}" \
                    --checksum --stats-one-line --stats 0 -v
                  rclone delete garage:backup-expense-tracker/files/archive --use-server-modtime --min-age 30d --rmdirs -v
                  date -u +%Y-%m-%dT%H:%M:%SZ > /tmp/last-run
                  rclone copyto /tmp/last-run garage:backup-expense-tracker/files/last-run.txt
                  rclone size garage:backup-expense-tracker
              env:
                - { name: HOME, value: /tmp }
                - { name: RCLONE_CONFIG, value: /tmp/rclone.conf } # existiert nicht (harmloser NOTICE); Remote kommt aus RCLONE_CONFIG_*
                - { name: RCLONE_CACHE_DIR, value: /tmp/cache }
                - { name: RCLONE_CONFIG_GARAGE_TYPE, value: s3 }
                - { name: RCLONE_CONFIG_GARAGE_PROVIDER, value: Other }
                - { name: RCLONE_CONFIG_GARAGE_ENDPOINT, value: "http://192.168.23.21:3900" }
                - { name: RCLONE_CONFIG_GARAGE_FORCE_PATH_STYLE, value: "true" }
                # Der Key darf keine Buckets anlegen; ohne no_check_bucket scheitert
                # rclone vor jedem Upload an CreateBucket (403).
                - { name: RCLONE_CONFIG_GARAGE_NO_CHECK_BUCKET, value: "true" }
                - name: RCLONE_CONFIG_GARAGE_REGION
                  valueFrom: { secretKeyRef: { name: expense-tracker-files-backup-s3, key: region } }
                - name: RCLONE_CONFIG_GARAGE_ACCESS_KEY_ID
                  valueFrom: { secretKeyRef: { name: expense-tracker-files-backup-s3, key: ACCESS_KEY_ID } }
                - name: RCLONE_CONFIG_GARAGE_SECRET_ACCESS_KEY
                  valueFrom: { secretKeyRef: { name: expense-tracker-files-backup-s3, key: SECRET_ACCESS_KEY } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: data, mountPath: /data, readOnly: true }
                - { name: tmp, mountPath: /tmp }
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: expense-tracker-receipts
            - name: tmp
              emptyDir: { sizeLimit: 256Mi }
