apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: expense-pg
  namespace: expense-tracker
spec:
  instances: 1 # 3 fuer HA
  # Explizit gepinnt: ohne imageName waehlt der Operator seine Default-Version.
  # Die steht dann nicht in Git, Renovate sieht sie nicht, und ein
  # Operator-Bump wechselt die DB-Version ungefragt. 17.2 ist exakt das, was
  # hier bereits laeuft -- der Pin aendert nichts, er schreibt es nur fest.
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Ohne resources ist der Pod BestEffort: bei Speicherdruck zuerst gekillt,
  # und der Scheduler bilanziert Nodes nur nach Requests.
  # Gemessen am 06.09.2026: 57Mi / 6m im Leerlauf.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: expenses
      owner: expenses
      secret:
        name: expense-db-app
  # Backup nach Garage-S3 analog zu den uebrigen Apps, aktiviert am 12.09.2026
  # mit eigenem Garage-Key cnpg-expense (RW nur auf den Bucket backups).
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-expense/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: expense-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: expense-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: expense-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
