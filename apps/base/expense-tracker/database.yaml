apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: expense-pg
  namespace: expense-tracker
spec:
  instances: 1 # 3 fuer HA
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: expenses
      owner: expenses
      secret:
        name: expense-db-app
  # Backup nach Garage-S3 analog zu den uebrigen Apps. Bewusst erst
  # aktivieren, wenn der Bucket-Pfad existiert — ein totes Archive-Target
  # staut WALs, bis die Disk voll ist.
  # backup:
  #   retentionPolicy: "30d"
  #   barmanObjectStore:
  #     destinationPath: s3://backups/cnpg-expense/
  #     endpointURL: http://192.168.23.21:3900
  #     s3Credentials:
  #       accessKeyId: { name: expense-backup-s3, key: ACCESS_KEY_ID }
  #       secretAccessKey: { name: expense-backup-s3, key: SECRET_ACCESS_KEY }
  #       region: { name: expense-backup-s3, key: region }
  #     wal: { compression: gzip }
  #     data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
