# Standalone Valkey fuer NetBox-Tasks (RQ) und -Cache. Anders als bei den uebrigen Apps mit
# Passwort: RQ deserialisiert Jobs per pickle, Schreibzugriff auf die Queue waere
# Codeausfuehrung im Worker, und im Cluster gibt es keine NetworkPolicy davor.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: netbox-valkey
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox-valkey
    app.kubernetes.io/component: cache
spec:
  serviceName: netbox-valkey
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: netbox-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: netbox-valkey
        app.kubernetes.io/component: cache
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: valkey
          image: valkey/valkey:9.2-alpine # renovate: image=valkey/valkey
          args: ["--appendonly", "yes", "--requirepass", "$(VALKEY_PASSWORD)"]
          env:
            - name: VALKEY_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: netbox-valkey
                  key: password
            # valkey-cli liest das Passwort aus dieser Variable (Readiness-Probe).
            - name: VALKEYCLI_AUTH
              valueFrom:
                secretKeyRef:
                  name: netbox-valkey
                  key: password
          ports:
            - name: valkey
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          livenessProbe:
            tcpSocket:
              port: valkey
            initialDelaySeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            exec:
              # grep, weil auch eine NOAUTH-Antwort sonst als Erfolg zaehlen kann.
              command: ["sh", "-c", "valkey-cli ping | grep -q PONG"]
            initialDelaySeconds: 5
            # 3 s statt 1 s: der Default loeste 24 Timeout-Events in 16 h aus.
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Explizit, siehe docs/learnings/argocd-dauerhaft-outofsync.md.
        volumeMode: Filesystem
        storageClassName: ceph-rbd
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: netbox-valkey
  namespace: netbox
  labels:
    app.kubernetes.io/name: netbox-valkey
    app.kubernetes.io/component: cache
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: netbox-valkey
  ports:
    - name: valkey
      port: 6379
      targetPort: valkey
