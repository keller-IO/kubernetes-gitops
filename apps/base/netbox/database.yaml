apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: netbox-pg
  namespace: netbox
spec:
  instances: 2
  # Zwei Instanzen (Primary + Standby), damit ein Node-Drain per Switchover
  # statt als DB-Ausfall laeuft. required: Standby landet nie auf dem Node des
  # Primary.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
  primaryUpdateMethod: switchover
  primaryUpdateStrategy: unsupervised
  imageName: ghcr.io/cloudnative-pg/postgresql:17.11 # renovate: image=ghcr.io/cloudnative-pg/postgresql
  # Startwert wie ciso-assistant-pg; nach der ersten Betriebswoche per
  # `kubectl top` nachziehen.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi
  # WAL-Obergrenze fuer Replikationsslots (13.11.2026): Ohne Limit (-1) haelt der
  # HA-Slot des Standbys bei dessen Ausfall unbegrenzt WAL zurueck, pg_wal waechst
  # auf dem Datenvolume, bis es voll ist und der Primary steht (12.07.: roundcube-pg
  # mit 2 Gi so vollgelaufen). 5-Gi-Volume, Daten <0,1 GB, pg_wal normal ~0,6 GB: 2GB laesst genug Reserve (4,2 GiB frei).
  # Kehrseite: wird die Grenze ueberschritten, wird der Slot invalidiert
  # (wal_status=lost); das Replica holt sich das WAL dann aus dem Archiv bzw. wird
  # neu aufgebaut. Gewollt: ein voller Primary waere schlimmer. Parameter ist
  # sighup (Reload, kein Neustart/Switchover); muss > wal_keep_size (512MB) und
  # max_wal_size sein.
  postgresql:
    parameters:
      max_slot_wal_keep_size: "2GB"
  storage:
    size: 5Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: netbox
      owner: netbox
      secret:
        name: netbox-db-app
  # Backup nach Garage-S3 in einen EIGENEN Bucket mit eigenem Key (RW nur auf
  # diesen Bucket, 20 GiB Quota). Schema siehe docs/runbooks/backup-restore.md.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backup-netbox/cnpg/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: netbox-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: netbox-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: netbox-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
