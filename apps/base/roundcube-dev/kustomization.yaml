apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: roundcube-dev
# Zweite, bewusst wegwerfbare Roundcube-Instanz. Sie zeigt auf mail05, den
# neuen Mailbox-Store, waehrend die produktive Instanz weiter auf mail04
# zeigt. Zweck ist der Test des Cutovers mit einem echten IMAP-Client.
#
# Bewusst NICHT uebernommen von apps/base/roundcube:
#   - CNPG-Datenbank: hier reicht SQLite in einem emptyDir. Die Instanz haelt
#     nichts, was ein Backup wert waere; ein Neustart setzt sie zurueck.
#   - backup.yaml / cache.yaml: dito.
#   - Die Plugins password und virtuser_query. Beide brauchen Zugang zur
#     produktiven MySQL, und ein Testsystem hat auf der nichts zu suchen -
#     schon gar nicht mit Schreibrecht auf Passwoerter.
resources:
  - namespace.yaml
  - configmap.yaml
  - workload.yaml

generators:
  - ./secret-generator.yaml
