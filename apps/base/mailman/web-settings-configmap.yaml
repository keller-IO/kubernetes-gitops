# Web-Anpassungen aus dem Altsystem 192.168.2.15
# (/opt/containers/mailman/web-data/settings_local.py + no_signup_adapter.py).
# settings.py des maxking-Images macht am Ende `from settings_local import *`,
# diese Werte gewinnen also gegen die Image-Defaults.
#
# Bewusst NICHT übernommen: DEBUG=True aus dem Alt-Compose.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mailman-web-settings
  namespace: mailman
data:
  settings_local.py: |
    import sys

    # no_signup_adapter.py liegt daneben im selben Verzeichnis.
    sys.path.insert(0, "/opt/mailman-web-data")

    # Das lokale Template begrenzt nur den indexierten Mailbody. Die
    # Archivansicht und der Datenbankinhalt bleiben vollstaendig.
    import settings as _base_settings

    TEMPLATES = _base_settings.TEMPLATES
    TEMPLATES[0]["DIRS"] = ["/opt/mailman-web-data/templates"]

    LANGUAGE_CODE = "de-de"

    # Keine Social-Logins.
    MAILMAN_WEB_SOCIAL_AUTH = []

    # Der Image-Default startet sonst einen Worker pro Node-CPU. Das erzeugte
    # zusammen mit den periodischen HyperKitty-Jobs die OOM-Spitzen. Vollständig
    # definieren statt update(): settings_local.py ist ein eigenes Modul und
    # sieht Q_CLUSTER aus settings.py beim Import nicht.
    Q_CLUSTER = {
        "workers": 1,
        "recycle": 100,
        "timeout": 300,
        "retry": 360,
        "max_attempts": 3,
        "save_limit": 100,
        "orm": "default",
    }

    # Ausgehende Mail (Passwort-Reset etc.) über mx02, IP-Relay via mynetworks.
    EMAIL_BACKEND = "django.core.mail.backends.smtp.EmailBackend"
    EMAIL_HOST = "192.168.2.209"
    EMAIL_PORT = 25
    EMAIL_USE_TLS = False
    EMAIL_USE_SSL = False

    DEFAULT_FROM_EMAIL = "postmaster@lists.jitmail.de"
    SERVER_EMAIL = "postmaster@lists.jitmail.de"

    # Anti-Spam: öffentliche Registrierung in Postorius deaktivieren.
    # Bestehende Accounts können weiter einloggen.
    ACCOUNT_ADAPTER = "no_signup_adapter.DisableSignupAdapter"
    ACCOUNT_EMAIL_VERIFICATION = "mandatory"
    ACCOUNT_UNIQUE_EMAIL = True

    # HyperKitty prüft die Quell-IP der Archiver-Requests gegen
    # MAILMAN_ARCHIVER_FROM. settings.py setzt dafür
    # gethostbyname(MAILMAN_HOSTNAME) — in Kubernetes ist das die ClusterIP des
    # Service `mailman-core`, der Request kommt aber von der POD-IP. Ohne diese
    # Zeile antwortet HyperKitty mit 403 und nichts wird archiviert.
    # Die Prüfung ist eine reine Stringliste (kein CIDR), Pod-IPs sind
    # dynamisch — deshalb "*". Die Authentisierung über MAILMAN_ARCHIVER_KEY
    # (HYPERKITTY_API_KEY, aus dem sops-Secret) bleibt davon unberührt, und der
    # Dienst ist ohnehin nur clusterintern erreichbar.
    MAILMAN_ARCHIVER_FROM = ("*",)
  no_signup_adapter.py: |
    from allauth.account.adapter import DefaultAccountAdapter


    class DisableSignupAdapter(DefaultAccountAdapter):
        def is_open_for_signup(self, request):
            return False
  email_text.txt: |
    {% load hk_haystack %}
    {{ object.subject|nolongterms }}
    {{ object.sender_name|nolongterms }}
    {{ object.content|slice:":1048576"|nolongterms }}
    {% for att in object.attachments.all %}
        {{ att.name|nolongterms }}
    {% endfor %}
  uwsgi.ini: |
    [uwsgi]
    # Port on which uwsgi will be listening.
    uwsgi-socket = 0.0.0.0:8080
    http-socket = 0.0.0.0:8000

    # Enable threading for python
    enable-threads = true

    # Setting uwsgi buffer size to what Apache2 supports.
    buffer-size = 8190

    # Move to the directory where the django files are.
    chdir = /opt/mailman-web

    # Use the wsgi file provided with the django project.
    wsgi-file = wsgi.py

    # Setup default number of processes and threads per process.
    master = true
    processes = 2
    threads = 2

    # Drop privileges and don't run as root.
    uid = mailman
    gid = mailman

    # Setup the django_q related worker processes.
    attach-daemon = ./manage.py qcluster

    # Setup hyperkitty's cron jobs.
    # 'minutely' jobs are run hourly for perf reasons.
    # See https://github.com/maxking/docker-mailman/issues/327
    unique-cron = 0 -1 -1 -1 -1 ./manage.py runjobs minutely
    unique-cron = -15 -1 -1 -1 -1 ./manage.py runjobs quarter_hourly
    # GEAENDERT gegenueber dem Image (Original: `runjobs hourly`).
    #
    # `runjobs hourly` fuehrt DREI HyperKitty-Jobs aus: new_lists_from_mailman,
    # thread_starting_email und update_index. Der letzte baut den
    # Whoosh-Volltextindex fort und ist die Ursache der OOM-Schleife dieses
    # Pods: 1049 Laeufe gestartet, nur 400 beendet, der Index seit 31.07.2026
    # unveraendert. Details in docs/learnings/mailman-whoosh-reindex-performance.md.
    #
    # Deshalb hier die beiden guenstigen Jobs einzeln per `runjob`, und
    # update_index bewusst NICHT. Der Volltextindex wird ausserhalb dieses Pods
    # neu gebaut; bis dahin bleibt die Suche auf dem Stand vom 31.07.2026 --
    # genau wie vorher, nur ohne das Frontend stuendlich mitzureissen.
    unique-cron = 0 -1 -1 -1 -1 ./manage.py runjob hyperkitty new_lists_from_mailman
    unique-cron = 0 -1 -1 -1 -1 ./manage.py runjob hyperkitty thread_starting_email
    unique-cron = 0 0 -1 -1 -1 ./manage.py runjobs daily
    unique-cron = 0 0 1 -1 -1 ./manage.py runjobs monthly
    unique-cron = 0 0 -1 -1 0 ./manage.py runjobs weekly
    unique-cron = 0 0 1 1 -1 ./manage.py runjobs yearly

    # Setup the request log.
    req-logger = file:/opt/mailman-web-data/logs/uwsgi.log

    # Log cron seperately.
    logger = cron file:/opt/mailman-web-data/logs/uwsgi-cron.log
    log-route = cron uwsgi-cron

    # Log qcluster commands seperately.
    logger = qcluster file:/opt/mailman-web-data/logs/uwsgi-qcluster.log
    log-route = qcluster uwsgi-daemons

    # Last log and it logs the rest of the stuff.
    logger = file:/opt/mailman-web-data/logs/uwsgi-error.log
