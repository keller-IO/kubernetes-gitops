apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mailman-pg
  namespace: mailman
spec:
  instances: 1 # 3 for HA
  # Ohne resources ist der Pod BestEffort und wird bei Node-Speicherdruck als
  # ERSTES gekillt; der Scheduler bilanziert Nodes ausserdem nur nach Requests.
  # Genau das traf am 28.07.2026 die MariaDB-Pods (Exit 137).
  # Gemessen am 28.07.2026: ~185Mi im Betrieb.
  # Limit von 512Mi auf 2Gi angehoben (28.07.2026): der Probelauf des
  # Archivimports hat den Pod OOMKilled (Exit 137). Der Betriebswert stimmt
  # weiterhin, aber der Import ist etwas anderes — das groesste HyperKitty-
  # Attachment ist 15 MB, und ein INSERT mit mehreren solchen Zeilen plus
  # WAL und Sortierpuffern sprengt 512Mi. Nach Abschluss der Migration kann
  # das Limit wieder sinken, die Requests bleiben am Betriebswert.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 2Gi
  # PG 16 wie das Alt-System: der psql im maxking-Image (PG16-Client) bricht
  # an PG-17-Servern (\l nutzt daticulocale, in 17 umbenannt) — und der
  # pg_dump-Import kommt ebenfalls aus einer 16er.
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:16.6
  storage:
    # 30Gi: das HyperKitty-Archiv des Altsystems bringt 5,9 GB Rohdaten mit
    # (4,3 GB Mail-Bodies + 1,6 GB Anhänge als BYTEA), dazu Indizes, WAL und
    # der Spitzenbedarf während des Imports. 10Gi waren dafür zu knapp.
    size: 30Gi
    storageClass: ceph-rbd # CNPG-Feld heißt storageClass (nicht storageClassName)
  bootstrap:
    initdb:
      database: mailmandb
      owner: mailman
      secret:
        name: mailman-db-app
  # Kontinuierliches Backup nach Garage-S3 (192.168.23.21, Bucket backups).
  # WICHTIG: erst reaktiviert, seit das externe S3 existiert (13.07.) — ein
  # kaputtes Archive-Target würde WALs stauen bis die Disk voll ist.
  backup:
    retentionPolicy: "30d"
    barmanObjectStore:
      destinationPath: s3://backups/cnpg-mailman/
      endpointURL: http://192.168.23.21:3900
      s3Credentials:
        accessKeyId: { name: mailman-backup-s3, key: ACCESS_KEY_ID }
        secretAccessKey: { name: mailman-backup-s3, key: SECRET_ACCESS_KEY }
        region: { name: mailman-backup-s3, key: region } # Garage erzwingt Region-Match bei HeadBucket
      wal: { compression: gzip }
      data: { compression: gzip }
  monitoring:
    enablePodMonitor: true
---
# Zweite Datenbank für Django/Postorius/HyperKitty — wie im Altsystem, das
# ebenfalls `mailman` (Core) und `mailmanweb` (Web) trennt. Getrennte DBs, weil
# Core- und Django-Schema unabhängig voneinander migriert und wiederhergestellt
# werden müssen; das Web-Schema kommt beim Import aus einer 5,9-GB-SQLite.
# databaseReclaimPolicy: retain — das Löschen des CR darf niemals das Archiv
# mitnehmen.
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: mailmanweb
  namespace: mailman
spec:
  cluster:
    name: mailman-pg
  name: mailmanweb
  owner: mailman
  encoding: UTF8
  ensure: present
  databaseReclaimPolicy: retain
