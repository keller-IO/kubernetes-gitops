apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailman-core
  namespace: mailman
spec:
  replicas: 1 # do not scale: Mailman core must not share /opt/mailman across processes
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: mailman-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailman-core }
    spec:
      containers:
        - name: mailman-core
          # Mailman 3.3.10 / alembic 8cc1f79f4459. Upgrade auf einer restaurierten
          # Produktionskopie einschließlich PostgreSQL-Schema-Reparatur verifiziert.
          # renovate: ignore
          image: maxking/mailman-core@sha256:cb8e412bb18d74480f996da68f46e92473b6103995e71bc5aeba139b255cc3d2
          ports:
            - name: api
              containerPort: 8001
            - name: lmtp
              containerPort: 8024
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-db-app, key: password } }
            - name: DATABASE_URL
              value: postgresql://mailman:$(DB_PASSWORD)@mailman-pg-rw:5432/mailmandb
            - name: DATABASE_TYPE
              value: postgres
            - name: DATABASE_CLASS
              value: mailman.database.postgresql.PostgreSQLDatabase
            # LMTP/REST an alle Interfaces binden. NICHT den Service-Namen nehmen:
            # der löst in k8s auf die (nicht bindbare) ClusterIP auf -> core crasht
            # mit "could not bind on 8024". Erreichbarkeit läuft über die Services
            # (mailman-core:8001 REST, mailman-lmtp:8024 LoadBalancer).
            - name: MM_HOSTNAME
              value: 0.0.0.0
            - name: MAILMAN_REST_PORT
              value: "8001"
            - name: MAILMAN_REST_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_USER } }
            - name: MAILMAN_REST_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_PASSWORD } }
            - name: HYPERKITTY_API_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: HYPERKITTY_API_KEY } }
            - name: HYPERKITTY_URL
              value: http://mailman-web:8000/hyperkitty
            - name: MTA
              value: postfix
            # Outbound wie im Alt-Setup: mx02 relayt IP-basiert (mynetworks),
            # kein Auth/TLS auf dem internen Hop.
            - name: SMTP_HOST
              value: 192.168.2.209 # mx02.jitcreatives.de
            - name: SMTP_PORT
              value: "25"
            - name: DEFAULT_FROM_EMAIL
              value: postmaster@lists.jitmail.de
            - name: SERVER_EMAIL
              value: postmaster@lists.jitmail.de
          resources:
            # Gemessen am 28.07.2026: 916Mi — der Request von 512Mi untertrieb den
            # Verbrauch um Faktor 1,8 und liess den Scheduler wrk2 fuer frei halten.
            requests: { cpu: 150m, memory: 1Gi }
            limits: { memory: 1536Mi } # 768Mi war zu knapp -> OOMKilled beim Start (13.07.)
          volumeMounts:
            - name: core-data
              mountPath: /opt/mailman
          # Der Start wartet auf Postgres und richtet die DB ein; nach dem
          # Import kommt ein restauriertes Schema dazu. Liveness erst danach.
          # Die Probes pruefen BEIDE Ports, nicht nur die REST-API. Beim
          # Mail-Cutover am 29.07.2026 ist der LMTP-Runner beim Podstart mit
          # "TimeoutError: SMTP server started, but not responding within
          # allotted time" (aiosmtpd ready_timeout) abgestuerzt und nicht
          # wiedergekommen. Port 8001 lief weiter, der Pod galt als gesund —
          # waehrend Postfix jede Listenmail mit "Connection refused" auf 8024
          # zurueckstellte. Ein Ausfall des Maileingangs darf nicht unsichtbar
          # sein; mit dieser Probe startet der Pod sich in dem Fall selbst neu.
          startupProbe:
            exec:
              command: ["sh", "-c", "netstat -tln | grep -q ':8001 ' && netstat -tln | grep -q ':8024 '"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["sh", "-c", "netstat -tln | grep -q ':8001 ' && netstat -tln | grep -q ':8024 '"]
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            exec:
              command: ["sh", "-c", "netstat -tln | grep -q ':8001 ' && netstat -tln | grep -q ':8024 '"]
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: core-data
          persistentVolumeClaim:
            claimName: mailman-core-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailman-web
  namespace: mailman
spec:
  replicas: 1 # web data includes static files, logs and diskcache
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: mailman-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailman-web }
      annotations:
        # settings_local.py wird vom initContainer ins PVC kopiert. Eine reine
        # ConfigMap-Aenderung startet den Pod nicht neu, deshalb Revision bumpen.
        mailman.jit.services/settings-revision: "20260801-search-body-limit"
    spec:
      # Die lokalen Konfigurationsdateien werden in das PVC KOPIERT, statt sie
      # per subPath aus der ConfigMap zu mounten. Grund: das Entrypoint macht
      # `chown mailman:mailman /opt/mailman-web-data -R` und läuft mit `set -e`
      # — auf einem read-only ConfigMap-Mount scheitert das und der Container
      # geht in CrashLoopBackOff. Der initContainer überschreibt bei jedem
      # Podstart, die ConfigMap bleibt also die Quelle der Wahrheit.
      initContainers:
        - name: install-settings
          # renovate: ignore
          image: maxking/mailman-web@sha256:014726db85586fb53541f66f6ce964bf07e939791cfd5ffc796cd6d243696a18
          command: ["/bin/sh", "-ec"]
          args:
            - |
              install -d /opt/mailman-web-data/templates/search/indexes/hyperkitty
              cp /config/settings_local.py /config/no_signup_adapter.py /opt/mailman-web-data/
              cp /config/email_text.txt /opt/mailman-web-data/templates/search/indexes/hyperkitty/
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          volumeMounts:
            - name: web-data
              mountPath: /opt/mailman-web-data
            - name: web-settings
              mountPath: /config
              readOnly: true
      containers:
        - name: mailman-web
          # Django 4.2.16 / HyperKitty 1.3.12 / Postorius 1.3.13; die Migration
          # von 73 auf 98 django_migrations wurde auf einer Restore-Kopie geprüft.
          # renovate: ignore
          image: maxking/mailman-web@sha256:014726db85586fb53541f66f6ce964bf07e939791cfd5ffc796cd6d243696a18
          ports:
            - name: http
              containerPort: 8000
            - name: uwsgi
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-db-app, key: password } }
            # Eigene DB, getrennt vom Core-Schema (siehe database.yaml).
            - name: DATABASE_URL
              value: postgresql://mailman:$(DB_PASSWORD)@mailman-pg-rw:5432/mailmanweb
            - name: DATABASE_TYPE
              value: postgres
            - name: SERVE_FROM_DOMAIN
              value: lists.jitmail.de
            - name: DJANGO_ALLOWED_HOSTS
              value: lists.jitmail.de,lists.jit.services,localhost,127.0.0.1
            - name: MAILMAN_REST_URL
              value: http://mailman-core:8001
            - name: MAILMAN_REST_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_USER } }
            - name: MAILMAN_REST_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_PASSWORD } }
            - name: MAILMAN_HOSTNAME
              value: mailman-core
            - name: POSTORIUS_TEMPLATE_BASE_URL
              value: http://mailman-web:8000
            - name: HYPERKITTY_API_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: HYPERKITTY_API_KEY } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: SECRET_KEY } }
            - name: MAILMAN_ADMIN_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_ADMIN_USER } }
            - name: MAILMAN_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_ADMIN_EMAIL } }
            - name: SMTP_HOST
              value: 192.168.2.209 # mx02.jitcreatives.de (IP-basiertes Relay via mynetworks)
            - name: SMTP_PORT
              value: "25"
            - name: SMTP_USE_TLS
              value: "False"
            - name: UWSGI_STATIC_MAP
              value: /static=/opt/mailman-web-data/static
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            # 0.5.2 überschritt beim produktiven Start zweimal 1536Mi, während
            # Migrationen/collectstatic und Django-Q gleichzeitig anliefen.
            limits: { memory: 2Gi }
          volumeMounts:
            # settings_local.py, no_signup_adapter.py und das begrenzte
            # Haystack-Template liegen hier drin — der initContainer kopiert
            # sie aus der ConfigMap hinein. Das
            # Entrypoint kopiert settings_local.py von hier weiter nach
            # /opt/mailman-web/, und settings_local.py legt dieses Verzeichnis
            # auf den sys.path, damit no_signup_adapter importierbar ist.
            - name: web-data
              mountPath: /opt/mailman-web-data
          # Der Start macht collectstatic --clear, compress und `manage.py
          # migrate`. Die Liveness darf dabei NICHT hineinfunken — ein Kill
          # mitten in der Migration hinterlässt ein halb angewandtes Schema.
          # Deshalb startupProbe: bis zu 10 min, erst danach greift Liveness.
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - { name: Host, value: localhost }
            periodSeconds: 10
            timeoutSeconds: 15 # ohne das greift der Kubernetes-Default 1 s
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders: # kube-probe sendet sonst die Pod-IP als Host -> Django 400 (ALLOWED_HOSTS)
                - { name: Host, value: localhost }
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 4
          # URSACHE der 37 Neustarts in 9 Tagen (28.07. analysiert): uwsgi
          # protokolliert Requests in Dateien, nicht auf stdout — im Containerlog
          # war deshalb nichts zu sehen, nur "Completed/Exit 0". In
          # web-data/logs/uwsgi-error.log stehen 34x "SIGINT/SIGTERM
          # received...killing workers": die Liveness lief mit dem Default
          # timeoutSeconds=1 gegen eine Django-App, die vereinzelt >10 s braucht
          # (gemessen bis 16,8 s), bei nur 1-2 uwsgi-Workern. 3 Timeouts in 30 s
          # -> SIGTERM -> uwsgi fährt sauber herunter -> Exit 0. Mit dem
          # Alt-Image (processes = 1) wäre das noch häufiger passiert.
          #
          # 18.08.2026: die damals gewählten 10 s reichten NICHT — der Pod
          # stand bei 429 Neustarts. 10 s liegen unter der oben gemessenen
          # Spitze von 16,8 s, jeder solche Request zählte also weiter als
          # Fehlschlag. Liveness daher auf 30 s (deutlich über der Spitze),
          # Readiness auf 15 s (dort ist ein Timeout harmlos: der Pod fällt
          # kurz aus dem Service, statt gekillt zu werden). Die startupProbe
          # hatte gar kein timeoutSeconds und lief damit auf dem Default 1 s
          # gegen einen Start mit collectstatic/compress/migrate.
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - { name: Host, value: localhost }
            periodSeconds: 30
            timeoutSeconds: 30
            failureThreshold: 6
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: mailman-web-data
        - name: web-settings
          configMap:
            name: mailman-web-settings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-core-data
  namespace: mailman
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd # CHANGE ME
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-web-data
  namespace: mailman
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      # 20Gi: der Whoosh-Volltextindex lag im Altsystem bei 2,3 GB und wächst
      # mit dem Archiv; dazu static/ und diskcache.
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mailman-core
  namespace: mailman
spec:
  selector: { app.kubernetes.io/name: mailman-core }
  ports:
    - name: api
      port: 8001
      targetPort: api
    - name: lmtp
      port: 8024
      targetPort: lmtp
---
# LMTP-Eingang für die externen Annahme-MTAs (mail04/mail05/.15-Postfix):
# feste LB-IP aus dem Cilium-Pool, Transport dort = lmtp:[192.168.2.247]:8024
apiVersion: v1
kind: Service
metadata:
  name: mailman-lmtp
  namespace: mailman
  annotations:
    lbipam.cilium.io/ips: 192.168.2.247
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: mailman-core }
  ports:
    - name: lmtp
      port: 8024
      targetPort: lmtp
---
apiVersion: v1
kind: Service
metadata:
  name: mailman-web
  namespace: mailman
spec:
  selector: { app.kubernetes.io/name: mailman-web }
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: uwsgi
      port: 8080
      targetPort: uwsgi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailman
  namespace: mailman
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lists.jit.services] # CHANGE ME
      secretName: mailman-tls
  rules:
    - host: lists.jit.services # CHANGE ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: mailman-web, port: { number: 8000 } } }
