apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailman-core
  namespace: mailman
spec:
  replicas: 1 # do not scale: Mailman core must not share /opt/mailman across processes
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: mailman-core }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailman-core }
    spec:
      containers:
        - name: mailman-core
          # MIGRATIONSSTAND — bewusst auf den Alt-Stand von 192.168.2.15 gepinnt:
          # GNU Mailman 3.3.4, alembic 2b73fbcc97c9. Damit geht der pg_dump des
          # Altsystems 1:1 hinein, ohne Schema-Upgrade beim Import.
          # Der Digest ist maxking/mailman-core:latest vom 07.04.2021 — genau das
          # Image, das auf .15 läuft. `latest` wurde seither nie neu gepusht, ist
          # als Tag aber nicht stabil, deshalb Digest-Pinning.
          # Upgrade auf 0.5.2 (Mailman 3.3.10) erst NACH abgeschlossener Migration
          # und getrennt davon. Renovate darf hier nicht anfassen.
          # renovate: ignore
          image: maxking/mailman-core@sha256:34b5c3af84cce9b3d3a758e12cb4edeabbc1559b4fba14cb85532471b5a0f199
          ports:
            - name: api
              containerPort: 8001
            - name: lmtp
              containerPort: 8024
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-db-app, key: password } }
            - name: DATABASE_URL
              value: postgresql://mailman:$(DB_PASSWORD)@mailman-pg-rw:5432/mailmandb
            - name: DATABASE_TYPE
              value: postgres
            - name: DATABASE_CLASS
              value: mailman.database.postgresql.PostgreSQLDatabase
            # LMTP/REST an alle Interfaces binden. NICHT den Service-Namen nehmen:
            # der löst in k8s auf die (nicht bindbare) ClusterIP auf -> core crasht
            # mit "could not bind on 8024". Erreichbarkeit läuft über die Services
            # (mailman-core:8001 REST, mailman-lmtp:8024 LoadBalancer).
            - name: MM_HOSTNAME
              value: 0.0.0.0
            - name: MAILMAN_REST_PORT
              value: "8001"
            - name: MAILMAN_REST_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_USER } }
            - name: MAILMAN_REST_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_PASSWORD } }
            - name: HYPERKITTY_API_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: HYPERKITTY_API_KEY } }
            - name: HYPERKITTY_URL
              value: http://mailman-web:8000/hyperkitty
            - name: MTA
              value: postfix
            # Outbound wie im Alt-Setup: mx02 relayt IP-basiert (mynetworks),
            # kein Auth/TLS auf dem internen Hop.
            - name: SMTP_HOST
              value: 192.168.2.209 # mx02.jitcreatives.de
            - name: SMTP_PORT
              value: "25"
            - name: DEFAULT_FROM_EMAIL
              value: postmaster@lists.jitmail.de
            - name: SERVER_EMAIL
              value: postmaster@lists.jitmail.de
          resources:
            # Gemessen am 28.07.2026: 916Mi — der Request von 512Mi untertrieb den
            # Verbrauch um Faktor 1,8 und liess den Scheduler wrk2 fuer frei halten.
            requests: { cpu: 150m, memory: 1Gi }
            limits: { memory: 1536Mi } # 768Mi war zu knapp -> OOMKilled beim Start (13.07.)
          volumeMounts:
            - name: core-data
              mountPath: /opt/mailman
          # Der Start wartet auf Postgres und richtet die DB ein; nach dem
          # Import kommt ein restauriertes Schema dazu. Liveness erst danach.
          startupProbe:
            tcpSocket:
              port: api
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: api
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            tcpSocket:
              port: api
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: core-data
          persistentVolumeClaim:
            claimName: mailman-core-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mailman-web
  namespace: mailman
spec:
  replicas: 1 # web data includes static files, logs and diskcache
  strategy:
    type: Recreate
  selector:
    matchLabels: { app.kubernetes.io/name: mailman-web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: mailman-web }
    spec:
      containers:
        - name: mailman-web
          # MIGRATIONSSTAND — Alt-Stand von 192.168.2.15: Django 2.2.20,
          # HyperKitty 1.3.4, Postorius 1.3.4, 73 django_migrations. Der
          # Container legt damit in `mailmanweb` exakt das Schema an, das die
          # 5,9-GB-SQLite des Altsystems mitbringt; der Import ist dadurch ein
          # reines Datenkopieren ohne Schemaanpassung.
          # Digest = maxking/mailman-web:latest vom 07.04.2021.
          # Upgrade auf 0.5.2 (Django 4.2 / HyperKitty 1.3.12, 99 Migrationen)
          # erst nach dem Import, als eigener Schritt.
          # renovate: ignore
          image: maxking/mailman-web@sha256:3b240e44635f229a04fd7eb2dc4389ddb115d10c4bc1462577cc5c8b501ff0a0
          ports:
            - name: http
              containerPort: 8000
            - name: uwsgi
              containerPort: 8080
          env:
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-db-app, key: password } }
            # Eigene DB, getrennt vom Core-Schema (siehe database.yaml).
            - name: DATABASE_URL
              value: postgresql://mailman:$(DB_PASSWORD)@mailman-pg-rw:5432/mailmanweb
            - name: DATABASE_TYPE
              value: postgres
            - name: SERVE_FROM_DOMAIN
              value: lists.jitmail.de
            - name: DJANGO_ALLOWED_HOSTS
              value: lists.jitmail.de,lists.jit.services,localhost,127.0.0.1
            - name: MAILMAN_REST_URL
              value: http://mailman-core:8001
            - name: MAILMAN_REST_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_USER } }
            - name: MAILMAN_REST_PASSWORD
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_REST_PASSWORD } }
            - name: MAILMAN_HOSTNAME
              value: mailman-core
            - name: POSTORIUS_TEMPLATE_BASE_URL
              value: http://mailman-web:8000
            - name: HYPERKITTY_API_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: HYPERKITTY_API_KEY } }
            - name: SECRET_KEY
              valueFrom: { secretKeyRef: { name: mailman-secret, key: SECRET_KEY } }
            - name: MAILMAN_ADMIN_USER
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_ADMIN_USER } }
            - name: MAILMAN_ADMIN_EMAIL
              valueFrom: { secretKeyRef: { name: mailman-secret, key: MAILMAN_ADMIN_EMAIL } }
            - name: SMTP_HOST
              value: 192.168.2.209 # mx02.jitcreatives.de (IP-basiertes Relay via mynetworks)
            - name: SMTP_PORT
              value: "25"
            - name: SMTP_USE_TLS
              value: "False"
            - name: UWSGI_STATIC_MAP
              value: /static=/opt/mailman-web-data/static
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { memory: 1536Mi } # Django-Migrations/collectstatic spiken beim Start
          volumeMounts:
            - name: web-data
              mountPath: /opt/mailman-web-data
            # settings.py macht am Ende `from settings_local import *` und
            # settings_local.py legt /opt/mailman-web-data auf den sys.path,
            # damit no_signup_adapter importierbar ist. Beide per subPath in das
            # PVC-Verzeichnis, wie im Altsystem.
            - name: web-settings
              mountPath: /opt/mailman-web-data/settings_local.py
              subPath: settings_local.py
              readOnly: true
            - name: web-settings
              mountPath: /opt/mailman-web-data/no_signup_adapter.py
              subPath: no_signup_adapter.py
              readOnly: true
          # Der Start macht collectstatic --clear, compress und `manage.py
          # migrate`. Die Liveness darf dabei NICHT hineinfunken — ein Kill
          # mitten in der Migration hinterlässt ein halb angewandtes Schema.
          # Deshalb startupProbe: bis zu 10 min, erst danach greift Liveness.
          startupProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - { name: Host, value: localhost }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders: # kube-probe sendet sonst die Pod-IP als Host -> Django 400 (ALLOWED_HOSTS)
                - { name: Host, value: localhost }
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          # URSACHE der 37 Neustarts in 9 Tagen (28.07. analysiert): uwsgi
          # protokolliert Requests in Dateien, nicht auf stdout — im Containerlog
          # war deshalb nichts zu sehen, nur "Completed/Exit 0". In
          # web-data/logs/uwsgi-error.log stehen 34x "SIGINT/SIGTERM
          # received...killing workers": die Liveness lief mit dem Default
          # timeoutSeconds=1 gegen eine Django-App, die vereinzelt >10 s braucht
          # (gemessen bis 16,8 s), bei nur 1-2 uwsgi-Workern. 3 Timeouts in 30 s
          # -> SIGTERM -> uwsgi fährt sauber herunter -> Exit 0. Mit dem
          # Alt-Image (processes = 1) wäre das noch häufiger passiert.
          livenessProbe:
            httpGet:
              path: /
              port: http
              httpHeaders:
                - { name: Host, value: localhost }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
      volumes:
        - name: web-data
          persistentVolumeClaim:
            claimName: mailman-web-data
        - name: web-settings
          configMap:
            name: mailman-web-settings
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-core-data
  namespace: mailman
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd # CHANGE ME
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mailman-web-data
  namespace: mailman
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: ceph-rbd
  resources:
    requests:
      # 20Gi: der Whoosh-Volltextindex lag im Altsystem bei 2,3 GB und wächst
      # mit dem Archiv; dazu static/ und diskcache.
      storage: 20Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mailman-core
  namespace: mailman
spec:
  selector: { app.kubernetes.io/name: mailman-core }
  ports:
    - name: api
      port: 8001
      targetPort: api
    - name: lmtp
      port: 8024
      targetPort: lmtp
---
# LMTP-Eingang für die externen Annahme-MTAs (mail04/mail05/.15-Postfix):
# feste LB-IP aus dem Cilium-Pool, Transport dort = lmtp:[192.168.2.247]:8024
apiVersion: v1
kind: Service
metadata:
  name: mailman-lmtp
  namespace: mailman
  annotations:
    lbipam.cilium.io/ips: 192.168.2.247
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: mailman-core }
  ports:
    - name: lmtp
      port: 8024
      targetPort: lmtp
---
apiVersion: v1
kind: Service
metadata:
  name: mailman-web
  namespace: mailman
spec:
  selector: { app.kubernetes.io/name: mailman-web }
  ports:
    - name: http
      port: 8000
      targetPort: http
    - name: uwsgi
      port: 8080
      targetPort: uwsgi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mailman
  namespace: mailman
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.org/ssl-redirect: "false"
    nginx.org/redirect-to-https: "true"
    nginx.org/client-max-body-size: "50m"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [lists.jit.services] # CHANGE ME
      secretName: mailman-tls
  rules:
    - host: lists.jit.services # CHANGE ME
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: mailman-web, port: { number: 8000 } } }
